# SlumsMS server template configuration.
#
# Copy this file to config.yaml (see README.md:10) and edit the database and
# host settings. It is a complete template: EVERY field declared in
# src/main/java/config/ServerConfig.java and src/main/java/config/WorldConfig.java
# appears here exactly once, in the source's own field order.
#
# That completeness is a requirement, not a courtesy. YamlConfig.java:19-29 reads
# this file with a plain YamlReader and no strictness, so a key that is missing
# from config.yaml does NOT fall back to a documented default: the field keeps the
# JVM default, which is 0 or false for every field without an inline initialiser.
# A missing ITEM_EXPIRE_CHECK is 0 ms, and TimerManager.register throws on a 0
# period inside MapleMap.addPlayer, which aborts the rest of the login.
#
# src/test/java/config/ConfigTemplateCompletenessTest.java fails when this file
# stops listing a field, so a new ServerConfig/WorldConfig field cannot be added
# without a value here.
#
# Values: where ServerConfig.java has an inline initialiser, the value below is
# exactly that initialiser. Otherwise it is the value the stock Cosmic config
# ships for the same key, or - for the keys stock does not have - a value derived
# from the read-site, stated in the comment above the key. The keys marked
# "0 breaks it" are the ones a 0 was measured to break.

# One world entry. WorldConfigs.validate (Server.java:957) rejects an empty list,
# a negative or out-of-range id, and a duplicate id; leave id out to use the
# entry's position in this list. Add a second entry (with id: 1 for Bera) to run
# two worlds, and raise server WORLDS to match.
worlds:
  - id: 0
    flag: 0
    server_message: "Welcome to Scania!"
    event_message: "Scania!"
    why_am_i_recommended: "Welcome to Scania!"
    channels: 1
    exp_rate: 3
    meso_rate: 10
    drop_rate: 4
    boss_drop_rate: 3
    quest_rate: 1
    travel_rate: 10
    fishing_rate: 10

