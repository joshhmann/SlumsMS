# slumsms-monitor target: the owner's test server (transient unit started by persistence-test/start-test.sh).
LABEL=persistence-test
UNIT=slums-persistence-test.service
LOGIN_PORT=8489
SERVER_DIR=/opt/mapleroot-dev/persistence-test/Server
DB_CONTAINER=mapleroot-integration-db
DB_SCHEMA=mapleroot_persist
VERSION=test
STATUS_TITLE=SlumsMS test server
MAINTENANCE_FILE=/etc/slumsms-monitor/persistence-test.maintenance
# Game log silence (card 268): BotLog.txt is written by the world loop only. A hang keeps the login port open and
# the unit active but stops this file, so the check alerts on it (2 samples) instead of the port. A restart, a roll
# or a new file resets the timer. Defaults shown; GAME_LOG_FILE defaults to $SERVER_DIR/BotLog.txt.
#GAME_LOG_FILE=
#LOG_SILENCE_MIN=5
#LOG_MIN_BYTES=1024
#LOG_GRACE_MIN=10
# Cloud chat spend (SERVER_DIR/data/convo/cloud-budget.json) and the DeepSeek account balance (s-llmmonitor).
# TEST has its own key file: never let this target read the live one at /etc/slumsms/cloud-llm.env.
CLOUD_ENV_FILE=/etc/slums-persistence-test/cloud-llm.env
#CLOUD_WARN_PCT=80
#BALANCE_MIN_USD=5
#BALANCE_EVERY_MIN=45
