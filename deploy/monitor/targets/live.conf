# slumsms-monitor target: live (192.168.0.164). Not secret; webhook URLs go in /etc/slumsms-monitor/live.env (0600).
LABEL=live
UNIT=slumsms.service
LOGIN_PORT=8485
SERVER_DIR=/opt/mapleroot/MapleRoot Full Repack/Server
DB_CONTAINER=buns-clean-db-1
# DB_SCHEMA comes from config.yaml DB_URL_FORMAT (mapleroot); DB user/password are read from config.yaml at run time.
DISK_PATHS=/ /opt/mapleroot/backups
TIMERS=slumsms-backup slumsms-nav-bake
VERSION=1.3.1
STATUS_TITLE=SlumsMS (Bera)
NEWS_FILE=/srv/slums-patch/manifest.json
# Touch this file before a planned stop (deploys): alerts then go to the local log only. Remove it afterwards.
MAINTENANCE_FILE=/etc/slumsms-monitor/live.maintenance
