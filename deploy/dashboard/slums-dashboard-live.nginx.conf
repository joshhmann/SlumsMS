# [LIVE install, ticket 108] SlumsMS staff dashboard for the live server: the static web app (tools/dashboard/web)
# plus the live server's read-only JSON snapshots (-Dsolomapling.dashboard.dir=/srv/slums-dashboard/data).
# Installed by tools/ops/install-live-dashboard as /etc/nginx/sites-available/slums-dashboard-live. Never edit the
# copy on 164 by hand; change this file and run the script again.
#
# Private: bound to the LAN address only (not 0.0.0.0), the LAN allowed and everyone else refused, and the same
# basic auth file as the TEST dashboard (:8091). Both must pass. Never proxy this port to the internet.
server {
    # Port 8096, not 8090: the shared nginx already serves another site on 0.0.0.0:8090, and a LAN-address listen
    # on the same port would take that site's LAN requests (checked 2026-10-26).
    listen 8096; # all addresses: a fixed-IP listen would stop the shared nginx starting if the LAN address changed
                 # (taking the site and patch feed down); allow/deny below keeps it LAN-only
    server_name _;

    allow 192.168.0.0/24;
    deny all;

    auth_basic "SlumsMS admin (live)";
    auth_basic_user_file /etc/nginx/slums-dashboard-test.htpasswd;

    root /srv/slums-dashboard/web;
    index index.html;
    autoindex off;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain text/markdown;
    gzip_min_length 1024;

    # Temp files of an atomic write and anything else hidden.
    location ~ /\. {
        deny all;
    }

    location /data/ {
        alias "/srv/slums-dashboard/data/";
        types {
            application/json json;
            text/plain md;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ =404;
    }
}
