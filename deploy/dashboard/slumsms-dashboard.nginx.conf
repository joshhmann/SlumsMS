# SlumsMS admin dashboard (ticket 35): the static web app plus the server's read-only JSON snapshots, behind basic
# auth with its own password file (NOT the patch server's). Install: docs/tickets/35-admin-dashboard.md.
#
# Paths to adjust per install:
#   root   - a copy of tools/dashboard/web
#   alias  - the server's snapshot directory (-Dsolomapling.dashboard.dir, default <server>/reports/dashboard)
#
# Behind the owner's Caddy, add a site that proxies to this port, e.g.
#   slumsadmin.example.com {
#       reverse_proxy 192.168.0.164:8091
#   }
# Caddy passes the Authorization header through, so the basic auth below still applies. Never expose this
# port without auth.
server {
    listen 8091;
    server_name _;

    auth_basic "SlumsMS admin";
    auth_basic_user_file /etc/nginx/slums-dashboard.htpasswd;

    root /srv/slums-dashboard/web;
    index index.html;
    autoindex off;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain text/markdown;
    gzip_min_length 1024;

    # Temp files of an atomic write and anything else hidden.
    location ~ /\. {
        deny all;
    }

    location /data/ {
        alias "/srv/slums-dashboard/data/";
        types {
            application/json json;
            text/plain md;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ =404;
    }
}
