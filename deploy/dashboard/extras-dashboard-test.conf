# slums-dashboard-extras for the TEST dashboard (nginx slums-dashboard-test, :8091).
# Installed as /etc/slums-dashboard/dashboard-test.conf. No credentials here: the GM audit reads the DB through
# `docker exec` with the container's own password.
DATA_DIR=/srv/slums-dashboard-test/data
# The test dashboard server has no monitor target of its own; persistence-test is the monitored test server.
MONITOR_TARGETS=persistence-test
GM_CONTAINER=mapleroot-integration-db
GM_SCHEMA=slums_release_test
GM_LIMIT=500
GM_EVERY_S=300
