# The TEST copy of the site on 164: its own nginx process (unit slums-site-test-web), never the shared nginx that
# serves live. Own pid, logs and temp folders; LAN port 8192 only. Same rules as slums-login.nginx.conf, except:
# - Host keeps the port ($http_host), because the market service compares Origin with Host and this runs on :8192.
# - no Caddy in front and no HTTPS, so the sign-in cookie has no Secure flag (SLUMS_LOGIN_SECURE=0 in the unit).
user www-data;
worker_processes 1;
pid /run/slums-site-test-web.pid;
error_log /var/log/slums-site-test/error.log;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/slums-site-test/access.log;
    client_body_temp_path /var/lib/slums-site-test-web/body;
    proxy_temp_path /var/lib/slums-site-test-web/proxy;
    fastcgi_temp_path /var/lib/slums-site-test-web/fastcgi;
    uwsgi_temp_path /var/lib/slums-site-test-web/uwsgi;
    scgi_temp_path /var/lib/slums-site-test-web/scgi;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=slumstest:1m rate=60r/m;  # the same limits as live (slums-login.nginx.conf)

    server {
        listen 192.168.0.164:8192;
        root /srv/slums-site-test;
        index index.html;
        error_page 404 /404.html;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        location / { try_files $uri $uri/ =404; }

        location /api/login/ {
            limit_req zone=slumstest burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 1k;
            proxy_pass http://127.0.0.1:8194;
            proxy_set_header X-Forwarded-For $remote_addr;  # no Caddy here to drop a faked one
            proxy_set_header Host $http_host;
        }
        location /api/market/ {
            limit_req zone=slumstest burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 2k;
            proxy_pass http://127.0.0.1:8195;
            proxy_set_header X-Forwarded-For $remote_addr;  # no Caddy here to drop a faked one
            proxy_set_header Host $http_host;
        }
        location = /api/auth/check {
            internal;
            proxy_pass http://127.0.0.1:8194;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }
        location /database/ {
            auth_request /api/auth/check;
            error_page 401 = @signin;
            add_header Cache-Control "private, max-age=300";
        }
        location /market/ {
            auth_request /api/auth/check;
            error_page 401 = @signin;
            add_header Cache-Control "private, no-cache";
        }
        location /secret/ {
            auth_request /api/auth/check;
            add_header Cache-Control "private, max-age=86400";
        }
        location @signin {
            absolute_redirect off;
            return 302 /login/?next=$uri;
        }
    }
}
