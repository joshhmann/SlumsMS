# The TEST copy of the site on 164: its own nginx process (unit slums-site-test-web), never the shared nginx that
# serves live. Own pid, logs and temp folders; LAN port 8192 only. Same rules as slums-login.nginx.conf, except:
# - Host keeps the port ($http_host), because the market service compares Origin with Host and this runs on :8192.
# - no Caddy in front and no HTTPS, so the sign-in cookie has no Secure flag (SLUMS_LOGIN_SECURE=0 in the unit).
user www-data;
worker_processes 1;
pid /run/slums-site-test-web.pid;
error_log /var/log/slums-site-test/error.log;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/slums-site-test/access.log;
    client_body_temp_path /var/lib/slums-site-test-web/body;
    proxy_temp_path /var/lib/slums-site-test-web/proxy;
    fastcgi_temp_path /var/lib/slums-site-test-web/fastcgi;
    uwsgi_temp_path /var/lib/slums-site-test-web/uwsgi;
    scgi_temp_path /var/lib/slums-site-test-web/scgi;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=slumstest:1m rate=60r/m;  # the same limits as live (slums-login.nginx.conf)
    limit_req_zone $binary_remote_addr zone=slumstestreport:1m rate=6r/m;  # as live's report form (slums-report.nginx.conf)
    # download pass (ticket 106): the same cache and map as tools/site/slums-pass.nginx.conf, TEST's own folder
    proxy_cache_path /var/lib/slums-site-test-web/passcache levels=1:2 keys_zone=slumstestpass:1m max_size=16m inactive=2m use_temp_path=off;
    map $http_x_slums_pass $slums_no_pass { "" 1; default 0; }

    server {
        listen 192.168.0.164:8192;
        root /srv/slums-site-test;
        index index.html;
        error_page 404 /404.html;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        location / { try_files $uri $uri/ =404; }

        location /api/login/ {
            limit_req zone=slumstest burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 1k;
            proxy_pass http://127.0.0.1:8194;
            proxy_set_header X-Forwarded-For $remote_addr;  # no Caddy here to drop a faked one
            proxy_set_header Host $http_host;
        }
        location /api/market/ {
            limit_req zone=slumstest burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 2k;
            proxy_pass http://127.0.0.1:8195;
            proxy_set_header X-Forwarded-For $remote_addr;  # no Caddy here to drop a faked one
            proxy_set_header Host $http_host;
        }
        location = /api/report {
            limit_req zone=slumstestreport burst=5 nodelay;
            limit_req_status 429;
            client_max_body_size 8k;
            proxy_pass http://127.0.0.1:8193;
            proxy_set_header X-Forwarded-For $remote_addr;  # no Caddy here (SLUMS_REPORT_PROXY_HOPS=0)
            proxy_set_header Host $http_host;
        }
        location = /api/report/health {
            allow 127.0.0.1;
            deny all;
            proxy_pass http://127.0.0.1:8193;
        }
        location = /api/auth/check {
            internal;
            proxy_pass http://127.0.0.1:8194;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }
        location /database/ {
            auth_request /api/auth/check;
            error_page 401 = @signin;
            add_header Cache-Control "private, max-age=300";
        }
        location /market/ {
            auth_request /api/auth/check;
            error_page 401 = @signin;
            add_header Cache-Control "private, no-cache";
        }
        # ranking pictures: a file name never changes its picture (the server names them by content)
        location /world/avatars/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff;   # an add_header here drops the server-wide ones
            add_header Referrer-Policy no-referrer;
        }
        location /secret/ {
            auth_request /api/auth/check;
            add_header Cache-Control "private, max-age=86400";
        }
        # Download pass on TEST (ticket 106): the patch host's Live rule from slums-pass.nginx.conf, on a test file.
        # "satisfy any": this machine itself stands in for the shared key (allow 127.0.0.1), a valid TEST pass for
        # the launcher. Asks the TEST sign-in, so only TEST passes work here.
        location = /_dlpass {
            internal;
            proxy_pass http://127.0.0.1:8194/api/auth/pass;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Slums-Pass $http_x_slums_pass;
            proxy_cache slumstestpass;
            proxy_cache_key $http_x_slums_pass;
            proxy_cache_valid 204 401 60s;
            proxy_ignore_headers Cache-Control;
            proxy_no_cache $slums_no_pass;
            proxy_cache_bypass $slums_no_pass;
        }
        location ^~ /dl-test/ {
            satisfy any;
            allow 127.0.0.1;
            deny all;
            auth_request /_dlpass;
            auth_request_set $slums_account $upstream_http_x_slums_account;
            add_header X-Slums-Account $slums_account;   # TEST only, so the launcher session can see whose pass it was
            alias /var/lib/slums-site-test-web/dl-test/;
        }
        location @signin {
            absolute_redirect off;
            return 302 /login/?next=$uri;
        }
    }
}
