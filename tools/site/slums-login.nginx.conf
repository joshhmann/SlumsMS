# Inside the existing "server { listen 8092; ... }" block in /etc/nginx/sites-available/slums-site.
# The sign-in endpoints go to the login service; the friends-only sections ask it first (auth_request).
location /api/login/ {
    limit_req zone=slumsreport burst=10 nodelay;     # the report form's zone (slums-report.nginx.conf) is fine here
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8094;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
}
location = /api/auth/check {
    internal;                                         # only nginx itself may ask
    proxy_pass http://127.0.0.1:8094;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location /database/ {
    auth_request /api/auth/check;
    error_page 401 = @signin;
    add_header Cache-Control "private, max-age=300";
}
location /market/ {
    auth_request /api/auth/check;
    error_page 401 = @signin;
    add_header Cache-Control "private, no-cache";
}
location @signin {
    absolute_redirect off;                            # "Location: /login/..." not http://host:8092/... (Caddy is in front)
    return 302 /login/?next=$uri;
}
