# --- 1. In the http { } block, next to the report form's zone (/etc/nginx/conf.d/slums-report.conf) ---
# Its own zone: a market page makes a few calls per view and the launcher checks in on start; the report form's 6 a
# minute is far too few. Password guessing is limited by the login service (10 a minute per address) and the game
# server (an account locks after 5 wrong tries in 15 minutes).
limit_req_zone $slums_report_key zone=slumsapi:1m rate=60r/m;

# --- 2. Inside the existing "server { listen 8092; ... }" block in /etc/nginx/sites-available/slums-site ---
# The sign-in endpoints go to the login service; the friends-only sections ask it first (auth_request).
location /api/login/ {
    limit_req zone=slumsapi burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8094;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
}
# Watchlist, alerts and the Buy/Sell board (market_service.py). It checks the session cookie itself.
location /api/market/ {
    limit_req zone=slumsapi burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:8095;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
}
location = /api/auth/check {
    internal;                                         # only nginx itself may ask
    proxy_pass http://127.0.0.1:8094;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location /database/ {
    auth_request /api/auth/check;
    error_page 401 = @signin;
    add_header Cache-Control "private, max-age=300";
    add_header X-Content-Type-Options nosniff;        # an add_header here drops the server-wide ones (audit W14)
    add_header Referrer-Policy no-referrer;
}
location /market/ {
    auth_request /api/auth/check;
    error_page 401 = @signin;
    add_header Cache-Control "private, no-cache";
    add_header X-Content-Type-Options nosniff;        # an add_header here drops the server-wide ones (audit W14)
    add_header Referrer-Policy no-referrer;
}
# The secret stickers (theme.js): signed-in players only. No redirect, since only images live here.
# ranking pictures: a file name never changes its picture (the server names them by content)
location /world/avatars/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;   # an add_header here drops the server-wide ones
    add_header Referrer-Policy no-referrer;
}
location /secret/ {
    auth_request /api/auth/check;
    add_header Cache-Control "private, max-age=86400";
    add_header X-Content-Type-Options nosniff;        # an add_header here drops the server-wide ones (audit W14)
    add_header Referrer-Policy no-referrer;
}
# Builds stage beside a section as .stage-<folder> / .old-<folder> while they swap it in: never serve a dot path
# (audit W9; live's server block has had this line since 1.6.0).
location ~ /\. { deny all; }
location @signin {
    absolute_redirect off;                            # "Location: /login/..." not http://host:8092/... (Caddy is in front)
    return 302 /login/?next=$uri;
}

# --- 3. 1.6.1 (release night, owner's go): add to the same server block, next to part 2 ---
# The same rules TEST runs (test164/nginx.conf), with live's ports and folders. Check each with the curl lines in
# docs/site/DEPLOY.md, "1.6.1 nginx".
# a) Clean URLs (common.clean_links): /market/exchange serves market/exchange.html; an old .html address gets a 301
#    to the clean one; a folder without its slash gets the slash. At server level, above the locations. If the block
#    already has a "location /", give it this try_files instead of adding a second one.
if ($request_uri ~ "^(?!/(?:api|secret|admin/data)/)([^?]*/)index\.html(\?.*)?$") { return 301 $1$2; }
if ($request_uri ~ "^(?!/(?:api|secret|admin/data)/)([^?]*)\.html(\?.*)?$") { return 301 $1$2; }
if (-d $request_filename) { rewrite [^/]$ $uri/ permanent; }
location / { try_files $uri $uri.html $uri/ =404; }
#    and in part 2's /database/ and /market/ locations add:   try_files $uri $uri.html $uri/ =404;
# b) The staff dashboard (/admin/, sections/admin.py): GM level 3+ with a sign-in at most 12 h old. Signed out, or a
#    GM signed in over 12 h ago (401): sign in again (b055). Anyone else (403): the 404 page.
location = /api/auth/admin {
    internal;
    proxy_pass http://127.0.0.1:8094;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location /admin/ {
    auth_request /api/auth/admin;
    try_files $uri $uri.html $uri/ =404;
    error_page 401 = @signagain;
    error_page 403 =404 /404.html;
    add_header Cache-Control "private, no-store";
    add_header X-Frame-Options SAMEORIGIN;           # the dashboard runs in a frame of this page
    add_header X-Content-Type-Options nosniff;        # an add_header here drops the server-wide ones
    add_header Referrer-Policy no-referrer;
}
location /admin/data/ {                               # live's dashboard snapshots, read only
    auth_request /api/auth/admin;
    error_page 401 403 =404 /404.html;
    alias /srv/slums-dashboard/data/;
    types { application/json json; text/plain md; application/gzip gz; }
    default_type application/octet-stream;
    add_header Cache-Control "private, no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
}
# c) The staff Reports tab's reader (report_service.py, SLUMS_REPORT_STAFF_PORT=8097 in slums-report.service): GM 3+
#    only, GET only. The public 8093 has no staff routes; the reader never sends IP hashes, e-mails or user agents.
location /api/report/staff/ {
    auth_request /api/auth/admin;
    error_page 401 403 =404 /404.html;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8097;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    add_header Cache-Control "private, no-store";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
}
location @signagain {
    absolute_redirect off;
    return 302 /login/?again=1&next=$uri;
}
