# --- 1. In the http { } block, next to the report form's zone (/etc/nginx/conf.d/slums-report.conf) ---
# Its own zone: the sign-in page and the launcher poll every 3 s (20 a minute) while waiting for @weblogin, and a
# market page makes a few calls per view. The report form's 6 a minute would answer 429 within half a minute.
limit_req_zone $slums_report_key zone=slumsapi:1m rate=60r/m;

# --- 2. Inside the existing "server { listen 8092; ... }" block in /etc/nginx/sites-available/slums-site ---
# The sign-in endpoints go to the login service; the friends-only sections ask it first (auth_request).
location /api/login/ {
    limit_req zone=slumsapi burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8094;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
}
# Watchlist, alerts and the Buy/Sell board (market_service.py). It checks the session cookie itself.
location /api/market/ {
    limit_req zone=slumsapi burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:8095;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
}
location = /api/auth/check {
    internal;                                         # only nginx itself may ask
    proxy_pass http://127.0.0.1:8094;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location /database/ {
    auth_request /api/auth/check;
    error_page 401 = @signin;
    add_header Cache-Control "private, max-age=300";
}
location /market/ {
    auth_request /api/auth/check;
    error_page 401 = @signin;
    add_header Cache-Control "private, no-cache";
}
# The secret stickers (theme.js): signed-in players only. No redirect, since only images live here.
location /secret/ {
    auth_request /api/auth/check;
    add_header Cache-Control "private, max-age=86400";
}
location @signin {
    absolute_redirect off;                            # "Location: /login/..." not http://host:8092/... (Caddy is in front)
    return 302 /login/?next=$uri;
}
