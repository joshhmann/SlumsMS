# --- 1. In the http { } block (for example a new file /etc/nginx/conf.d/slums-report.conf) ---
# Key the limit on the visitor, not on Caddy: the visitor's address is in X-Forwarded-For.
map $http_x_forwarded_for $slums_report_key {
    default $http_x_forwarded_for;
    ""      $binary_remote_addr;
}
limit_req_zone $slums_report_key zone=slumsreport:1m rate=6r/m;

# --- 2. Inside the existing "server { listen 8092; ... }" block in /etc/nginx/sites-available/slums-site ---
# (put it above or below "location /"; an exact match always wins)
location = /api/report {
    limit_req zone=slumsreport burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8093;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
}
location = /api/report/health {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8093;
}
