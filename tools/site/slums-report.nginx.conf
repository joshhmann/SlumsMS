# --- 1. In the http { } block (for example a new file /etc/nginx/conf.d/slums-report.conf) ---
# Key the limit on the visitor, not on the front proxy. The owner's front proxy APPENDS the client's address to
# X-Forwarded-For (owner, 2026-10-30; audit W11 / b184), so the visitor is the RIGHT-MOST entry of the header nginx
# receives; anything left of it is whatever the visitor sent and is never used. Requests with no header (the LAN,
# straight to nginx) key on the socket address. The services count the same way (report_service.py and
# login_service.py client_ip(), hops=1: nginx's own append puts the proxy last).
map $http_x_forwarded_for $slums_report_key {
    "~(?:^|,)\s*(?<slums_last>[^,\s]+)\s*$" $slums_last;
    default                                   $binary_remote_addr;
}
limit_req_zone $slums_report_key zone=slumsreport:1m rate=6r/m;

# --- 2. Inside the existing "server { listen 8092; ... }" block in /etc/nginx/sites-available/slums-site ---
# (put it above or below "location /"; an exact match always wins)
location = /api/report {
    limit_req zone=slumsreport burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8093;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
}
location = /api/report/health {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8093;
}
