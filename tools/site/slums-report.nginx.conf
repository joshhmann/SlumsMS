# --- 1. In the http { } block (for example a new file /etc/nginx/conf.d/slums-report.conf) ---
# Key the limit on the visitor, not on Caddy: the visitor's address is in X-Forwarded-For.
# Audit W11 (open, owner asked): the whole header is client-supplied on the left, so a visitor can pick a new key per
# request. The fix needs the front proxy's (Caddy's) address, which isn't known from 164. Once it is, replace this map
# with the real-IP module, at http level:
#     set_real_ip_from <CADDY_ADDRESS>;     # PLACEHOLDER: the owner's front proxy, e.g. 192.168.0.x
#     real_ip_header X-Forwarded-For;
#     real_ip_recursive on;
# and key both zones (slumsreport, slumsapi) on $binary_remote_addr. The services already count from the right
# (report_service.py and login_service.py client_ip(), hops=1), so they ignore made-up left entries meanwhile.
map $http_x_forwarded_for $slums_report_key {
    default $http_x_forwarded_for;
    ""      $binary_remote_addr;
}
limit_req_zone $slums_report_key zone=slumsreport:1m rate=6r/m;

# --- 2. Inside the existing "server { listen 8092; ... }" block in /etc/nginx/sites-available/slums-site ---
# (put it above or below "location /"; an exact match always wins)
location = /api/report {
    limit_req zone=slumsreport burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8093;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
}
location = /api/report/health {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8093;
}
