# Download pass on the patch host (launcher 1.6.1, ticket 106): /etc/nginx/sites-enabled/slums-patch on 164.
# Live only. The Test and RC channels keep the dev key alone, so nothing changes inside /launcher-test/ or /launcher-rc/.
# Owner's go needed: this is the shared nginx and the Live patch feed. TEST shows the same pattern working on its own
# nginx (tools/site/test164/nginx.conf, /dl-test/).
#
# During the grace period a Live request is let in with EITHER the shared key (basic auth, as today) OR a valid pass
# ("satisfy any"). When the owner ends grace, delete the two "satisfy any;" lines and set auth_basic off in the two
# Live locations: then only a pass works there.

# --- 1. In the http { } block (e.g. /etc/nginx/conf.d/slums-pass.conf) ---
# Pass answers cached 60 s per pass: an install makes many requests, and a revoke still lands within a minute.
# A sign-in outage answers 401 through @dlpass_down, which is not cached: passes work again as soon as it is back.
# The cache holds pass tokens (12 h bearer tokens), so it is root/www-data only and never shared.
proxy_cache_path /var/cache/nginx/slums-pass levels=1:2 keys_zone=slumspass:1m max_size=16m inactive=2m use_temp_path=off;
map $http_x_slums_pass $slums_no_pass { "" 1; default 0; }   # no header: don't cache, don't ask
log_format slumspatch '$time_iso8601 $status $request_method $uri $body_bytes_sent acct=$slums_account user=$remote_user';

# --- 2. Inside "server { listen 8090; ... }" in sites-enabled/slums-patch ---
# The pass check: internal, asks the Live sign-in (127.0.0.1:8094), which answers 204 + X-Slums-Account or 401.
location = /_dlpass {
    internal;
    if ($slums_no_pass) { return 401; }       # no pass: answer here, never ask the sign-in
    proxy_pass http://127.0.0.1:8094/api/auth/pass;
    # sign-in down or slow = "no pass" (401), never a 500: with satisfy any a 500 would also fail a good key
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @dlpass_down;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";            # the shared key never goes to the sign-in
    proxy_set_header X-Slums-Pass $http_x_slums_pass;
    proxy_cache slumspass;
    proxy_cache_key $http_x_slums_pass;
    proxy_cache_valid 204 401 60s;
    proxy_ignore_headers Cache-Control;           # the sign-in says no-store; nginx caches the answer anyway
    proxy_no_cache $slums_no_pass;
    proxy_cache_bypass $slums_no_pass;
}
location @dlpass_down { internal; return 401; }
# In BOTH Live locations, the manifest one (location ~ (/manifest\.json$|/launcher\.json$)) and "location /",
