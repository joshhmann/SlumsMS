# ZPQ evaluation run (1.6.6, analyser evaluation, Coordinator 7 Nov): the human leader (AqClient, gm 0) and regulars only, staged through Bots' stage queue:
# `tools/ops/mechanics-stage pq zakumpq for AqClient 5 ranged5` (QA runs it from the shell right after login; staging moves the leader to the recruit map and starts the run).
# Derived from b344-zpq-stage-clear: the run advances stage by stage while the leader stays on the hub; the Fire Ore hand-in to Aura (2032002) and the prize claim are the leader's own actions.
# Pass: RUN start, every stage line in order (55 stages), the ore drop for AqClient, RUN end zakumpq cleared, client alive. The diagnosis is written from the run folder alone and goes to the Coordinator only.
id: zakumpq-full-run
title: Zakum PQ full run with the gm-0 leader and regulars through the stage queue
covers: [feature-zpq-eval]
status: draft
server: test
needs: [mechanics, proposed_signals, proposed_anchors, proposed_steps]
notes: "tarkov2 QA account, AqClient gm 0, level 120, skills trimmed (39 at login). TEST 1.6.6 c42a85edf with -Dslums.qa, -Dslums.mechanics and -Dslums.mechanics.zakumpq."
clients:
  me:
    account: {vault: account}
    character: {slot: 0}
    world: Bera
    channel: 5
    gm: false
steps:
  - {do: login}
  - {id: worlds, do: wait, signal: {type: client_signal, name: worldselect.ready}, timeout_ms: 30000}
  - {id: pick-world, do: select_world, world: Bera}
  - {id: channels, do: wait, signal: {type: client_signal, name: channels.ready}, retry: {step: pick-world, every_ms: 4000, times: 4}, timeout_ms: 30000}
  - {do: select_channel, channel: 5}
  - {id: chars, do: wait, signal: {type: client_signal, name: charselect.ready}, timeout_ms: 30000}
  - {do: select_character}
  - {id: in-game, do: wait, signal: {type: client_signal, name: field.ready}, timeout_ms: 60000}
  - {id: checkin, do: click, anchor: checkin.close, note: "the Daily Check-in window covers the field after every login and swallows typed GM lines"}
  - {id: stage-party, do: sleep, ms: 10000, reason: "QA runs tools/ops/mechanics-stage pq zakumpq for AqClient 5 ranged5 from the shell right after login; TEST picks it up within 30 s"}
  - id: run-start
    do: wait
    armed_at: stage-party
    signal: {type: server_line, topic: MECHANICS, regex: "^RUN start zakumpq stage 1 ", char: me}
