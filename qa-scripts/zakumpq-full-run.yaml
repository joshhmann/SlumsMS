  - {id: pickup-ore, do: pickup_item, item: 4001018}
  - {id: talk-aura, do: click_npc, npc: 2032002}
  - {id: aura-menu, do: wait, signal: {type: client_signal, name: window.open, window: npc_dialog}, timeout_ms: 10000, optional: true}
  - {id: brought-items, do: click, anchor: npc_dialog.option_2, note: "I brought items!"}
  - {do: sleep, ms: 2000, reason: "the yes/no dialog opens"}
  - {id: confirm-handin, do: click, anchor: npc_dialog.next, note: "Yes in the yes/no dialog is the same mode-1 reply as Next: no calibrated npc_dialog.yes point yet"}
  - {do: sleep, ms: 3000, reason: "frame after the hand-in"}
