    - see: "The leader on the stage 1 map 922010100 after the hand-in"
      in: [cleared]
  checks:
    - {check: client_alive}
    - {check: server_line, topic: MECHANICS, regex: "^RUN stage 1 cleared in \\d+ s.*\\[lpq", char: me, min: 1}
  judgment: "PASS = the stage 1 clear line tagged [lpq, leader AqClient] after the leader's hand-in. FAIL names whether the leader had fewer than 25 passes (the NPC says so) or the NPC never opened."
