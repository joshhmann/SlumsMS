# LPQ PART 1a (leader duties; the 8 Nov full-run FAIL was the missing pickup and hand-in). Stage 1 only: the leader's walk to next00 needs a position tool (see the Coordinator note). Original header follows.
# LPQ (1.6.6, b359/b363, row lpq): the real-client run. The human leader (AqClient, gm 0 after the staging) starts the Ludibrium PQ with a party of 5-6 (at least two ranged or magic) through the Red Sign NPC 2040034 on 221024500, then stays with the run: the party walks the nine stages, and the leader hands the key 4001023 to NPC 2040044 on 922010900 (the bonus map is the clearPQ warp).
# Pass (card): `RUN start lpq`, stage 1..9 cleared lines in order tagged [lpq, leader AqClient], stage 7's three "has been summoned" lines, stage 9's Alishar line, the final `RUN end lpq in ...: cleared after N s`, the client in the bonus map 922011000, and the feed never shows `hit reactor 2201002` or `hit reactor 2201003`.
# STAGING: AqClient stays gm 0 and may log in anywhere (staging moves it to 221024500; it must be level 35+, in no party and no event, 4-5 regulars). QA (or Server Dev) runs `tools/ops/mechanics-stage pq lpq for AqClient 4 ranged2` from the shell right after login (Bots, 166-bots-pq-staging-for @ 8317b1da6); TEST picks it up within 30 s. TEST needs -Dslums.qa, -Dslums.mechanics and -Dslums.mechanics.lpq on the 1.6.6 build.
id: lpq-stage1-handin
title: "LPQ part 1a: the leader collects the passes the regulars drop and hands 25 to NPC 2040036 (stage 1 clears)"
covers: [feature-lpq]
status: draft
server: test
needs: [mechanics, proposed_signals, proposed_anchors, proposed_steps]
notes: "tarkov2 QA account, TEST on release-1.6.6 with b359/b363 merged and -Dslums.mechanics.lpq. Server Dev stages the party at 221024500."
clients:
  me:
    account: {vault: account}
    character: {slot: 0}
    world: Bera
    channel: 5
    gm: false
steps:
