# b140, staged variant: the Bishop follower AND the hurt are staged server-side (!qa run hc-1: warp, one level-120
# Bishop following the GM in its party, the GM's own HP down to 40%, two STAGING feed lines naming it), so this script
# never waits on a bot's chat, never accepts a party-invite window and never needs the character's name - the two steps
# a client driver cannot take yet (b140-bot-heal-column.yaml does them by hand and stays the reference).
# The client only logs in, films (screenshot bursts and its own chat log) and sends !qa stop.
id: b140-bot-heal-column-staged
title: A staged Bishop follower's party Heal shows the Heal column on a real client
covers: [b140, q48, t-su-1]
status: draft
server: test
needs: [gm]
notes: "hc-1 warps the GM to 104040000, spawns one level-120 Bishop that follows it in its party, sets the GM to 40% HP and logs STAGE FOLLOWER cid=... and STAGE HURT cid=... to the feed; it refuses without -Dslums.bots.partysupport=true (TEST has it). Both waits and checks filter on the caller's char id (char: me), so no step needs the character's name. !qa stop takes the bot out (and disbands the party the run made)."
clients:
  me:
    account: {vault: aq-gm-1}
    character: {slot: 0}
    world: Bera
    channel: 3
    gm: true
steps:
  - {do: login}
  - {id: worlds, do: wait, signal: {type: client_signal, name: worldselect.ready}, timeout_ms: 30000}
  - {id: pick-world, do: select_world, world: Bera}
  - {id: channels, do: wait, signal: {type: client_signal, name: channels.ready}, retry: {step: pick-world, every_ms: 4000, times: 4}, timeout_ms: 30000}
  - {do: select_channel, channel: 3}
  - {id: chars, do: wait, signal: {type: client_signal, name: charselect.ready}, timeout_ms: 30000}
  - {do: select_character}
  - {id: in-game, do: wait, signal: {type: client_signal, name: field.ready}, timeout_ms: 60000}
  # hc-1 does the warp, the spawn, the party and the hurt server-side and says so on the feed; every wait below is
  # keyed by the caller's char id, the only thing the runner knows
  - {id: scene, do: gm, line: "!qa run hc-1"}
  - {id: on-map, do: wait, armed_at: scene, signal: {type: server_line, topic: MAP_CHANGE, regex: "^MAP \\S+ -> 104040000 ", char: me}, timeout_ms: 30000}
  - {id: staged, do: wait, armed_at: scene, signal: {type: server_line, topic: STAGING, regex: "^STAGE FOLLOWER cid=\\d+ job=BISHOP ", char: me}, timeout_ms: 30000}
  # 40% of max HP is under the 60% a Bishop heals: the cast comes within ~4 s of this line
  - {id: hurt, do: wait, armed_at: scene, signal: {type: server_line, topic: STAGING, regex: "^STAGE HURT cid=\\d+ hp=\\d+->\\d+ pct=40 ", char: me}, timeout_ms: 30000}
  - id: heal
    do: wait
    armed_at: hurt
    signal: {type: server_line, topic: COMBAT, regex: "^PARTY HEAL \\S+ -> \\S+ .* sent SHOW_FOREIGN_EFFECT/1>map", char: me}
    timeout_ms: 30000
  - {id: cleanup, do: gm, line: "!qa stop"}
captures:
  # starts with the staged hurt: the heal comes within ~4 s, so this burst holds the whole column whatever the feed's delay
  - {id: column-early, burst: {fps: 10, ms: 5000, at: {signal: hurt}}}
  # the owner's milestone burst on the server line (starts ~100-300 ms after the cast: the column's tail)
  - {id: column-on-line, burst: {fps: 10, ms: 2000, at: {signal: heal}}}
  - {id: chat, chat_log: {span: {from: hurt, to: cleanup}}}
expect:
  reviewer:
    - see: "Over the Bishop bot, the Heal cast: its pose and the vertical light column (the same art a player's Heal shows)"
      in: [column-early, column-on-line]
    - see: "Over your own character, the green heal effect and the HP bar going up from about 40%"
      in: [column-early, column-on-line, chat]
  checks:
    - {check: server_line, topic: STAGING, regex: "^STAGE FOLLOWER cid=\\d+ job=BISHOP ", char: me, min: 1}
    - {check: server_line, topic: STAGING, regex: "^STAGE HURT cid=\\d+ hp=\\d+->\\d+ pct=40 ", char: me, min: 1}
    - {check: server_line, topic: COMBAT, regex: "^PARTY HEAL \\S+ -> \\S+ .* sent SHOW_FOREIGN_EFFECT/1>map", char: me, min: 1}
    - {check: client_alive}
  judgment: "None: the column is there or not; the frames settle it."
