# b311 re-test (H1): a human (AqClient, 120) and two owned 120+ alts enter Horntail through the real expedition path.
# Pass (Coordinator): the alts enter every room, damage boss parts (from the TEST hex logger) and follow the warps.
# The alts: AqClientAlt1 and AqClientAlt2, both level 120+.
# GM staging used (noted in the run record): !warp 240050400, !tp, @botme (the owned alts). NO !horntail.
id: h1-horntail-alts
title: "Human plus two owned alts clear the Horntail entry path and fight in every room"
covers: [b311]
status: draft
server: test
needs: [gm, owned_alt, proposed_anchors, proposed_signals, proposed_steps]
notes: "tarkov2 QA account only (TEST, hex logger on, started by Server Dev before the run). Server Dev decodes the logger by the alts' cids: SPAWN_PLAYER/REMOVE_PLAYER per room (240060000, 240060100, 240060200), SPAWN_MONSTER boss parts, attack packets with target oids. Expedition NPC 2083004 on 240050400 at x=898 y=246. Menu rows: the first dialog has 'Lets get this going!' (row 1) and 'No...' (row 2); the leader's menu has View members (1), Start the fight! (2), Stop (3). b346: watch portals hontale_morph (cs00-cs05 on 240040700) and hontale_boss1/2 (mob00 on 240060000/240060100) for no-ops."
clients:
  me:
    account: {vault: account}
    character: {slot: 0}
    world: Bera
    channel: 3
    gm: true
steps:
  - {do: login}
  - {id: worlds, do: wait, signal: {type: client_signal, name: worldselect.ready}, timeout_ms: 30000}
  - {id: pick-world, do: select_world, world: Bera}
  - {id: channels, do: wait, signal: {type: client_signal, name: channels.ready}, retry: {step: pick-world, every_ms: 4000, times: 4}, timeout_ms: 30000}
  - {do: select_channel, channel: 3}
  - {id: chars, do: wait, signal: {type: client_signal, name: charselect.ready}, timeout_ms: 30000}
  - {do: select_character}
  - {id: in-game, do: wait, signal: {type: client_signal, name: field.ready}, timeout_ms: 60000}
  - {id: checkin, do: click, anchor: checkin.close, note: "the Daily Check-in window covers the field after every login and swallows typed GM lines"}
  - {id: to-door, do: gm, line: "!warp 240050400"}
  - {id: at-door, do: wait, signal: {type: client_signal, name: field.ready, map_id: 240050400}, timeout_ms: 30000}
  - {id: stand-by-npc, do: gm, line: "!tp 860 246"}
  - {id: call-alt-1, do: chat, text: "@botme AqClientAlt1"}
  - {id: alt-1-here, do: wait, armed_at: call-alt-1, signal: {type: server_line, topic: OWNED_ALT, regex: "loaded alt=105", char: me}, timeout_ms: 20000}
  - {id: call-alt-2, do: chat, text: "@botme AqClientAlt2"}
  - {id: alt-2-here, do: wait, armed_at: call-alt-2, signal: {type: server_line, topic: OWNED_ALT, regex: "loaded alt=106", char: me}, timeout_ms: 20000}
  # register the expedition
  - {id: talk-1, do: click_npc, npc: 2083004}
  - {id: dialog-1, do: wait, signal: {type: client_signal, name: window.open, window: npc_dialog}, timeout_ms: 10000}
  - {id: lets-go, do: click, anchor: npc_dialog.option_1}
  - {id: closed-1, do: wait, signal: {type: client_signal, name: window.closed, window: npc_dialog}, timeout_ms: 10000}
  # the alts join through their own clients' scripts; give them a moment
  - {do: sleep, ms: 8000, reason: "alts register for the expedition by their own scripts"}
  # start the fight
  - {id: talk-2, do: click_npc, npc: 2083004}
  - {id: dialog-2, do: wait, signal: {type: client_signal, name: window.open, window: npc_dialog}, timeout_ms: 10000}
  - {id: start-fight, do: click, anchor: npc_dialog.option_2}
  - {id: in-fight, do: wait, signal: {type: client_signal, name: field.ready, map_id: 240060000}, timeout_ms: 60000}
  # the human stands still; the alts fight. Watch the run through the map changes the leader is carried along.
  - {id: room-2, do: wait, signal: {type: client_signal, name: field.ready, map_id: 240060100}, timeout_ms: 240000}
  - {id: room-3, do: wait, signal: {type: client_signal, name: field.ready, map_id: 240060200}, timeout_ms: 240000}
captures:
  - {id: door, burst: {fps: 2, ms: 2000, at: {step: stand-by-npc}}}
  - {id: party, burst: {fps: 2, ms: 2000, at: {step: alt-2-here}}}
  - {id: room-1-shot, burst: {fps: 2, ms: 4000, at: {signal: in-fight}}}
  - {id: room-2-shot, burst: {fps: 2, ms: 4000, at: {signal: room-2}}}
  - {id: room-3-shot, burst: {fps: 2, ms: 4000, at: {signal: room-3}}}
expect:
  reviewer:
    - see: "The leader with two alts standing next to it at Horntail's cave entrance"
      in: [party]
    - see: "The alts in each Horntail room with the boss parts on the map"
      in: [room-1-shot, room-2-shot, room-3-shot]
  checks:
    - {check: client_alive}
  judgment: "PASS needs the TEST hex logger: both alts present in each room's SPAWN_PLAYER, boss-part SPAWN_MONSTER, the alts' attack packets on boss parts, and the alts following each warp. FAIL names the first blocker (no expedition member, no entry, idle alts, no damage, no follow)."
