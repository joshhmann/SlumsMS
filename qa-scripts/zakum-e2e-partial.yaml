# Zakum end-to-end, PARTIAL (not acceptance): a human expedition leader, an owned alt and a second owned alt standing in for
# the regular reach the altar through the real expedition NPC 2030013 (assertion (a)). Assertion (b), the leader dropping the
# Eye of Fire, needs Client's drop_item step (P1-Q2) and the regular-in-party step needs party_create/party_invite; until
# those exist this run only shakes out entry. Label the result "partial, not acceptance" in latest.json (Coordinator).
# GM staging used (noted in the run record): !item 4001017 (the leader needs one Eye of Fire to open an expedition),
# !warp 211042400, @botme for the two alts. The GM-staged Eye of Fire is a prerequisite item, and registering/starting the
# expedition SPENDS one of today's Zakum attempts for the QA account on TEST (the quota that assertion (e) will read).
id: zakum-e2e-partial
title: Human leader and two owned alts register a Zakum expedition and reach the altar (partial, not acceptance)
covers: [feature-zakum-e2e, b331]
status: draft
server: test
needs: [gm, owned_alt, proposed_anchors, proposed_signals, proposed_steps]
notes: "AFTER THE RUN: copy crash.log from the worker (client/me in the run folder); Server Dev confirms no live Zakum expedition is left on the channel (this script only dismisses the alts and leaves the altar); record the cleanup, the GM-staged Eye of Fire and the spent attempt in latest.json. tarkov2 QA account (AqClient lv120 GM; alts AqClientAlt1 and AqClientAlt2 at 120). TEST build with the batch 1+2 deploy; hex logger on (Server Dev decodes SPAWN_PLAYER of the alts on 280030000). NPC 2030013 is on 211042400; menu rows: first dialog 'Lets get this going!' (1); leader menu View members (1), Start the fight! (2), Stop (3). The expedition quota is spent by the attempt (assertion (e) will read it later). Needs the expedition free on the channel."
clients:
  me:
    account: {vault: account}
    character: {slot: 0}
    world: Bera
    channel: 3
    gm: true
steps:
  - {do: login}
  - {id: worlds, do: wait, signal: {type: client_signal, name: worldselect.ready}, timeout_ms: 30000}
  - {id: pick-world, do: select_world, world: Bera}
  - {id: channels, do: wait, signal: {type: client_signal, name: channels.ready}, retry: {step: pick-world, every_ms: 4000, times: 4}, timeout_ms: 30000}
  - {do: select_channel, channel: 3}
  - {id: chars, do: wait, signal: {type: client_signal, name: charselect.ready}, timeout_ms: 30000}
  - {do: select_character}
  - {id: in-game, do: wait, signal: {type: client_signal, name: field.ready}, timeout_ms: 60000}
  - {id: checkin, do: click, anchor: checkin.close, note: "the Daily Check-in window covers the field after every login and swallows typed GM lines"}
  - {id: eye, do: gm, line: "!item 4001017 1", note: "the expedition leader must hold an Eye of Fire to register"}
  - {id: to-recruit, do: gm, line: "!warp 211042400"}
  - {id: at-recruit, do: wait, signal: {type: client_signal, name: field.ready, map_id: 211042400}, timeout_ms: 30000}
  - {id: call-alt-1, do: chat, text: "@botme AqClientAlt1"}
  - {id: alt-1-here, do: wait, armed_at: call-alt-1, signal: {type: server_line, topic: OWNED_ALT, regex: "AqClientAlt1", char: me}, timeout_ms: 20000}
  - {id: call-alt-2, do: chat, text: "@botme AqClientAlt2"}
  - {id: alt-2-here, do: wait, armed_at: call-alt-2, signal: {type: server_line, topic: OWNED_ALT, regex: "AqClientAlt2", char: me}, timeout_ms: 20000}
  - {id: talk-1, do: click_npc, npc: 2030013}
  - {id: dialog-1, do: wait, signal: {type: client_signal, name: window.open, window: npc_dialog}, timeout_ms: 10000}
  - {id: lets-go, do: click, anchor: npc_dialog.option_1}
  - {id: closed-1, do: wait, signal: {type: client_signal, name: window.closed, window: npc_dialog}, timeout_ms: 10000}
  - {do: sleep, ms: 8000, reason: "the alts register for the expedition by their own scripts"}
  # the roster: row 1 "View current Expedition members" lists the members (a list, not expel buttons we press): frame, then close
  - {id: talk-roster, do: click_npc, npc: 2030013}
  - {id: dialog-roster, do: wait, signal: {type: client_signal, name: window.open, window: npc_dialog}, timeout_ms: 10000}
  - {id: view-members, do: click, anchor: npc_dialog.option_1}
  - {do: sleep, ms: 2500, reason: "frame of the expedition roster with both alts registered"}
  - {id: close-roster, do: click, anchor: npc_dialog.close}
  - {id: roster-closed, do: wait, signal: {type: client_signal, name: window.closed, window: npc_dialog}, timeout_ms: 10000}
  - {id: talk-2, do: click_npc, npc: 2030013}
  - {id: dialog-2, do: wait, signal: {type: client_signal, name: window.open, window: npc_dialog}, timeout_ms: 10000}
  - {id: start-fight, do: click, anchor: npc_dialog.option_2}
  - {id: at-altar, do: wait, signal: {type: client_signal, name: field.ready, map_id: 280030000}, timeout_ms: 60000}
  - {id: alts-arrive, do: sleep, ms: 10000, reason: "give the alts time to arrive in the altar room for the frame and the hex logger"}
  # cleanup: send the alts away and leave the altar so TEST is not left with the party in the instance
  - {id: dismiss-1, do: chat, text: "@dismiss AqClientAlt1"}
  - {id: dismiss-2, do: chat, text: "@dismiss AqClientAlt2"}
  - {id: leave, do: gm, line: "!warp 211000000"}
  - {id: left, do: wait, signal: {type: client_signal, name: field.ready, map_id: 211000000}, timeout_ms: 30000}
captures:
  - {id: party, burst: {fps: 2, ms: 2000, at: {step: alt-2-here}}}
  - {id: roster, burst: {fps: 2, ms: 3000, at: {step: view-members}}}
  - {id: altar, burst: {fps: 2, ms: 5000, at: {signal: at-altar}}}
  - {id: altar-with-alts, burst: {fps: 2, ms: 3000, at: {step: alts-arrive}}}
expect:
  reviewer:
    - see: "The leader with both alts at the Zakum recruiter before the start"
      in: [party]
    - see: "The expedition roster listing the leader and both alts as members"
      in: [roster]
    - see: "The leader in Zakum's altar room with both alts in the map"
      in: [altar, altar-with-alts]
  checks:
    - {check: client_alive}
  judgment: "Partial, not acceptance. PASS for this script = the leader reaches 280030000 and the hex logger shows both alts' SPAWN_PLAYER there (assertion (a) for the stand-ins). Assertions (b)-(g) are not run."
