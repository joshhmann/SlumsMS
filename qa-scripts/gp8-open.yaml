# GP8 part 1 (P0-2, real client): AqClient AT GM 0 (a player, Coordinator) opens a hired merchant in FM room 910000021 with 5 Red Potions at 1000 mesos and leaves it open. The owner then buys ONE item by hand
# (the real-player purchase path: a full buyer save with owner credit); a bot may buy too. Then gp8-close. Server Dev reads inventory and meso rows before/after. TEST QA account only.
id: gp8-open
title: "GP8: open a hired merchant with 5 Red Potions at 1000 each (the owner buys one by hand)"
covers: [feature-p0-2-gp8]
status: draft
server: test
needs: [proposed_signals, proposed_steps]
notes: "STAGED BY SERVER DEV on the TEST DB with account 44 logged out: AqClient gm 0, map 910000021, 5 Red Potions (2000000) in USE, 1 hired merchant 5030000 in CASH, HP above 0 and an empty Fredrick. No GM commands run in this script. tarkov2 QA account, TEST."
clients:
  me:
    account: {vault: account}
    character: {slot: 0}
    world: Bera
    channel: 3
    gm: false
steps:
  - {do: login}
  - {id: worlds, do: wait, signal: {type: client_signal, name: worldselect.ready}, timeout_ms: 30000}
  - {id: pick-world, do: select_world, world: Bera}
  - {id: channels, do: wait, signal: {type: client_signal, name: channels.ready}, retry: {step: pick-world, every_ms: 4000, times: 4}, timeout_ms: 30000}
  - {do: select_channel, channel: 3}
  - {id: chars, do: wait, signal: {type: client_signal, name: charselect.ready}, timeout_ms: 30000}
  - {do: select_character}
  - {id: in-game, do: wait, signal: {type: client_signal, name: field.ready}, timeout_ms: 60000}
  - {id: checkin, do: click, anchor: checkin.close, note: "the Daily Check-in window covers the field after every login"}
  - {id: step-aside, do: move, dir: right, ms: 2500, note: "away from the portal and other shops (Client's proven walk)"}
  - {id: open, do: merchant_open, item: 2000000, quantity: 5, price: 1000, title: "GP8 QA"}
  - {do: sleep, ms: 3000, reason: "let the merchant spawn and the frame show it"}
captures:
  - {id: shop, burst: {fps: 2, ms: 3000, at: {step: open}}}
expect:
  reviewer:
    - see: "The human's hired merchant standing in the Free Market room with its title"
      in: [shop]
  checks:
    - {check: client_alive}
  judgment: "PASS = merchant_open answered ok and the merchant is spawned. The merchant stays open for the owner's by-hand purchase of one item. Then run gp8-close."
