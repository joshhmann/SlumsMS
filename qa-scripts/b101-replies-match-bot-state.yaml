# b101 (y43, chat with regulars): a bot's answers contradicted its own state - its level, its job, what it was doing
# a line earlier. The reply planner (cv-13) plus the grounding guard fix it: 'what lvl r u' plans level_talk and the
# line must carry the bot's real level and its next goal; asking twice in a row must not produce two different levels.
id: b101-replies-match-bot-state
title: A bot's answers about its own level and activity stay consistent
covers: [b101]
status: draft
server: test
needs: [gm]
notes: "cv-13 needs -Dsolomapling.convo.planner=true on the server (off by default; without it the run times out on the warp wait - a staging lead, not this card), warps the GM to Henesys and stages one friend bot. Each reply logs PLAN <bot> -> <player> level_talk before the words, so two asks give two PLAN level_talk lines; both answers must name the same level, and neither may beg for mesos or push a trade. The frames are the readable half: the level and the activity it names."
clients:
  me:
    account: {vault: aq-gm-1}
    character: {slot: 0}
    world: Bera
    channel: 3
    gm: true
steps:
  - {do: login}
  - {id: worlds, do: wait, signal: {type: client_signal, name: worldselect.ready}, timeout_ms: 30000}
  - {id: pick-world, do: select_world, world: Bera}
  - {id: channels, do: wait, signal: {type: client_signal, name: channels.ready}, retry: {step: pick-world, every_ms: 4000, times: 4}, timeout_ms: 30000}
  - {do: select_channel, channel: 3}
  - {id: chars, do: wait, signal: {type: client_signal, name: charselect.ready}, timeout_ms: 30000}
  - {do: select_character}
  - {id: in-game, do: wait, signal: {type: client_signal, name: field.ready}, timeout_ms: 60000}
  - {id: checkin, do: click, anchor: checkin.close, note: "the Daily Check-in window covers the field after every login"}
  - {id: scene, do: gm, line: "!qa run cv-13"}
  - {id: in-town, do: wait, armed_at: scene, signal: {type: server_line, topic: MAP_CHANGE, regex: "^MAP \\S+ -> 100000000 ", char: me}, timeout_ms: 60000}
  - {id: staged, do: sleep, ms: 3000, reason: "the friend bot is spawned beside the GM by the scenario"}
  - {id: ask-level, do: chat, text: "what lvl r u"}
  - {id: level-plan, do: wait, armed_at: ask-level, signal: {type: server_line, topic: CONVO, regex: "^PLAN \\S+ -> \\S+ level_talk", char: me}, timeout_ms: 90000}
  - {id: level-said, do: wait, armed_at: ask-level, signal: {type: server_line, topic: CONVO, regex: "^SAID ", char: me}, timeout_ms: 90000}
  - {id: pause, do: sleep, ms: 4000, reason: "read the first answer before asking again"}
  - {id: ask-again, do: chat, text: "what lvl r u"}
  - {id: level-plan-2, do: wait, armed_at: ask-again, signal: {type: server_line, topic: CONVO, regex: "^PLAN \\S+ -> \\S+ level_talk", char: me}, timeout_ms: 90000}
  - {id: level-said-2, do: wait, armed_at: ask-again, signal: {type: server_line, topic: CONVO, regex: "^SAID ", char: me}, timeout_ms: 90000}
  # and the activity it claims must fit the town it is standing in (b240's neighbour, judged from the same frames)
  - {id: ask-doing, do: chat, text: "what r u doing"}
  - {id: doing-said, do: wait, armed_at: ask-doing, signal: {type: server_line, topic: CONVO, regex: "^SAID ", char: me}, timeout_ms: 90000}
  - {id: cleanup, do: gm, line: "!qa stop"}
captures:
  - {id: ask-level-chat, burst: {fps: 2, ms: 5000, at: {step: ask-level}}}
  - {id: level-answer, burst: {fps: 3, ms: 5000, at: {signal: level-said}}}
  - {id: again-answer, burst: {fps: 3, ms: 5000, at: {signal: level-said-2}}}
  - {id: doing-answer, burst: {fps: 3, ms: 5000, at: {signal: doing-said}}}
expect:
  reviewer:
    - see: "Two answers to 'what lvl r u' naming the SAME level, with a next goal, and no begging for mesos and no trade push in either"
      in: [level-answer, again-answer]
    - see: "The answer to 'what r u doing' naming something it can be doing in Henesys (hanging out, looking for someone, town talk) and not a hunting ground it is not on"
      in: [doing-answer]
  checks:
    - {check: server_line, topic: CONVO, regex: "^PLAN \\S+ -> \\S+ level_talk", char: me, min: 2}
    - {check: server_line, topic: CONVO, regex: "^SAID ", char: me, min: 3}
    - {check: client_alive}
  judgment: "The same level in both answers and an activity the map allows: the frames settle both. Two PLAN level_talk lines prove the planner picked that move both times, not that the words agreed."
