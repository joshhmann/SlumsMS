# GP8 part 2 (P0-2, real client): AqClient at gm 0. After the owner has bought one item by hand, SERVER DEV closes the merchant server-side like a restart (a TEST-side close, with the character logged out) and sets the character's map to the FM entrance 910000000; then this script takes everything from Fredrick
# (9030000 at the FM entrance) with fredrick_retrieve, and click Fredrick again: nothing left. Server Dev reads inventory and mesos rows before/after and the journal. TEST QA account only.
id: gp8-close-fredrick
title: "GP8: close the merchant the way a restart does, then collect everything from Fredrick"
covers: [feature-p0-2-gp8]
status: draft
server: test
needs: [gm, owned_alt, proposed_signals]
notes: "tarkov2 QA account, TEST."
clients:
  me:
    account: {vault: account}
    character: {slot: 0}
    world: Bera
    channel: 3
    gm: false
steps:
  - {do: login}
  - {id: worlds, do: wait, signal: {type: client_signal, name: worldselect.ready}, timeout_ms: 30000}
  - {id: pick-world, do: select_world, world: Bera}
  - {id: channels, do: wait, signal: {type: client_signal, name: channels.ready}, retry: {step: pick-world, every_ms: 4000, times: 4}, timeout_ms: 30000}
  - {do: select_channel, channel: 3}
  - {id: chars, do: wait, signal: {type: client_signal, name: charselect.ready}, timeout_ms: 30000}
  - {do: select_character}
  - {id: in-game, do: wait, signal: {type: client_signal, name: field.ready}, timeout_ms: 60000}
  - {id: checkin, do: click, anchor: checkin.close, note: "the Daily Check-in window covers the field after every login"}
  - {id: at-entrance, do: wait, signal: {type: client_signal, name: field.ready, map_id: 910000000}, timeout_ms: 30000, note: "Server Dev staged the character at the FM entrance after the server-side close"}
  - {id: talk-fredrick, do: click_npc, npc: 9030000}
  - {id: fredrick-open, do: wait, signal: {type: client_signal, name: window.open, window: npc_dialog}, timeout_ms: 10000, optional: true}
  - {do: sleep, ms: 2000, reason: "frame of Fredrick's retrieval window with the items and mesos"}
  - {id: take-all, do: fredrick_retrieve}
  - {do: sleep, ms: 3000, reason: "let the server hand over the items and mesos before the frame"}
  - {id: talk-again, do: click_npc, npc: 9030000}
  - {do: sleep, ms: 2000, reason: "frame of Fredrick's second answer: nothing left to retrieve"}
captures:
  - {id: fredrick-window, burst: {fps: 2, ms: 3000, at: {step: talk-fredrick}}}
  - {id: after-take, burst: {fps: 2, ms: 3000, at: {step: take-all}}}
  - {id: second-click, burst: {fps: 2, ms: 3000, at: {step: talk-again}}}
expect:
  reviewer:
    - see: "Fredrick's retrieval window listing the unsold items and the sale mesos"
      in: [fredrick-window]
    - see: "Fredrick's second click finding nothing left"
      in: [second-click]
  checks:
    - {check: client_alive}
  judgment: "PASS = the close handed the contents to Fredrick, fredrick_retrieve answered 1E and the inventory and mesos changed by the unsold items and the sale mesos (Server Dev reads the rows before and after; judge by the inventory change, not by the 1E), and a second click finds nothing. Nothing lost, nothing duplicated."
