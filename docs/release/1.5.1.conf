# SlumsMS 1.5.1 release settings, read by tools/release/stage (bash, sourced). Template:
# tools/release/templates/release.conf.example. Server-only bug-fix release on top of 1.5.0 (release-1.5.1).
# Release build: ServerConstants.SLUMSMS_VERSION is "1.5.1". The client stays 1.5.0 (build 10500): no client publish.

# No migrations in 1.5.1. Live shows exactly these after 1.5.0 (pinned so a stray id aborts).
MIGRATIONS=()
LEDGER_BEFORE="001-preserve-arcane-for-classic-fm,002-classic-fm-return,003-solomapling-bots,004-daily-checkin,005-bot-real-stats,006-bot-yield-caps,007-bot-starter-stash,008-world-bera,009-gm-audit,010-color-prism,011-bot-affinity,012-bot-couples,013-gachapon-machines,014-bot-guilds,015-bot-romance,016-bot-guild-wars,020-economy-trade,021-cosmetics-merchant,022-botmemory-about-index"

# config.yaml: no new keys. Owner decisions already written into live's config.yaml on 2026-10-24/25 (backups in /root
# on 164), restated here so the deploy enforces them and rollback restores the old config with the old jar:
#  - BOT_ROSTER_VETERAN_FILL_BELOW 0.5 / BOT_ROSTER_VETERANS_PER_DAY 300: 1.5.0's temporary roster growth back to normal
#    (roster was 8,375 active on 2026-10-25 03:30 UTC, +300/h, so past ~9,000 by release).
#  - ENABLE_PIC true (Cosmic's default; MapleRoot had it off, which made deleting characters impossible).
#  - USE_SUPPLY_RATE_COUPONS true (EXP/drop coupons on sale in the Cash Shop).
CHANNELS=5
CHANNEL_LOAD=125
SERVER_SET=(BOT_ROSTER_PEAK_ONLINE=3000 BOT_POPULATION_PEAK=3500 BOT_MAP_CAP=50
            BOT_ROSTER_VETERAN_FILL_BELOW=0.5 BOT_ROSTER_VETERANS_PER_DAY=300)
# ENABLE_PIC and USE_SUPPLY_RATE_COUPONS are booleans (set-release-config only takes numeric keys): they are already true
# in live's config.yaml, and stop-backup saves that config, so rollback keeps them too. stage's pre-flight should show
# them unchanged.
CONFIG_APPEND=""
CONFIG_HEAD=""
CONFIG_HEAD_BEFORE=""

MIN_CLIENT_BUILD=10500
UNIT_EDITS=()
PRECHECK_SQL=()
NAV_CACHE_SRC=""
CASHSHOP_CATALOG=cashshop/catalog.tsv
EXPECT_LOG=("SoloMapling initialized")
FORBID_LOG=("failed to load" "Starting world 0")
SMOKE_SECONDS=30
IN_GAME_CHECK="In game: log in (you are asked to set a PIC once), change channel, see bots in Henesys and the FM; Henesys plastic surgery with a face coupon lists faces; the Cash Shop shows 2x EXP cards; Kenta in the Zoo starts Monster Riding; GM: !roster shows the director heading for the evening curve."
MAINT_MINUTES=5
MAINT_REASON="1.5.1 fixes salons, party quests, the mount quest and character delete"
