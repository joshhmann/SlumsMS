# Release build: ServerConstants.SLUMSMS_VERSION is the final "1.5.0" (release-1.5.0, cut from test-1.5.0-rc6 8ff0cbd99).
# SlumsMS 1.5.0 release settings, read by tools/release/stage (bash, sourced). Template:
# tools/release/templates/release.conf.example. Built from test-1.5.0-rc4: rc3 (rc2 + bots-guilds-150 + bots-combat-150 with
# bots-attack-timing-150 + economy-trade-150 + ops-release-config-150), the rc3b review fixes, then bots-attack-pacing-150,
# bots-pets-150, gameplay-partner-rings-150 and bots-drama-150.
# Test recipe: docs/release/1.5.0-rc2-test-deploy.md, plus docs/release/1.5.0-bot-guilds-deploy.md and
# docs/release/1.5.0-economy-trade.md for 014, 020 and 021; docs/release/1.5.0-bot-drama-deploy.md for 015 and 016;
# docs/release/1.5.0-partner-rings.md for the catalogue.
# docs/release/1.5.0-3k-bots.md for the 3,000-bot population, the per-map bot cap, the 6G heap and roster growth.

# Migrations, in order. Live is at 010-color-prism; the ledger ids are the file stems.
MIGRATIONS=(011-bot-affinity 012-bot-couples 013-gachapon-machines 014-bot-guilds 015-bot-romance 016-bot-guild-wars 020-economy-trade 021-cosmetics-merchant 022-botmemory-about-index)
# 014: bots-guilds-150; 015/016: bots-drama-150; 020/021: economy-trade-150 (017-019 unused).
# 022 (rc6 bug hunt): one secondary index on botmemory (AboutCharacterId, Source) for the @botdrama off gossip purge; no
# data change, guarded by information_schema like 007 so it applies and rolls back twice cleanly (checked on MySQL 8.0.36).
# 013 and 021 add plife rows; their rollbacks delete only the rows they inserted, recorded in the
# mapleroot_integration_migration_rows side table (ops-release-fixes), so rows staff added by hand stay.
# Live must show exactly 001..010 before the deploy (the default would compute the same; pinned so a stray id aborts).
LEDGER_BEFORE="001-preserve-arcane-for-classic-fm,002-classic-fm-return,003-solomapling-bots,004-daily-checkin,005-bot-real-stats,006-bot-yield-caps,007-bot-starter-stash,008-world-bera,009-gm-audit,010-color-prism"

# config.yaml. 1.5.0 needs no new config keys (affinity/couples/guild tunables are -Dsolomapling.* properties with safe
# defaults; the gachapon and wealth ceiling read gachapon-pools.yaml, the economy economy.yaml; the rc3 combat keys
# BOT_COMBAT_*, BOT_KS_MANNERS and BOT_SPREAD are optional ServerConfig fields that default on). Live (1.4.1) runs 8 channels with CHANNEL_LOAD 300 (1.4.0 quick fix);
# 1.5.0 moves it to 5 channels.
# CHANNELS and CHANNEL_LOAD are applied in place by the generated deploy; no CONFIG_HEAD is needed.
# CHANNEL_LOAD 125: the owner's choice for 1.5.0 (2026-10-22); peak bars about 85/70/40/25/15 %.
# !! MAY CHANGE BEFORE RELEASE (2026-10-23): with 3,000 bots the owner is testing what a full channel-1 bar does in
# !! the client. Keep 125 until that test says otherwise; the bars at 3k are then higher than the 1,200-bot figures above.
CHANNELS=5
CHANNEL_LOAD=125

# 3k bots (owner 2026-10-23: 3,000 roaming bots, a 4G/6G heap, a per-map bot cap starting at 50). Numeric server: keys,
# edited in place or added at the end of server: by set-release-config --set (gen-deploy checks each against
# ServerConfig.java: the config is strict). Pre-flight prints before -> after; rollback restores the whole old config.
# Dry run on a copy of live's config.yaml (2026-10-23): BOT_ROSTER_PEAK_ONLINE 1200 -> 3000 (an edit: live has the key),
# the other four unset -> added; the old 1.4.1 jar never sees them (rollback puts the old config back with it).
#  - BOT_ROSTER_PEAK_ONLINE 3000: the director's own peak (the 3k soak, docs/release/1.5.0-3k-bots.md).
#  - BOT_POPULATION_PEAK 3500: every bot online at the curve's top; the director gets min(3000, 3500 - environment).
#    Live's environment is about 360 bots (BOT_ENVIRONMENT_SCALE 0.5), so 3,000 roam on top of it, about 3,360 in all;
#    3,500 leaves room for 500 environment bots before the director is trimmed. Live's config does not set this key.
#  - BOT_MAP_CAP 50: the per-map bot cap (one map on one channel); written out so the owner sees the knob. No
#    BOT_MAP_CAP_OVERRIDES on live: at 3,000 the busiest instance in the soak was well under 50 (45-57 summed over 5
#    channels). Add e.g. "910000000:60,100000000:70" by hand if a map needs its own cap.
#  - Roster growth (TEMPORARY, revert in 1.5.1): the roster's size is 3 x peak = 9,000. Live's roster is about 2,500-3,600
#    active (seeded 2,508 on 1.3.0, then +40 new players a day; veterans only fill below half the size). With the
#    defaults (fill below 0.5, 300 veterans a day) 9,000 takes about 7 days to 4,500 and then ~110 days at 40 a day, and
#    on the first evenings the director has fewer than 3,000 members to put online. BOT_ROSTER_VETERAN_FILL_BELOW 1.0 and
#    BOT_ROSTER_VETERANS_PER_DAY 7200 make the hourly lifecycle step add ~300 veterans an hour (~20 s of work on the
#    director's thread at the soak's ~64 ms a bot; the soak's prep boot added 2,400 an hour without errors), so the roster
#    reaches ~9,000 about 18-22 h after the deploy and then stops by itself (no room left; quitters are refilled by the 40
#    new players a day first). No prep boot, no second restart. In 1.5.1 set them back to 0.5 and 300.
SERVER_SET=(BOT_ROSTER_PEAK_ONLINE=3000 BOT_POPULATION_PEAK=3500 BOT_MAP_CAP=50
            BOT_ROSTER_VETERAN_FILL_BELOW=1.0 BOT_ROSTER_VETERANS_PER_DAY=7200)
CONFIG_APPEND=""
CONFIG_HEAD=""
CONFIG_HEAD_BEFORE=""

# Client version gate (tools/release/set-min-client-build, see tools/release/README.md): the 1.5.0 client is build
# 10500. The hook in deploy.body.sh runs it in the apply step before the start, after publish-client.
MIN_CLIENT_BUILD=10500

# Remove the 2026-10-22 live hotfix flag: it never fixed the creation block (a client bug, fixed in slums.dll),
# and the 1.5.0 bars at CHANNEL_LOAD 125 are tuned for the default bot weight 0.25.
# 3k bots: heap -Xmx4G -> -Xms4G -Xmx6G (owner 2026-10-23; the 3k soak peaked at 2.9 GB heap used, 1.8 GB old after GC,
# 3.5 GB RSS). Each edit must change live's unit (the pre-check aborts otherwise); dry run on a copy of live's unit
# 2026-10-23: both change it, the result reads "ExecStart=/usr/bin/java -Xms4G -Xmx6G -Dmapleroot.login-port=8485 ...
# -Dsolomapling.tutorial-admin=false -jar target/Cosmic.jar". Rollback restores the old unit from the backup.
UNIT_EDITS=("s# -Dslumsms.channelLoad.botWeight=0.1##" "s#/usr/bin/java -Xmx4G #/usr/bin/java -Xms4G -Xmx6G #")

PRECHECK_SQL=()

# Data: stage ships scripts.tar (scripts/npc/gachapon.js, gachaponInfo.js, gachaponRemote.js, 9201000.js) and
# srcdata.tar (every non-.java file under src/main: soloMapling/Gachapon/gachapon-pools.yaml, soloMapling/Economy/
# economy.yaml, BotDialoguePack AffinityDialogue/CoupleDialogue/GuildDialogue/MegaphoneDialogue/WorldEventDialogue.yaml,
# worldevents/WorldEvents.yaml, DramaDialogue.yaml), scripts/npc/cashshop_partner_ring.js.
# Nav cache: no copy. One-time clean-up of the non-base tier files with the game stopped (backup first), see
# docs/release/1.5.0-bots-affinity-deploy.md "One-time nav cache clean-up"; not automated by deploy.sh.
NAV_CACHE_SRC=""

# Cash Shop catalogue: gameplay-partner-rings-150 adds 13 friendship/couple rings (+13 rows, nothing else). It goes
# live with the jar (an old jar would sell them as plain items); staged next to it, old one backed up for rollback.
CASHSHOP_CATALOG=cashshop/catalog.tsv

EXPECT_LOG=("SoloMapling initialized")
FORBID_LOG=("failed to load" "Starting world 0" "is migration 011-bot-affinity applied" "is migration 012-bot-couples applied" "is migration 014-bot-guilds applied" "is migration 015-bot-romance applied" "is migration 016-bot-guild-wars applied" "is migration 020-economy-trade applied")
# 013-gachapon-machines and 021-cosmetics-merchant only add plife rows and log nothing when missing; the in-game
# check below covers them (a machine in Ellinia, Hanako in the FM entrance).
SMOKE_SECONDS=30
IN_GAME_CHECK="In game: log in, change channel, see bots in Henesys and the FM; GM: !botmapcap lists the busiest maps per channel against cap 50 and !env or !roster shows the director heading for 3,000; @gacha ellinia lists prizes; a machine stands in Ellinia; @botdrama answers; GM: !affinity, !couple list, !event list shows amoria_wedding; !botguild list shows ten guilds a minute after boot; Hanako stands in the FM entrance and @price answers; @romance and @guildwar answer; the Cash Shop Ring category sells the Clover friendship ring."

MAINT_MINUTES=10
# Public text: slumsms-monitor posts it as "(What's going on? <reason>~)" in the Discord maintenance post; keep it short.
MAINT_REASON="1.5.0 is here with a busier world, gachapon machines, bot guilds, bot pets and partner rings"
