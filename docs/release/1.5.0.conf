# SlumsMS 1.5.0 release settings, read by tools/release/stage (bash, sourced). Template:
# tools/release/templates/release.conf.example. Built from test-1.5.0-rc2 (rc1 + economy-gacha-150 + bots-affinity-150).
# Test recipe: docs/release/1.5.0-rc2-test-deploy.md.

# Migrations, in order. Live is at 010-color-prism; the ledger ids are the file stems.
MIGRATIONS=(011-bot-affinity 012-bot-couples 013-gachapon-machines)
# Live must show exactly 001..010 before the deploy (the default would compute the same; pinned so a stray id aborts).
LEDGER_BEFORE="001-preserve-arcane-for-classic-fm,002-classic-fm-return,003-solomapling-bots,004-daily-checkin,005-bot-real-stats,006-bot-yield-caps,007-bot-starter-stash,008-world-bera,009-gm-audit,010-color-prism"

# config.yaml. 1.5.0 adds no config keys (affinity/couples tunables are -Dsolomapling.* properties with safe defaults;
# the gachapon and wealth ceiling read gachapon-pools.yaml). Live already runs 5 channels with CHANNEL_LOAD 105.
# CHANNELS and CHANNEL_LOAD are applied in place by the generated deploy; no CONFIG_HEAD is needed.
# TODO(owner): CHANNEL_LOAD 105 (as now) vs ~125-130 for 1.5.0; set the chosen value below.
CHANNELS=5
CHANNEL_LOAD=105   # TODO(owner): 105 vs ~125-130
CONFIG_APPEND=""
CONFIG_HEAD=""
CONFIG_HEAD_BEFORE=""

# Client version gate (tools/release/set-min-client-build, see tools/release/README.md): the 1.5.0 client is build
# 10500. The hook in deploy.body.sh runs it in the apply step before the start, after publish-client.
MIN_CLIENT_BUILD=10500

UNIT_EDITS=()

PRECHECK_SQL=()

# Data: stage ships scripts.tar (scripts/npc/gachapon.js, gachaponInfo.js, gachaponRemote.js, 9201000.js) and
# srcdata.tar (every non-.java file under src/main: soloMapling/Gachapon/gachapon-pools.yaml, BotDialoguePack
# AffinityDialogue/CoupleDialogue/MegaphoneDialogue/WorldEventDialogue.yaml, worldevents/WorldEvents.yaml).
# Nav cache: no copy. One-time clean-up of the non-base tier files with the game stopped (backup first), see
# docs/release/1.5.0-bots-affinity-deploy.md "One-time nav cache clean-up"; not automated by deploy.sh.
NAV_CACHE_SRC=""

EXPECT_LOG=("SoloMapling initialized")
FORBID_LOG=("failed to load" "Starting world 0" "is migration 011-bot-affinity applied" "is migration 012-bot-couples applied")
SMOKE_SECONDS=30
IN_GAME_CHECK="In game: log in, change channel, see bots in Henesys and the FM; @gacha ellinia lists prizes; a machine stands in Ellinia; @botdrama answers; GM: !affinity, !couple list, !event list shows amoria_wedding."

MAINT_MINUTES=10
MAINT_REASON="1.5.0: gachapon machines in every town, bots that remember you, bot couples and weddings"
