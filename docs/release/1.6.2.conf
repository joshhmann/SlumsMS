# SlumsMS 1.6.2 release settings, read by tools/release/stage (bash, sourced). Template:
# tools/release/templates/release.conf.example; shape copied from 1.6.1.conf. There was no separate 1.6.1 release:
# 1.6.2 ships everything built for 1.6.1 (the comments below, carried over from 1.6.1.conf) plus owned alts, the
# NX exchange, Maker, bot quests/KPQ and the ports. Each variable is assigned once (bash would take the last
# assignment). "OWNER DECIDES" marks values the owner picks at release; they stay off in this file until then.
#
# 039 Slums Stamps (ticket 111): accounts.stamps; each vote point and each held Billion Coin (bags, hired merchants,
# storage, Duey) becomes 6 stamps and the coins are removed (kept in stamps_039_coins / stamps_039_accounts for the
# rollback). Earned through the Daily Check-In, which is already on on live (DAILY_CHECKIN_ENABLED=true, 1.6.0.conf),
# so it needs no new switch.
# 038 NX exchange and 044 exchange tickers (ticket 113): LISTED NOW (owner 2026-10-30: the exchange goes ON in 1.6.2;
# neither id is in LEDGER_BEFORE, so live has neither). 038 = in-game @nx, confirm step, escrow/payout tables; 044 =
# LEAF/CHAOS/WS/ELIXIR books (ticker columns, wider asset columns), needs 038 first. The switches are in UNIT_EDITS
# below. Never roll back 038/044 while any escrow or payout is non-zero. Checks: auto-QA t-xc-1..4, !qa run xc-1,
# !exchange status (docs/tickets/113-nx-exchange.md "1.6.2 switch-on").
# Exchange volatility (ticket 113 "Volatility": trader bots, fair value, guild-war market news, market events as GM
# tools, rumours) stays OFF for live: no -Dslums.exchange.traders, -Dslums.market.events or -Dslums.market.rumours in
# UNIT_EDITS until the owner OKs it. No migration (the BOT ledger bucket fits the VARCHAR(8) kind column). The tickers'
# raised limits (10 open, 20 a day per ticker, 7 days) are code defaults and ride with 044.
# 056 / 057 (b015, the site's "Most hunted"): site_mob_kills.estimated splits bots' modelled offscreen kills from
# counted ones (056); 057 makes it nullable (NULL = no split data for rows written before 056). Additive, 056 after 047;
# without them the totals still work and the split is not saved across a restart. world.json top_mobs rows gain
# "counted" and "estimated" (the site lane reads them).
# 052 Stamps: wedding gifts, Adventurer's Bag and MTS (ticket 111 follow-up): 039 missed Billion Coins in wedding
# gifts (inventoryitems type 8), in the @bp bag (infinitystorage) and in MTS listings (mts_items, seller's account). Same rule: 6 stamps a coin, coin removed (kept in
# stamps_052_*). Runs after 039. Rollback it before 039's.
# 040 Player invites (ticket 105, owner 2026-10-28): invite_codes.created_by_char/self_serve, accounts.invited_by_*.
# @invite needs no switch (always on once the jar and migration are in).
# 041 Family bot juniors (ticket 53, owner 2026-10-28: Family on, all perks, regulars may be your juniors): drops the
# stock foreign keys from family_character.cid / family_entitlement.charid to characters(id) (a bot has no characters
# row), kept in family_041_fks for the rollback, which deletes bot juniors' rows and puts the keys back.
# USE_FAMILY_SYSTEM goes false -> true through SERVER_SET (applied with the jar while the server is down; the
# rollback restores config.yaml). Tuning stays as on live: FAMILY_REP_PER_KILL 4, PER_BOSS_KILL 20, PER_LEVELUP 200.
# 043 Achievements and medals (ticket 93): character_achievements (progress and medal receipts per character, bots
# included; no foreign key). Switched on by -Dslums.achievements=true in UNIT_EDITS below (data: soloMapling/achievements/
# achievements.yaml, 32 goals). Off: no hook does anything. Rollback drops the table; medals already in bags stay.
# Knobs (code defaults, not set): -Dslums.family.botJuniorDailyRep=300, -Dslums.family.bondingMin=6,
# -Dslums.family.botsOff=true turns bot juniors off. Check: auto-QA t-fy-1, !qa run fy-1.
# 052 Family buffs persist (ticket 53, promise audit 2026-10-28, branch 161-family2): family_buffs (charid, exp/drop rate
# and end time); written when a perk is used, read back at boot with the families. No switch (it rides on
# USE_FAMILY_SYSTEM). Without it the game works and buffs end at a restart. Rollback drops the table. Same branch, no
# new switches: Summon Family on a regular or own alt brings it; Reunion / Summon across channels; party perk to every
# online member; perks stack with EXP/drop events and coupons, and the tooltips now say so (owner 2026-10-29, 161-family3);
# a regular's junior offer stands 30 min from anywhere. Knob (code default, not set):
# -Dsolomapling.drama.family.summonHoldMinutes=10 (how long a summoned grinder is held on the summoner's map).
# b035 (same branch): bot juniors give rep while training off screen (capped 300/day), Bonding buffs bot juniors,
# known players are always accepted (slums.family.acceptChance is no longer read). No switch.
# Checks: auto-QA t-fy-1, t-fy-2 (perks, real kills, cap, reset), t-fy-3 (Reunion / Summon a regular), t-fy-4 (offer).
# 047 Most hunted monsters persist (owner request via the site session): site_mob_kills (hour, mob id, kills; bots and
# players together, no split), flushed every 5 min and at shutdown, pruned after 30 days, read back at start. Read-only
# telemetry, safe for live; needs no new switch (it runs with the existing -Dslums.site.export=true, on live since 1.6.0;
# -Dslums.site.mobKills.noDb=true turns the table off). world.json top_mobs / top_mobs_7d, top 25 each. Bots grinding
# offscreen now count too (they never kill a real mob). Without the migration the game works; counts reset at restart.
# Maple Island opt-in (ticket 29, owner 2026-10-28): TUTORIAL_ISLAND_PROMPT=true (also the code default; no migration).
# Check: auto-QA t-ti-1, !qa run ti-1. Rollback = set it false.
# 045 Newer-area cards (owner 2026-10-28): 254 Monster Book cards for the Arcane River / Grandis mobs drop at 2%
# (drop_data chance 20000) plus their monstercarddata rows (cardid -> mobid). Renumbered from 043 (042/043/044 taken).
# Needs no switch. drop_data is read at boot or !reloaddrops; monstercarddata at boot only. Check: auto-QA t-nc-1.
# The rebuilt monsterbook.json (tools/monsterbook/build_book.py) goes out with the client's Custom.wz, not with this.
# Bot rebirth (ticket 30, owner 2026-10-28 "Earned, slowly"): BOT_REBIRTH_ENABLED (code default false) on, at most
# BOT_REBIRTH_PER_DAY=2 bot rebirths a UTC day server-wide (the code default; written so the cap is visible). Needs
# USE_REBIRTH_SYSTEM (already true on live). No migration: a bot's rebirths go in characters_rebirth like a player's.
# Knobs (code defaults, not set): -Dslums.botRebirth.gatherHours=6 (between off-screen boss runs); real runs (161-
# rebirthkeys): -Dslums.botRebirth.liveRuns=true, .maxRuns=2, .runMinutes=40, .waitHours=2, .retryMinutes=30.
# Check: auto-QA t-rb-1, t-rb-2, !qa run rb-1, rb-2.
# Party damage ranking (client ticket 118, DPS meter): DAMAGE_RANK_ENABLED=true. Only sends LP 0x3739 to clients of build
# >= DAMAGE_RANK_MIN_BUILD, so old clients get nothing. The code default is 10690, above the 1.6.1-era client (rc8, build
# 10680), so SERVER_SET lowers it to 10640 (as on TEST since 2026-10-28). Knob (code default): DAMAGE_RANK_MIN_MOB_HP=
# 5000000 (bosses always). Rollback = set it false.
# 042 Slums-chan (owner 2026-10-28): NPC 9990000 stands in Base of Roots (340,117) and Henesys (first 1215,334; moved to 1040,334 by 048 so no map object draws over her); plife rows
# only. Needs the host-data step in docs/release/1.6.2-deploy-steps.md (tools/data-align/add_slums_chan.py) and the
# 1.6.2 client (Data/Npc/9990000.img). The first-login guide and @settings are framed by her head from this jar on.
# Custom NPCs (9990000, 2985-2999) are only sent to a client with their data (stamp format 2 caps bit 0, else build
# >= CUSTOM_NPC_MIN_BUILD 10610; code defaults, not set): an older client disconnects on them (TEST 2026-10-28). Second
# net only: MIN_CLIENT_BUILD for 1.6.2 must still be >= the final 1.6.2 client build.
# 046 Lazy Penguins (owner 2026-10-28): 15 decorative NPCs 2985-2999, one per town (Happyville, Henesys, Ellinia, Perion,
# Kerning City, Lith Harbor, Sleepywood, Nautilus, Orbis, Ludibrium, Aquarium, Leafre, Mu Lung, Showa, New Leaf City);
# plife rows only. Host WZ step: tools/data-align/add_lazy_penguins.py (docs/release/1.6.2-deploy-steps.md section 2).
# 048 Custom NPC spots (owner/client session 2026-10-28): Slums-chan (Henesys) and 9 penguins (Happyville, Henesys, Ellinia, Perion,
# Kerning City, Ludibrium, Aquarium, Mu Lung, New Leaf City) moved off spots where map objects drew over them; UPDATEs the
# 042/046 plife rows, restart needed, rollback restores the old spots. No switch.
# 049 Penguin spots 2 (client-session screenshots on TEST): Blueberry, Tangerine, Mint, Classic, Lemon moved to ground-level walkway
# spots (out of sight / on roofs and ledges). UPDATEs the 046/048 rows, restart needed, rollback restores them. No switch.
# 050 Post-Big-Bang drop tables (ticket 81, owner approved the 120+ ladder for TEST 2026-10-28): ~8,000 drop_data rows
# for 350 Arcane River / Grandis / Future-Twilight Perion / Lion King's Castle / Rose Garden mobs (mesos, potions, ores,
# own ETC, scrolls, mastery books, classic equips, post-Big-Bang gear); every inserted pair is recorded in
# bb_drops_050_rows and the rollback deletes exactly those; 045's card rows are untouched. drop_data is read at boot or
# !reloaddrops. Ships WITH the same jar's soloMapling/mob-stat-overrides.tsv (classic-curve HP and ~2x classic EXP/hour
# for those mobs, EXP x1.4 on Leafre/Minar, Temple of Time, Ulu) and server.maps.AreaGates (the Future and lower
# Grandis open at level 120; upper Grandis and Arcane stay rebirth 3; bots follow): the stat table without 050 makes
# these mobs easy kills that drop little. Knob: -Dslums.mobStatOverrides=false (table off). Check: auto-QA t-ld-1.
# Review: docs/economy/bb-drops/REVIEW.md. (051 is the penguin move; the ledger order only matters per table.)
MIGRATIONS=(038-nx-exchange 039-slums-stamps 040-player-invites 041-family-bot-juniors 042-slums-chan-npc 043-achievements 044-exchange-tickers 045-newer-area-cards 046-lazy-penguins 047-mob-kills 048-custom-npc-spots 049-penguin-spots-2 050-bb-drop-tables 051-penguin-showa 052-stamps-gifts-mts 053-family-buffs 054-starter-chair-repair 055-boss-drop-gaps 056-mob-kills-split 057-mob-kills-split-null)
# Checked against database/migrations 2026-10-30: no other file is missing from LEDGER_BEFORE or this list (033 never
# existed). Server Dev: re-check before staging in case a migration lands after this draft.
# 054 Starter chair repair: 1.6.0.2-1.6.0.4 saved the HUD tip's 'uitip=1.6.0.2' under area-info 29151, StarterChairs'
# 'chairs given' key, so a player whose chairs were held back (Setup bag full) never got them. For player characters
# with that tip mark under 29151 who own no Relaxer/Fishing Chair anywhere (bags, merchant, gifts, Duey, account storage,
# @bp bag, MTS), the mark moves to 29153 (the tip's key since 1.6.1) and the chairs come at next login. Touched rows
# are kept in starter_chair_054_rows; the rollback puts them back by character. No switch. TEST had none to repair.
# 055 Boss drop gaps (owner 2026-10-29): 242 drop_data rows for the boss-fight mobs 050 missed (outside its regions):
# one boss table per clear on Cygnus' form that dies (8850012, 30 rows), elite tables for the guards the fight spawns
# (8850000-8850004, 32 each; the same jar makes a guard die with drops, MapleMap.afterBossKilled), one elite table per
# Castellan clear on Castellan Toad (9400409, 28; its meso row stays), and the Arcane Lantern Erda (8641008, normal, 24).
# Same rules as 050, generated by tools/economy/gen_bb_drops.py gaps; inserted pairs are recorded in
# boss_drops_055_rows and the rollback deletes exactly those; existing pairs are skipped. drop_data is read at boot or
# !reloaddrops. No switch. Stubs (8850005, 8850011, 8880150, 8880302, 8880415, 8645009, 8641009), 8850006-8850009 and
# Castellan 9400408 stay dropless.
# Ledger of migrations live already has (the stage script's baseline; 038 and 044 are not here, so they are listed above).
LEDGER_BEFORE="001-preserve-arcane-for-classic-fm,002-classic-fm-return,003-solomapling-bots,004-daily-checkin,005-bot-real-stats,006-bot-yield-caps,007-bot-starter-stash,008-world-bera,009-gm-audit,010-color-prism,011-bot-affinity,012-bot-couples,013-gachapon-machines,014-bot-guilds,015-bot-romance,016-bot-guild-wars,020-economy-trade,021-cosmetics-merchant,022-botmemory-about-index,023-character-lookup-indexes,024-restore-stock-shop-items,025-remove-dead-skill-books,026-dalair-henesys,027-nimble-free-market,028-bot-life-profile,029-bot-bonds,030-bot-memory-kinds,031-social-gate,032-economy-counters,034-site-board-npc,035-trade-ratings,036-invite-codes,037-password-resets"

# Chat-model split (owner-approved 2026-10-28): live switches from GLiNER (:8900) to the trained model.
# Intent + con go to BOT_DECIDE_URL (:8913), tone to BOT_DECIDE_TONE_URL (:8910); both serve model id "jev-latest"
# (they answer 404 to the default "decide"). Rollback = set BOT_DECIDE_URL back to http://192.168.0.17:8900, blank
# BOT_DECIDE_TONE_URL and set both models back to decide, then restart. Text values are supported by set-release-config.
# Bot-to-bot talk and friend crews (ticket 114, owner 2026-10-27/28: switched on with the release). -Dslums.bottalk:
# greetings, goal-driven chats and groups between bots, every bot line with its intent and none to the classifier;
# -Dslums.crews: friends move towns together. Rollback = drop the two flags from the unit and restart. Their
# UNIT_EDITS entry is in the one UNIT_EDITS array below (with achievements): a second UNIT_EDITS= would replace it.
#
# OWNED ALTS (ticket 13, @botme): the full feature (follow, fight, loot, damage/death, activity gate) is built; check
# t-oa-1. OWNED_ALTS_ENABLED stays true on live (bot friends' per-owner capacity). Live had @botme resting since
# 1.6.0.4 ("Alts are resting while we finish them"; @dismiss works).
# OWNER DECIDES AT RELEASE: OWNED_ALTS_SUMMON_ENABLED (default true once the owner's @botme playtest passes). It is
# left at false below; FLIP IT TO true at release if the playtest passes. The companion switches that follow it
# (ticket 99, nutnnut adoption, all code-default false, each its own switch) are also OWNER DECIDES, false for now:
#   COMPANION_ORDERS_ENABLED          patrol, sentry, move here, formations
#   COMPANION_TRADES_ENABLED          trade by category with the owner ("trade pots", "show me your hat")
#   COMPANION_UPGRADES_ENABLED        upgrade sharing ("any upgrades?", "trade upgrades")
#   COMPANION_SUPPLIES_ENABLED        supply sharing ("need pot / ammo / rocks")
#   OWNED_ALTS_INVITE_SUMMON_ENABLED  a party invite naming one of your offline characters calls it as an alt
# All five are boolean keys in config/ServerConfig.java, so set-release-config --set can write them.
SERVER_SET=(BOT_DECIDE_URL=http://192.168.0.17:8913 BOT_DECIDE_TONE_URL=http://192.168.0.17:8910
            BOT_DECIDE_MODEL=jev-latest BOT_DECIDE_TONE_MODEL=jev-latest
            USE_FAMILY_SYSTEM=true TUTORIAL_ISLAND_PROMPT=true
            BOT_REBIRTH_ENABLED=true BOT_REBIRTH_PER_DAY=2
            DAMAGE_RANK_ENABLED=true
            DAMAGE_RANK_MIN_BUILD=10640
            OWNED_ALTS_SUMMON_ENABLED=false
            COMPANION_ORDERS_ENABLED=false
            COMPANION_TRADES_ENABLED=false
            COMPANION_UPGRADES_ENABLED=false
            COMPANION_SUPPLIES_ENABLED=false
            OWNED_ALTS_INVITE_SUMMON_ENABLED=false)

# Achievements and medals (ticket 93): the switch. Check: auto-QA t-ac-1, !qa run ac-1, @achievements in game.
# Bot talk + crews (ticket 114, above): -Dslums.bottalk and -Dslums.crews. Checks: auto-QA t-bt-1, t-bt-2, !qa run bt-1.
# In-game @bug (ticket 131; check t-br-1): live writes its reports where the site reads them. Switched on
# 2026-10-29: the site report_service lock patch is live (site hotfix fda54b681, 2026-10-28), so the site and the game
# share the fcntl lock on /var/lib/slums-feedback/reports.jsonl (owned slums-report 0640; the game runs as root).
# NX exchange ON (owner 2026-10-30, docs/tickets/113-nx-exchange.md "1.6.2 switch-on"): -Dslums.exchange=true,
# the five tickers, and -Dslums.exchange.startHalted=true so the exchange comes up HALTED and staff run
# "!exchange resume" after checking "!exchange status" (0 mismatches). The site's password step needs the game's
# auth API, which live has had since 1.6.0 (docs/release/1.6.0.conf UNIT_EDITS wrote -Dslums.auth.port=8186
# -Dslums.auth.secretFile=/etc/slums-auth/secret -Dslums.auth.revoked=/var/lib/slums-login/revoked.txt into the unit;
# tools/site/slums-login.service calls http://127.0.0.1:8186). Not re-added here: the flags are already in the live
# unit. The live-copy rehearsal checks they are still there and that a site sign-in works against the staged unit.
# houseAccount: regulars trade through ONE staff-owned account; the id is OWNER PICKS (placeholder below, no real id).
# Default-ON, need nothing here: solomapling.convo.grounding and solomapling.convo.stateOfMind (chat grounding checker
# and mind snapshot; =false turns them off), solomapling.worldEvents.lootAftermath (event loot scramble; =false turns
# it off), slums.exchange.siteAuthGame and slums.exchange.stepUp (the password step for site sells and big buys, 12 h;
# stepUpFreeMesos=10000000).
UNIT_EDITS=("s# -jar # -Dslums.achievements=true -Dslums.bottalk=true -Dslums.crews=true -Dsolomapling.reportsFile=/var/lib/slums-feedback/reports.jsonl -Dslums.exchange=true -Dslums.exchange.tickers=NX,LEAF,CHAOS,WS,ELIXIR -Dslums.exchange.startHalted=true -jar #")
# OWNER PICKS before release (each its own sed entry appended to UNIT_EDITS above, no real id here):
#   -Dslums.exchange.houseAccount=<OWNER PICKS: staff account id>
#
# OWNER DECIDES: 1.6.2 feature switches. All OFF here (each is a JVM -D flag; add to the sed in UNIT_EDITS to turn on).
# Nothing below is set; uncomment and fold into UNIT_EDITS on the owner's go, one line per switch:
#   -Dslums.botquests.enabled=true            bots do real quests (BotQuests)
#   -Dslums.temple.enabled=true               bots drive the Temple of Time mainline quests (3500-3520); needs botquests
#   -Dslums.mechanics=true                    bots play party quests / content mechanics (ticket 130, Mechanics)
#   -Dslums.mechanics.lobby=true              KPQ lobby: bots gather in Kerning City and run Kerning PQ (KpqLobby); needs slums.mechanics
#   -Dslums.gear.optimizer=pareto             bot gear picker uses the Pareto optimizer (default "climb")
#   -Dslums.gear.dexless=true                 bots may skip DEX on gear (BotProgression)
#   -Dslums.grind.gearFirst=true              gear-first grind map choice (ticket 162 part 2, GearFirstAdvisor)
#   -Dslums.junk.sort=true                    junk sorting / reserve rules for bot equip bags (ticket 162 part 4)
#   -Dslums.scroll.ev=true                    scroll choice by expected value (BotScrolling, UpgradeSimulator)
#   -Dslums.bots.apvariants=true              new/reborn bots may roll dexless/lukless/strless/pure/25 AP builds;
#   -Dslums.bots.apvariants.fromSlot=<n>      first roster slot that rolls one (unset = only reborn bots)
#   -Dslums.bots.partysupport=true            bots heal their party and drink buff pots while partied with a real player
#   -Dslums.bots.famerequest=true             a friendly bot may fame a player who asks
#   -Dslums.bots.magicguard=true              a bot with Magic Guard up splits damage between HP and MP
#   -Dsolomapling.jobErrand=true              job-advance errands for bots (JobErrand)
#   -Dsolomapling.botSkillBooks=true          bots buy / use skill books (BotSkillBooks)
#   -Dsolomapling.economy.maker.botBatch=true bots turn leftovers into crystals and Maker junk (economy.yaml maker.botBatch)
#   -Dbot.nav.swimWallJump=true               nav port: wall-jump out of water
#   -Dbot.nav.blockedPosWatchdog=true         nav port: unstick bots blocked at one position
#   -Dbot.nav.teleportPhantomGuard=true       nav port: guard against phantom teleport positions
#   -Dbot.nav.zmassWalls=true                 nav port: respect z-mass walls
#   -Dslums.navTrace=true                     nav trace logging (diagnostic, noisy)
#   -Dslums.killcalib=true                    report-only kill calibration, real vs modelled kills (ticket 157)
#   -Dslums.inspect=true                      read-only bot inspect API (BotInspectApi)
#   -Dslums.inspect.port=8098                 live suggestion: 8098
#   -Dslums.inspect.secretFile=/etc/slums-inspect/secret   live suggestion; file readable by group slums-login

