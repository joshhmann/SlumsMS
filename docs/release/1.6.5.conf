# SlumsMS 1.6.5 release settings, read by tools/release/stage (bash, sourced). Template:
# tools/release/templates/release.conf.example; shape copied from 1.6.4.1.conf. Each variable is assigned once.
#
# DRAFT, Server Dev, 2026-11-07 08:4x UTC (00:4x PT), on the Coordinator's order. Not staged, not rehearsed, no deploy.
# The rehearsal on 164 and the live deploy each wait for the owner's go.
#
# 1.6.5 = v1.6.4.1 + the stabilization cards (docs/release/1.6.5-notes.md has the full list with TEST evidence).
# Facts this file rests on (read-only, live 164, 2026-11-07 ~08:35 UTC):
#   - live's ledger has 61 migrations, 001..065 (no 017-019, no 033); the repo has exactly two more: 066 and 067;
#   - live's unit carries none of -Dslums.exped.door, -Dslums.altfight.instanceleash, -Dslums.bossfight.reach;
#   - live's unit has -Dslums.auth.revoked=/var/lib/slums-login/revoked.txt, so P0-7's banned.txt goes beside it in
#     /var/lib/slums-login/ (the server runs as root; no permission change);
#   - git diff v1.6.4.1..release-1.6.5 touches no WZ file, no data-align TSV, no ServerConfig key and no cash shop file.

# Migrations, applied by deploy.sh after the stop-backup, in this order. Both are idempotent (CREATE ... IF NOT EXISTS /
# ledger-guarded), both have a .rollback.sql, and both run on the scratch copy in the rehearsal first.
#   066-operation-journal  P0-1/P0-2: the operation journal table. Through deploy.sh, not typed by hand: that way the
#                          rehearsal applies it, the ledger check covers it and rollback.sh knows it. The one hand part
#                          is in its rollback: before running 066's .rollback.sql, settle any row still STARTED
#                          (SELECT id, kind, actor_id, ref_id FROM operation_journal WHERE state = 'STARTED').
#                          The jar needs it: without the table, boot logs "Journal reconcile: could not read open rows".
#   067-drop-useless-etc   b349: removes 16 junk ETC drop rows from 050; each removed row is kept in useless_etc_067_rows
#                          so the rollback restores exactly what was deleted. Items players already hold are untouched.
MIGRATIONS=(066-operation-journal 067-drop-useless-etc)
