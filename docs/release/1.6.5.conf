CONFIG_HEAD_BEFORE=""
SERVER_SET=()

# Unit switches.
#   ON   -Dslums.exped.door=true   sw-exped-door (proven on TEST 2026-11-06 21:37 UTC, both parts) together with
#                                  run-min-room (proven 2026-11-07 03:55 UTC): a member not at the altar is left out with a
#                                  named warning, a dismissed alt leaves the list, and a boss run that starts under the
#                                  row's minimum still runs. TEST has carried it since batch 9 (f11190d43).
#   OFF  -Dslums.altfight.instanceleash and -Dslums.bossfight.reach stay off on live (b311 decision). The checks below
#        make the deploy abort if anything would leave either on the unit.
# One expression, like 1.6.4's: it adds the flag before -jar. It changes the unit (live lacks the flag), so unit-edit's
# "changes nothing" guard holds; if the flag is ever put on by hand first, the pre-check aborts, which is what we want.
UNIT_EDITS=("s# -jar # -Dslums.exped.door=true -jar #")
UNIT_FLAGS_PRESENT=(-Dslums.exped.door)
UNIT_FLAGS_ABSENT=(-Dslums.altfight.instanceleash -Dslums.bossfight.reach)

# P1-R1: the release's hand step and the WZ files it writes. 1.6.5 has neither: no WZ change, no data-align step, no
# file under the server folder outside the jar. Declared empty on purpose, so the rehearsal and the gate cover exactly
# "nothing extra" rather than an undeclared step done by hand on the night.
EXTRA_STEPS=""
EXTRA_FILES=()
WZ_TARGETS=()
WZ_REPLACE=()
# NOT an extra step (it is outside the server folder, and the rehearsal sandbox only protects the server folder, so a
# rehearsal would write live): P0-7's site side. After the game is back online (its boot sweep writes banned.txt), Site
# installs login_service.py from site-165-p07-ban-ends-sessions (14e897e20, once merged on the site line):
#   cp -p /opt/slums-login/login_service.py{,.pre-165} && install -m 0644 tools/site/login_service.py /opt/slums-login/
#   systemctl restart slums-login && curl -s 127.0.0.1:8094/api/login/health   -> {"ok": true}
# Rollback: copy .pre-165 back and restart slums-login; the game's banned.txt is then simply unread. Owner's go, same
# night, Site lane's step (docs/site/DEPLOY.md, slums-login).

CHANNELS=5
CHANNEL_LOAD=125
