# WHAT 1.6.4 ADDS OVER 1.6.3 (code is in the jar; this file only switches it - no migration, no config key, no client):
# Bots play the mechanics (ticket 130, branch 164-all-merge): the bot parties clear party quests and share boss
# expeditions. 57 content rows, 29 boss and 28 party quest, 201 stages, one yaml per row, all listed in
# src/main/java/soloMapling/mechanics/content/index.txt. The switches are the row set below, on top of 1.6.3's
# -Dslums.mechanics=true (already on live) and -Dslums.mechanics.lobby=true (KpqLobby, live since 1.6.1 - NOT the same
# thing as the per-row lobby flags, which stay off, see "still off" below):
#   -Dslums.mechanics.boss=true                  the 29 boss rows arm; without it every boss row is inert
#   -Dslums.mechanics.<family>=true              every row that names its own flag: opq lpq hpq cafepq ludimazepq
#                                                piratepq treasurepq dellibattle magatiapq magatiapqz ellinpq cwkpq
#                                                bossrush zakumpq guildquest nwill nlucid nverus ndarknell
#                                                (20 distinct flags over 32 rows; 25 rows need nothing beyond the two
#                                                above - kpq, the base boss rows, guardiannex1..6, zakum, horntail)
#   -Dslums.chaos.zakum=true                     row zakum-chaos (Chaos Zakum on the same altar, own expedition)
#   -Dslums.bossfight.revivepause=true           the revive pause ticket 130 decided on (code default OFF, RevivePause
#                                                javadoc "since round 9: every switch is off unless a brief says
#                                                otherwise, and the release conf carries the =true line"). Drop the flag
#                                                and boss revives behave exactly as in 1.6.3. In 1.6.4 this line is what
#                                                makes a DEAD BOT a pause rather than a lost member (see mortality below),
#                                                so it is load-bearing, not a nicety: with it off a bot death ends the
#                                                run through the ordinary member paths instead of being waited out.
# Bots are MORTAL in 1.6.4 (owner decision 4, branch 164-botmortal): before this release a bot inside an event
# instance could not die at all - BotDeaths.protectedFromDeath made every lethal hit a no-op. Now a lethal hit kills
# the bot, a dead bot is a lost member whose hold goes back, a Bishop's Resurrection is the only thing that brings it
# back (a heal cannot lift 0 HP), the run waits it out when revivepause is on, and the death spends the expedition's
# death-count budget. That is a visible change in every boss room and it is the intended default; the old behaviour is
# one switch, listed under "still off" below.
# Two switches from the same lane ship ON and need no line anywhere: they are policy, not experiments. They are named
# here so Server Dev can see them and can turn either off in one word if a report comes in:
#   -Dslums.exped.botcaptain  (default ON)       a bot may captain an expedition: the GM command
#                                                `!mechanics boss <TYPE> [n]` stages one, and a real player in the party
#                                                always outranks the bot captain (preferredLeader picks the player).
#                                                In 1.6.4 that command is the ONLY caller - no scheduler, no lobby, no
#                                                tick starts a bot-captained run.
#   -Dslums.exped.altfollow   (default ON)       an owned alt follows its owner into any expedition and takes a
#                                                membership slot, so the party (and the expedition's size check) counts
#                                                it. An alt is the owner's own character, not a stranger's.
# Everything else the lane built stays OFF, deliberately, and each line says why:
#   -Dslums.mechanics.tiers / -Dslums.mechanics.tier   the four PQs' HARD numbers are a proposal awaiting the owner
#                                                (DIFFICULTY-CHAOS-PLAN.md section 9), and the REWARD side now exists
#                                                too: a level-2 run of Kerning/Henesys/Ludi/Orbis pays the same item ids
#                                                at twice the quantity (5779738be, data in the four scripts) with EXP
#                                                identical at both levels - pinned by TierPayTest, so no rate moves. It
#                                                still stays OFF: the mob numbers are unscaled proposals, nothing in game
#                                                picks a tier yet, and no auto-QA check has read a scaled room. With
#                                                .tiers unset the level is 1 before anything is read, so a normal run is
#                                                byte-identical to the stock quest.
#   -Dslums.mechanics.realruns / .simruns / .simfloor   the bot-only run quota and simulated runs have never been seen
#                                                under load; with .realruns unset no run is refused, so simulation
#                                                never happens and live is 1.6.3's behaviour.
#   -Dslums.mechanics.<row>.lobby               handing a whole PQ to a bot lobby takes it out of players' hands; the
#                                                KPQ lobby that IS on is 1.6.1's, not this one.
#   -Dslums.bots.immortal=true                  TEST switch: restores the pre-1.6.4 unconditional protection, i.e. a
#                                                bot in an event instance cannot die. Mortal bots are the 1.6.4 default
#                                                (code default false); turn this on only to isolate a bot-death problem
#                                                on TEST, never on live.
#   -Dslums.bossfight.deathcount               NOT in the sweep, and it stays off: charging a bot's death is a
#                                                separate switch from mortality, and a five-bot wipe would spend the
#                                                default budget of 10 in one room. Mortality ships; the charge waits
#                                                for the owner to say a bot death may end a live run.
#   -Dslums.mechanics.amoriapq.botcount        Amoria PQ counts a bot as a party member. TEST ONLY for now (the owner
#                                                asked for "test only atm"): it changes what a real player's party is
#                                                admitted to, and the quest's puzzle stages still need human hands, so
#                                                nothing in a live party is admitted by it before the owner says so.
#   the fishing, bot-life and Chaos Horntail work   not in 1.6.4 at all (docs/roadmap/1.7.0.md says what is left).
# Checks for the row set (auto-QA, run them before the go/no-go): t-mx-1..t-mx-6 need -Dslums.mechanics=true and SKIP
# without it; t-ex-1 needs nothing; t-ex-2 needs -Dslums.mechanics.boss=true or it reads EX2 BASELINE and SKIPs; t-in-3
# needs nothing. The row nets are unit tests, not checks: MechanicsRowWzIntegrityTest and ContentRowWzIntegrityTest both
# need -Dwz-path. The full run is `tools/ops/autoqa-run all` (190 checks; tools/ops/autoqa-proof prints why:
# src/main/resources/soloMapling/autoqa-coverage.tsv is one of the changed files).

