# HOW THE UNIT_EDITS ENTRY WORKS (read before editing):
#   1. 1.6.4 carries ONE entry: "s# -jar # <flags> -jar #" re-issues the whole 1.6.3 flag block with the 1.6.4 flags
#      appended, exactly as 1.6.1, 1.6.2 and 1.6.3 did to their predecessors. It is self-healing and safe to repeat;
#      live's unit ends up carrying each flag twice with identical values (the JVM takes the last -D). The cleaner
#      one-block rewrite its comment describes below is still NOT in this draft: it deletes every -D it does not know.
#   2. The 1.6.3 draft's first entry ("s# -Dsolomapling.fads=false##g") is deliberately NOT carried: 1.6.3 removed that
#      stopgap from live, so on a 1.6.4 staging the pattern would change nothing and the pre-check would abort with
#      "changes nothing". That is the right behaviour if someone has put the flag back by hand - look before staging.#      rather than re-adding the entry. It is self-healing (a flag dropped from live's unit comes back) and
#      it is safe to repeat, but read the consequence: live's unit already holds 1.6.2's copy of these flags, so the
#      ExecStart line ends up carrying each flag twice, with identical values. The JVM takes the last -D for a key, so
#      behaviour is unchanged, and the page shows the duplicates in the deploy pre-check output.
#      Cleaner alternative if Server Dev wants it: collapse the unit's -D run to one block with
#      "s#\\( -D[^ ]*\\)* -jar # -jar #" as a FIRST entry and then re-issue the block (that also needs the 1.6.0 auth
#      and export flags added to the list above, which is why it is NOT in this draft: the strip deletes every -D it
#      did not know). Do it as its own reviewed change with a rehearsal, never on release night.
#   3. The EnvironmentFile entry 1.6.2 carried ("/^\\[Service\\]/a EnvironmentFile=/etc/slumsms/cloud-llm.env") is
