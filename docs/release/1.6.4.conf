# 1.6.4 release conf - DRAFT as of the first 1.6.4 ticket that added a switch (ticket 181, economy).
#
# Sourceable and complete in shape, but the blank keys are honest gaps: MIGRATIONS, UNIT_EDITS, MIN_CLIENT_BUILD and the
# smoke checks are filled at the 1.6.4 freeze, exactly as e87e3d61d drafted 1.6.3's before its go/no-go. LEDGER_BEFORE is
# intentionally NOT set (see the comment by that key): gen-deploy's __auto__ default computes it, and pinning it blank
# would abort every deploy against live's real ledger, so set it only if 1.6.4 must pin an exact ledger string. Do not
# stage this until the freeze (tools/release/stage needs a build of the same commit anyway).
#
# WHAT 1.6.4 ADDS SO FAR: ticket 181's two economy switches, plus one numeric server key from card b296 (the
# star-force stat share, SERVER_SET below). Both switches are OFF unless the server is started with the flag, and both
# are turned ON only if their TEST proof passed at the go/no-go. With either off, the jar behaves exactly as 1.6.3.
# This is the ONLY 1.6.4 release conf: 164-b296 deliberately does not ship one and carries only its ServerConfig change,
# so do not create a second copy - a second one merges as an add/add conflict and silently drops keys.
#
#   -Dslums.offer.pricefloor=true
#       An accepted offer - a player shop or a hired merchant, including the AFK owner's scripted accept - may not rewrite
#       a listing under the price band bot sales are held to (PriceBand BOT_SELLS low for the stack), and never under the
#       bot's own paid price for a consigned lot. Off: the offer's final price is written as before (ticket 181,
#       market#F-03). Open owner question: the floor's exact height (docs ticket 181 REPORT).
#
#   -Dslums.bots.merchantpoolstock=true
#       A selling merchant bot stocks from the resale pool bot shops restock from instead of generating a fresh item per
#       trade, stocks nothing while that pool is empty, and counts every stock in the mint ledger
#       (mint:item:merchant-bot). Off: an item is generated per stocked trade as before (ticket 181, market#F-07).
#
# To turn either on, append its flag to the UNIT_EDITS sed line below (1.6.3's line is the model) and say which proof
# passed, as the 1.6.3 conf does for its four switches.

MIGRATIONS=()
LEDGER_NOT_LIVE=()
# LEDGER_BEFORE is deliberately NOT set: gen-deploy defaults it to __auto__ (every repo migration id not in MIGRATIONS
# and not in LEDGER_NOT_LIVE). An explicit LEDGER_BEFORE="" would cancel that default and make the deploy pre-check
# abort against live's real ledger. Only set it, as 1.6.3.conf does, if 1.6.4 must pin the ledger to an exact string.
#LEDGER_BEFORE=""
CONFIG_APPEND=""
CONFIG_HEAD=""
CONFIG_HEAD_BEFORE=""
# Owner decision (e), card b296: the STR/DEX/LUK/INT share of the star-force crafting bonus was absent from live
# config.yaml and read 0; it is now 0.2, matching STARFORCE_BOOST_PERCENTAGE. Old 0 (absent). Numeric key, so it goes
# here and not in UNIT_EDITS.
SERVER_SET=(STARFORCE_BOOST_PERCENTAGE2=0.2)
UNIT_EDITS=()
PRECHECK_SQL=()
NAV_CACHE_SRC=""
CASHSHOP_CATALOG=""
CHANNELS=""
CHANNEL_LOAD=""
MIN_CLIENT_BUILD=""
EXPECT_LOG=("SoloMapling initialized")
FORBID_LOG=("failed to load" "Starting world 0")
SMOKE_SECONDS=30
IN_GAME_CHECK="In game on the 1.6.4 jar: log in and enter a character; with -Dslums.offer.pricefloor=true, accepting an offer under the selling band's floor leaves the listing at the floor instead of the offer's number, and a consigned lot never drops under the bot's paid price; with -Dslums.bots.merchantpoolstock=true, a selling merchant bot shows a pooled item and stays empty-handed while the pool is empty. Also craft a star-force item at the NPC: STR/DEX/LUK/INT now carry the 20% share (STARFORCE_BOOST_PERCENTAGE2=0.2) as well as WATK/MATK."
MAINT_MINUTES=5
MAINT_REASON=""
