# SlumsMS 1.6.6 release settings, read by tools/release/stage (bash, sourced). Template:
# tools/release/templates/release.conf.example; shape copied from 1.6.5.1.conf. Each variable is assigned once.
#
# Server Dev, 2026-11-08 15:2x UTC, after the owner's "Go stage and rehearse 1.6.6 on 164" (typed in Server Dev's session).
# 1.6.6 is frozen at e376bd659 (docs/release/1.6.6-notes.md has the cards and TEST evidence). The live deploy waits for
# the owner's own go. Started from the flag-parity draft on 166-flag-parity (327ae3d6c), corrected for 1.6.5.1.
#
# Facts this file rests on (read-only, live 164 and TEST, 2026-11-08 15:1x UTC):
#   - live's ledger: 63 ids, last 067-drop-useless-etc; database/migrations still ends at 067, so no migration;
#   - live's -D switches against TEST's running ones, host-specific keys set aside (ports, paths, house account,
#     template id, dashboard period): only TEST has the QA plumbing (slums.qa, qa.feed, autoqa, autoqa.parallel,
#     client.allowQa, attackcapture, socialtrace) and only live has slums.inspect and slums.killcalib. Every behaviour
#     switch matches, including instanceleash (live since 1.6.5.1), exped.door, and exchange.startHalted. So 1.6.6 needs
#     no unit change;
#   - git diff b6b64a761..e376bd659 outside src/docs/tools: one NPC script (scripts/npc/9020001.js, Kerning PQ's
#     Cloto questions, shipped in the jar's scripts/ copy like every script) and the monitor (deploy/monitor, not part of
#     this deploy: MONITOR="" until the Cody fix is installed on its own go). No WZ file, no config key, no cash shop file;
#   - Map.wz identical on live and TEST: 12,191 files, combined sha256 6ece84eee7a1982e on both (15:17 UTC).

