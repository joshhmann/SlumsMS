# SlumsMS 1.6.1 release settings, read by tools/release/stage (bash, sourced). Template:
# tools/release/templates/release.conf.example; shape copied from 1.6.0.conf. Started 2026-10-27 with MIGRATIONS only:
# the rest (SERVER_SET, UNIT_EDITS, MIN_CLIENT_BUILD, checks, maintenance text) is filled in when 1.6.1 is staged.
#
# 039 Slums Stamps (ticket 111): accounts.stamps; each vote point and each held Billion Coin (bags, hired merchants,
# storage, Duey) becomes 6 stamps and the coins are removed (kept in stamps_039_coins / stamps_039_accounts for the
# rollback). Earned through the Daily Check-In, which is already on on live (DAILY_CHECKIN_ENABLED=true, 1.6.0.conf),
# so it needs no new switch.
# NOT listed: 038-nx-exchange (ticket 113). The exchange (round 2: in-game @nx, confirm step, fees, reversal) stays
# off for live: no -Dslums.exchange in UNIT_EDITS (owner 2026-10-28), and its migration is not to go to live until the
# owner OKs the exchange. It is on on TEST only (start-test.sh).
# NOT listed either: 044-exchange-tickers (ticket 113 tickers: LEAF/CHAOS/WS/ELIXIR books; ticker columns, wider asset
# columns). Needs 038 first and goes with it, on the owner's go for the exchange.
# 040 Player invites (ticket 105, owner 2026-10-28): invite_codes.created_by_char/self_serve, accounts.invited_by_*.
# @invite needs no switch (always on once the jar and migration are in).
# 041 Family bot juniors (ticket 53, owner 2026-10-28: Family on, all perks, regulars may be your juniors): drops the
# stock foreign keys from family_character.cid / family_entitlement.charid to characters(id) (a bot has no characters
# row), kept in family_041_fks for the rollback, which deletes bot juniors' rows and puts the keys back.
# USE_FAMILY_SYSTEM goes false -> true through SERVER_SET (applied with the jar while the server is down; the
# rollback restores config.yaml). Tuning stays as on live: FAMILY_REP_PER_KILL 4, PER_BOSS_KILL 20, PER_LEVELUP 200.
# Knobs (code defaults, not set): -Dslums.family.botJuniorDailyRep=300, -Dslums.family.bondingMin=6,
# -Dslums.family.botsOff=true turns bot juniors off. Check: auto-QA t-fy-1, !qa run fy-1.
# Maple Island opt-in (ticket 29, owner 2026-10-28): TUTORIAL_ISLAND_PROMPT=true (also the code default; no migration).
# Check: auto-QA t-ti-1, !qa run ti-1. Rollback = set it false.
MIGRATIONS=(039-slums-stamps 040-player-invites 041-family-bot-juniors)
# Live after 1.6.0.
LEDGER_BEFORE="001-preserve-arcane-for-classic-fm,002-classic-fm-return,003-solomapling-bots,004-daily-checkin,005-bot-real-stats,006-bot-yield-caps,007-bot-starter-stash,008-world-bera,009-gm-audit,010-color-prism,011-bot-affinity,012-bot-couples,013-gachapon-machines,014-bot-guilds,015-bot-romance,016-bot-guild-wars,020-economy-trade,021-cosmetics-merchant,022-botmemory-about-index,023-character-lookup-indexes,024-restore-stock-shop-items,025-remove-dead-skill-books,026-dalair-henesys,027-nimble-free-market,028-bot-life-profile,029-bot-bonds,030-bot-memory-kinds,031-social-gate,032-economy-counters,034-site-board-npc,035-trade-ratings,036-invite-codes,037-password-resets"

# Chat-model split (owner-approved 2026-10-28): live switches from GLiNER (:8900) to the trained model in 1.6.1.
# Intent + con go to BOT_DECIDE_URL (:8913), tone to BOT_DECIDE_TONE_URL (:8910); both serve model id "jev-latest"
# (they answer 404 to the default "decide"). Rollback = set BOT_DECIDE_URL back to http://192.168.0.17:8900, blank
# BOT_DECIDE_TONE_URL and set both models back to decide, then restart. Text values are supported by set-release-config.
SERVER_SET=(BOT_DECIDE_URL=http://192.168.0.17:8913 BOT_DECIDE_TONE_URL=http://192.168.0.17:8910
            BOT_DECIDE_MODEL=jev-latest BOT_DECIDE_TONE_MODEL=jev-latest
            USE_FAMILY_SYSTEM=true TUTORIAL_ISLAND_PROMPT=true)
