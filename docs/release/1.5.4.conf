# SlumsMS 1.5.4 release settings, read by tools/release/stage (bash, sourced). Template:
# tools/release/templates/release.conf.example. Server-only hotfix on top of 1.5.3 (branch 154-hog): the mount quest hog takes damage.
# Release build: ServerConstants.SLUMSMS_VERSION is "1.5.4". The client stays 1.5.0 (build 10500): no client publish.
# Manual steps outside this file (WZ data, live config booleans): docs/release/1.5.2-deploy-steps.md.

# No migrations in 1.5.4.
MIGRATIONS=()
# Live after 1.5.3 (none added since 1.5.2).
LEDGER_BEFORE="001-preserve-arcane-for-classic-fm,002-classic-fm-return,003-solomapling-bots,004-daily-checkin,005-bot-real-stats,006-bot-yield-caps,007-bot-starter-stash,008-world-bera,009-gm-audit,010-color-prism,011-bot-affinity,012-bot-couples,013-gachapon-machines,014-bot-guilds,015-bot-romance,016-bot-guild-wars,020-economy-trade,021-cosmetics-merchant,022-botmemory-about-index,023-character-lookup-indexes,024-restore-stock-shop-items,025-remove-dead-skill-books,026-dalair-henesys"

# Owner 2026-10-25: GM level 4 for trade, storage, Duey and drop (numeric, enforced here). USE_DUEY true is a boolean
# (set-release-config takes numeric keys only): written into live's config.yaml by hand at the deploy if live sets it
# false (deploy-steps). No GODLY_* keys: the 1.5.2 defaults apply (strict config would abort an old jar on rollback).
CHANNELS=5
CHANNEL_LOAD=125
SERVER_SET=(BOT_ROSTER_PEAK_ONLINE=3000 BOT_POPULATION_PEAK=3500 BOT_MAP_CAP=50
            BOT_ROSTER_VETERAN_FILL_BELOW=0.5 BOT_ROSTER_VETERANS_PER_DAY=300
            MINIMUM_GM_LEVEL_TO_TRADE=4 MINIMUM_GM_LEVEL_TO_USE_STORAGE=4 MINIMUM_GM_LEVEL_TO_USE_DUEY=4
            MINIMUM_GM_LEVEL_TO_DROP=4)
CONFIG_APPEND=""
CONFIG_HEAD=""
CONFIG_HEAD_BEFORE=""

MIN_CLIENT_BUILD=10500
UNIT_EDITS=()
PRECHECK_SQL=()
# Nav cache v69 is already on live since 1.5.2.
NAV_CACHE_SRC=""
CASHSHOP_CATALOG=cashshop/catalog.tsv
EXPECT_LOG=("SoloMapling initialized")
FORBID_LOG=("failed to load" "Starting world 0")
SMOKE_SECONDS=30
IN_GAME_CHECK="In game: hit the Tamable Hog (mount quest, 922200000): each swing takes about 10% of its HP even when it shows MISS, and it stops at 1 HP."
MAINT_MINUTES=3
MAINT_REASON="1.5.4: the mount quest hog can be hit"
