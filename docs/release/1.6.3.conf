            USE_FAMILY_SYSTEM=true TUTORIAL_ISLAND_PROMPT=true
            BOT_REBIRTH_ENABLED=true BOT_REBIRTH_PER_DAY=2
            DAMAGE_RANK_ENABLED=true
            DAMAGE_RANK_MIN_BUILD=10640
            OWNED_ALTS_SUMMON_ENABLED=true
            COMPANION_ORDERS_ENABLED=true
            COMPANION_TRADES_ENABLED=true
            COMPANION_UPGRADES_ENABLED=true
            COMPANION_SUPPLIES_ENABLED=true
