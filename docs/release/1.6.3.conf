#                           world-hour; no extra flags (s-botnx).
# Still owner-decided at go/no-go: -Dsolomapling.convo.planner (m02, after its t-pl-1 proof) and -Dslums.exchange.desk
# (s44, after its TEST proof). Both are written ON below; drop the flag (and, for the desk, the migration stays
# harmless) if the proof failed.
#
# WHAT 1.6.3 ADDS OVER 1.6.2 (code is in the jar; this file only switches and migrates it):
# 058 NX house desk (ticket 162 / s44, s-nxdesk, s-nxdesk2): exchange_desk, one row of JSON holding the desk's rate R,
# the day's first R, the last hourly step, 168 hours of quotes/volume and the last 200 fills. The money itself is two
# ordinary exchange_escrow buckets (kind HOUSE, owner -100) with exchange_ledger rows, so Exchange.reconcile checks it
# like any other balance. Additive, no other table touched, idempotent (ledger id '058-nx-desk'); an older jar ignores
# the table. With -Dslums.exchange.desk off nothing reads it and the exchange is 1.6.2's order book. WITHOUT the
# migration and WITH the switch on, the exchange halts at boot rather than trade on an unknown rate. Rollback drops the
# table; never roll it back while the desk's escrow buckets are non-zero (drain the desk first, see the deploy steps).
# Never roll back 038/044 while any escrow or payout is non-zero (unchanged from 1.6.2).
# Everything else in MIGRATIONS is 1.6.2's list, replayed here only because LEDGER_BEFORE pins what live must already
# show; stage applies the whole list, so a live ledger that is short of one of them is repaired rather than ignored.
# The desk's switch-on story and its checks: docs/tickets/162-nx-forex.md, s-nxdesk REPORT "Test-tab row"; !exchange
# status (0 mismatches), !exchange desk, @nx at the desk; a desk fill in exchange_ledger with kind HOUSE/owner -100.
# Bot NX at the desk (s-botnx, owner 2026-11-01 ~22:55): -Dslums.exchange.traders.nx=true -Dslums.exchange.traders.nx.worldHour=5000 lets a trader bot take 35%
# of its turns at the desk instead of the book, whole lots (min 1,000 NX), only when its limit already reaches the
# quote. Caps are code defaults: slums.exchange.traders.nx.perBotHour=2000, .worldHour=20000 (memory only; a restart
# forgives the hour on purpose). b260 (a bot's NX purse is never swept into a wallet row) rides with the same jar.
# Off = 1.6.2 exactly: no desk turn, NX stays on the book when the desk is absent.
# Companion lanes (s-lanes, s-lanes2, ticket: alt gear/pet follow-ups): -Dslums.alts.lanes=true. "lanes" gives each
# companion a screen of its own, extras across the map only when they do not fit (reach auto = screen first). The
# distance gate relaxes only for companions on their own lane. Off = 1.6.2 (they stack next to you). Check: !qa al-* /
# the owner's party-chat test in 1.6.3-night-server-steps.md N5.
# Planned reply (m02, s-llmcache/s-plwindow/s-cv13): decides a bot's move before it
# words it (greeting, level talk, party/PQ answers, a bot starting the odd chat, one bot-started chat per player per
# hour). Off = free chat as in 1.6.2. Checks: auto-QA t-pl-1 (replies since this boot only), !qa cv-13.
# Fads (b267, s-fadslock): Fads.step() reads the world outside the Fads monitor, so a login can no longer freeze the
# server on the 1.6.0.4/1.6.2 stopgap's lock order. 1.6.2 shipped -Dsolomapling.fads=false; 1.6.3 drops that line.
# Checks: auto-QA t-lk-1 (and t-af-1 for fads' own behaviour), no visual change.
# Bot database pool and caps (b269, b273, s-dbpool, s-dbpool2, s-popcap, s-rosterread, s-bootloads):
#   - the bots' share of the pool is a hard cap (6 of 10 connections) with no uncounted fallback, bot logins and the
#     hourly save run on eight bot-db platform threads, and a refused bot write/departure is kept instead of dropped;
#   - the population cap is enforced (it only lowered the director's target in 1.6.2: TEST reached 4,562 on a 3,500 cap);
#   - the boot fill is paced (BOT_DIRECTOR_BOOT_FILL_PER_SECOND below);
#   - the roster and bot-store snapshot reads use their own connections (ticket 174) so a silent database cannot hold
#     LOAD_LOCK.
#   Watch on the night: the one-line-a-minute gate line "Bot database work found no room in the bots' share of the pool
#   (N connections, M free) and was refused; K times so far this run" should stay at 0 refusals, and
#   "Connection is not available" must not appear. If either shows up in normal play, reduce the load; do not raise the
#   pool. DB_CONNECTION_TIMEOUT_MS is left at its code default (30000); s-dbpool2 recommends 30 s, the field's own
#   comment still recommends 10 s for live (a 10 s pool timeout turned busy boot-fill waits into refusals). Owner picks
#   if it should be pinned at all: SERVER_SET DB_CONNECTION_TIMEOUT_MS=30000 changes nothing, =10000 makes a wedged pool
#   fail loudly. Recommendation here: leave it unset for 1.6.3 and watch the gate line.
# The 1.6.2 switches and data files below are unchanged and stay in place: achievements, bot talk + crews, the report
# file, the exchange and its five tickers (startHalted, so staff run "!exchange resume" after "!exchange status"),
# houseAccount=15, trader bots at 35%, bot quests, the Temple, mechanics + the KPQ lobby, the gear/grind/junk/scroll
# switches, AP variants, party support, fame requests, Magic Guard, job errands, skill books, Maker batching, the nav
# port's swimWallJump/blockedPosWatchdog, map routing, kill calibration, bot inspect.
# Carried over untouched from 1.6.2.conf (read that file for the full reasoning): 038/044 exchange + tickers and their
# hard NX window (NxGuard 2,500,000..10,000,000 mesos per 1,000 NX), 039/052 Slums Stamps, 040 invites, 041/053+r
# Family bot juniors and buffs (USE_FAMILY_SYSTEM already true), 042/046/048/049/051 custom NPCs and penguins (host-WZ
# steps in 1.6.2-deploy-steps.md sections 1-3: DONE on live with 1.6.2, nothing to repeat), 043 achievements, 045 newer
# area cards, 047/056/057 mob kills, 050/055 post-Big-Bang and boss drops (with soloMapling/mob-stat-overrides.tsv and
# AreaGates), 054 starter chair repair, anchor "Failed to load"/world-0 forbids.
MIGRATIONS=(058-nx-desk)
