# -Dbot.nav.zmassWalls (on later after a TEST stuck-count baseline).
# HOW THE TWO UNIT_EDITS WORK (read before editing):
#   1. "s# -Dsolomapling.fads=false##g" deletes the 1.6.2 stopgap flag, wherever 1.6.2 put it (and however many times
#      a re-staged 1.6.2 left it). This is the one flag 1.6.3 removes, so an entry of its own is the only way to take it
#      out: the pre-check aborts with "changes nothing" if live's unit no longer has it, which is the signal to look
#      before staging (someone edited the unit by hand).
#   2. "s# -jar # <flags> -jar #" re-issues the whole 1.6.2 flag block with the four 1.6.3 flags appended, exactly as
#      1.6.1 and 1.6.2 did to their predecessors. It is self-healing (a flag dropped from live's unit comes back) and
#      it is safe to repeat, but read the consequence: live's unit already holds 1.6.2's copy of these flags, so the
#      ExecStart line ends up carrying each flag twice, with identical values. The JVM takes the last -D for a key, so
#      behaviour is unchanged, and the page shows the duplicates in the deploy pre-check output.
#      Cleaner alternative if Server Dev wants it: collapse the unit's -D run to one block with
#      "s#\\( -D[^ ]*\\)* -jar # -jar #" as a FIRST entry and then re-issue the block (that also needs the 1.6.0 auth
#      and export flags added to the list above, which is why it is NOT in this draft: the strip deletes every -D it
#      did not know). Do it as its own reviewed change with a rehearsal, never on release night.
#   3. The EnvironmentFile entry 1.6.2 carried ("/^\\[Service\\]/a EnvironmentFile=/etc/slumsms/cloud-llm.env") is
#      deliberately NOT repeated: live has that line since 1.6.2, and a second one would be a duplicate. The rehearsal
#      checks the staged unit still carries it (1.6.3-deploy-steps.md, "Rehearsal checks").
# FREEZE 2026-11-02 04:02 UTC: m02 planner held OFF (t-pl-1 SKIP: no planned replies yet on the candidate; cv-13 not re-run after round 3). Turn on later config-only with the owner's go once proven.
UNIT_EDITS=("s# -Dsolomapling.fads=false##g" "s# -jar # -Dslums.achievements=true -Dslums.bottalk=true -Dslums.crews=true -Dsolomapling.reportsFile=/var/lib/slums-feedback/reports.jsonl -Dslums.exchange=true -Dslums.exchange.tickers=NX,LEAF,CHAOS,WS,ELIXIR -Dslums.exchange.startHalted=true -Dslums.exchange.houseAccount=15 -Dslums.exchange.traders=true -Dslums.exchange.traders.pct=35 -Dslums.botquests.enabled=true -Dslums.temple.enabled=true -Dslums.mechanics=true -Dslums.mechanics.lobby=true -Dslums.gear.optimizer=pareto -Dslums.gear.dexless=true -Dslums.grind.gearFirst=true -Dslums.junk.sort=true -Dslums.scroll.ev=true -Dslums.bots.apvariants=true -Dslums.bots.apvariants.fromSlot=auto -Dslums.bots.partysupport=true -Dslums.bots.famerequest=true -Dslums.bots.magicguard=true -Dsolomapling.jobErrand=true -Dsolomapling.botSkillBooks=true -Dsolomapling.economy.maker.botBatch=true -Dbot.nav.swimWallJump=true -Dbot.nav.blockedPosWatchdog=true -Dslums.navTrace=true -Dslums.killcalib=true -Dslums.inspect=true -Dslums.inspect.port=8098 -Dslums.inspect.secretFile=/etc/slums-inspect/secret -Dslums.maps.routing=true -Dslums.alts.lanes=true -Dslums.exchange.desk=true -Dslums.exchange.traders.nx=true -Dslums.exchange.traders.nx.worldHour=5000 -jar #")
