#   BOT_POPULATION_PEAK      the hard ceiling on bots in the world, environment bots included (enforced since b273)
#   BOT_DIRECTOR_BOOT_FILL_PER_SECOND  logins a second during a boot fill: 2/s fills 3,000 in ~25 min; the code default
#                            is 8 (about 6 min) and 0 means no rate limit (1.6.2's behaviour, 3,000 at once)
# Live runs 1200/1600 until this release (owner 2026-11-01 ~02:39 UTC). Raising back to 3000/3500 is conditional on
# b273's TEST boot at full population: if that proof is not green by go/no-go, keep 1200/1600 and the pace with it.
