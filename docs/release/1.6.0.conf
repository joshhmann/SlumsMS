# SlumsMS 1.6.0 release settings, read by tools/release/stage (bash, sourced). Template:
# tools/release/templates/release.conf.example. Feature release on top of 1.5.6 (or 1.5.5 if 1.5.6 is skipped: the
# melee guard 999fe5cac is in release-1.6.0 either way): the bot social life (S1-S9), world events, Track D market
# export, @weblogin, the loot fix, 4-byte HP/MP.
# Release build: ServerConstants.SLUMSMS_VERSION is "1.6.0". The CLIENT ships too (client-1.6.0-rc1, build 10600:
# 4-byte HP/MP needs it), so MIN_CLIENT_BUILD goes to 10600 and older clients are told to update. Client publish is a
# separate step (tools/release/stage-client with slums-build.txt, MapleTV.img and login.img): docs/roadmap/1.6.0-plan.md.
# Manual steps outside this file: docs/release/1.5.2-deploy-steps.md (USE_DUEY etc. stay as on live).
#
# Owner decisions are in (2026-10-26).
#
# Custom NPCs (owner 2026-10-26): USE_ENABLE_CUSTOM_NPC_SCRIPT goes false -> true through SERVER_SET below
# (set-release-config handles booleans since 1.6.0), applied with the jar while the server is down; the rollback
# restores config.yaml from the backup, so an older jar never runs with it on (older jars have the uncapped merge).

# 027 Nimble FM, 028 bot life profile (Bartle point), 029 bonds, 030 memory kinds, 031 social gate (@quiet, ledger),
# 032 economy counters (the day's Track D totals survive a restart), 034 the site Buy/Sell board NPC at the FM
# entrance (033 unused), 035 trade ratings (the site's traders board), 036 invite codes, 037 password resets.
MIGRATIONS=(027-nimble-free-market 028-bot-life-profile 029-bot-bonds 030-bot-memory-kinds 031-social-gate 032-economy-counters 034-site-board-npc 035-trade-ratings 036-invite-codes 037-password-resets)
# Live after 1.5.5/1.5.6 (none added since 1.5.2).
LEDGER_BEFORE="001-preserve-arcane-for-classic-fm,002-classic-fm-return,003-solomapling-bots,004-daily-checkin,005-bot-real-stats,006-bot-yield-caps,007-bot-starter-stash,008-world-bera,009-gm-audit,010-color-prism,011-bot-affinity,012-bot-couples,013-gachapon-machines,014-bot-guilds,015-bot-romance,016-bot-guild-wars,020-economy-trade,021-cosmetics-merchant,022-botmemory-about-index,023-character-lookup-indexes,024-restore-stock-shop-items,025-remove-dead-skill-books,026-dalair-henesys"

# Same server settings as 1.5.6 (owner 2026-10-25: GM level 4 for trade, storage, Duey and drop).
CHANNELS=5
CHANNEL_LOAD=125
SERVER_SET=(BOT_ROSTER_PEAK_ONLINE=3000 BOT_POPULATION_PEAK=3500 BOT_MAP_CAP=50
            BOT_ROSTER_VETERAN_FILL_BELOW=0.5 BOT_ROSTER_VETERANS_PER_DAY=300
            MINIMUM_GM_LEVEL_TO_TRADE=4 MINIMUM_GM_LEVEL_TO_USE_STORAGE=4 MINIMUM_GM_LEVEL_TO_USE_DUEY=4
            MINIMUM_GM_LEVEL_TO_DROP=4
            AUTO_REGISTER_MAX_ACCOUNTS_PER_IP=0 AUTO_REGISTER_IP_COOLDOWN_MINUTES=1
            USE_ENABLE_CUSTOM_NPC_SCRIPT=true AUTOMATIC_REGISTER=false
            BOT_TOWN_DRESSING_SCALE=0.25 BOT_LIFE_TOWN_WEIGHTS=near:55,home:20,henesys:25 BOT_TOWN_PULL=0.3
            BOT_TOWN_MAP_MAX=200 BOT_TOWN_SHARE_MAX=0.45 BOT_TOWN_PULL_PER_MIN=3 BOT_TOWN_PLAYER_BOOST=1.5
            OWNED_ALTS_ENABLED=true)
# Busy towns (owner 2026-10-27: "let playerbots naturally come and go"; ship ON with 1.6.0 after the owner's peak
# walk on TEST). In SERVER_SET above; every one is a plain config knob, rollback = remove them and restart:
#   BOT_TOWN_DRESSING_SCALE=0.25            # Henesys town dressing (HenesysBots, fillers, pet park) at a quarter
#   BOT_LIFE_TOWN_WEIGHTS=near:55,home:20,henesys:25   # hang out near the grind, at home, or in Henesys
#   BOT_TOWN_PULL=0.3                       # towns below their busyness target pull free bots (0 = off, shipped)
#   BOT_TOWN_MAP_MAX=200                    # town map cap while the pull is on (a real client held 620 on one map)
#   BOT_TOWN_SHARE_MAX=0.45 BOT_TOWN_PULL_PER_MIN=3 BOT_TOWN_PLAYER_BOOST=1.5
#   BOT_TOWN_CHANNEL_WEIGHTS=1:1.0,2:0.7,3:0.5,4:0.4,5:0.4 and WORLD_EVENT_MAP_MAX=200 are the code defaults (not set)
#   (BOT_TOWN_BUSY_TARGET blank = the built-in table per weight-1.0 channel at peak, a town's whole map family:
#    Henesys 63, Ludibrium 40, Kerning/Ellinia 35, Perion/Orbis/El Nath 30, Leafre 25, Sleepywood/Lith/Mu Lung 20,
#    Nautilus/Aquarium/Ariant/Magatia/Omega 15, Free Market entrance + 22 rooms 100 counting its staff)
# Owner 2026-10-26: any number of accounts per IP (was 3, with 10 min between new accounts). Accounts are invite-only
# from 1.6.0 (ticket 105): the login screen stops creating them (AUTOMATIC_REGISTER=false); sign-up goes through the
# site and launcher.
CONFIG_APPEND=""
CONFIG_HEAD=""
CONFIG_HEAD_BEFORE=""

# The first client build with 4-byte HP/MP (client-1.6.0-rc1). Publish the client BEFORE the server goes up.
MIN_CLIENT_BUILD=10600

# JVM switches on the live unit (the check refuses an edit that changes nothing):
# - Market export for the website (Track D, owner: the Market is private until 1.6.0, so it goes on now).
# - World events default ON in code (-Dsolomapling.events); owner 2026-10-26: they stay on live.
# - @weblogin is dropped (owner 2026-10-26). The site's auth API (tickets 105, 107) runs on 127.0.0.1:8186 with the
#   secret the owner creates first (/etc/slums-auth/secret, group slums-login 0640; LAUNCH.md step 2) and the login
#   service's revoked list. Without the secret file the API stays off and the log says why; the game is unaffected.
# - Site export (feed, leaderboards, live world) for the website launching with 1.6.0.
# - Site board + price alerts (-Dslums.board, inbox/outbox default /var/lib/slums-market/{inbox,outbox}): needs the
#   site's LAUNCH.md step 2b (user/group slums-market, the 2750 outbox folder) done BEFORE this deploy.
# - Staff dashboard snapshots (ticket 108, owner 2026-10-26): live.json, the day's series and daily rollups every 60 s
#   into /srv/slums-dashboard/data, served LAN-only with basic auth by tools/ops/install-live-dashboard (owner-run,
#   docs/release/1.6.0-deploy-steps.md item 2). Off the game thread, about 10 ms a run at 2,250 bots on TEST.
# - The regulars' brain (the 1.6.0 headline; on TEST since rc1) and the new fishing (any chair fishes on a fishing
#   map), owner 2026-10-27. The busy-town settings above act only through the brain. Companions (@botme alts, up to 5):
#   OWNED_ALTS_ENABLED in SERVER_SET. All three found off for live by the patch-notes check on 2026-10-27.
# - Chat-model shadow (owner 2026-10-27): OneJev answers beside today's model and is only logged, never used. On live
#   the rows keep scores and the line's length, never the chat text (ticket 108: chat statistics only). The switch
#   is a 1.6.1 call on these numbers (!decideshadow status).
UNIT_EDITS=("s# -jar # -Dslums.market.export=true -Dslums.site.export=true -Dslums.board=true -Dslums.auth.port=8186 -Dslums.auth.secretFile=/etc/slums-auth/secret -Dslums.auth.revoked=/var/lib/slums-login/revoked.txt -jar #"
            "s# -jar # -Dsolomapling.dashboard=true -Dsolomapling.dashboard.dir=/srv/slums-dashboard/data -Dsolomapling.dashboard.periodSeconds=60 -jar #"
            "s# -jar # -Dslums.decide.shadow=onejev -Dslums.decide.shadow.text=false -jar #"
            "s# -jar # -Dslums.botlife.enabled=true -Dslums.botlife.execute=true -Dslums.fishing.enabled=true -Dslums.fishing.rewards=true -jar #")
PRECHECK_SQL=()
NAV_CACHE_SRC=""
CASHSHOP_CATALOG=cashshop/catalog.tsv
EXPECT_LOG=("SoloMapling initialized")
FORBID_LOG=("failed to load" "Starting world 0")
SMOKE_SECONDS=30
IN_GAME_CHECK="In game on the 1.6.0 client: HP/MP and the build stamp show; friend bots greet and chat; an 8 PM PT event can be started with the GM menu; Dawn Warrior, Aran and gun bots in town never close your client."
MAINT_MINUTES=5
MAINT_REASON="1.6.0: bots get a social life, world events, and a new client"
