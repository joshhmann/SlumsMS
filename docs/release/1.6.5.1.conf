# SlumsMS 1.6.5.1 release settings (hotfix on 1.6.5), read by tools/release/stage. Shape copied from 1.6.5.conf.
#
# Server Dev, 2026-11-08 ~04:4x UTC, on the Coordinator's plan after the owner asked for the Horntail fix with both parts:
