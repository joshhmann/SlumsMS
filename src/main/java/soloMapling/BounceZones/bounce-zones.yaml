# Where MapleRoot's universal bounces are blocked: Ninja Bounce 1050/10001050/20001050 ("Jump Around!")
# and Vertical Bounce 1054/10001054/20001054 ("Jump Upwards!"). Read by server.bounce.BounceZones
# (resolved through soloMapling.DataFiles). The server sends the effective blocked set to each player's
# client at login (LP BOUNCE_ZONES_SYNC 0x3737); `!bounce reload` re-reads this file and pushes it again.
#
# Each category: description, enabled (true/false), block_flash_jump (also refuse the thieves' real Flash
# Jump 4111006/14101004 there), maps. A map entry is one of:
#   280020000              a single map id
#   280020000-280020001    an inclusive id range
#   2800xxxxx              a region: a 9-character id whose trailing x's match any digit
# A map blocked by any enabled category is blocked. Map ids that do not exist are harmless.
#
# The jump_quests list is also built into slums.dll (src/bounce_zones_builtin.inc, made by
# tools/bounce/gen_client_zones.py) for the moment before the login packet arrives. After editing
# jump_quests run that script and update both golden packets (BounceZonePacketsTest / bounce_rules_test).
#
# Lists compiled 2026-10-21 from the server WZ export (String.wz names, Map.wz info/life/portal nodes) and
# scripts/event, scripts/npc, scripts/portal; each group's source is in its comment.
categories:
  - name: jump_quests
    description: "Jump quests: Pet-Walking Roads, Forest of Patience, Deep Forest of Patience, Kerning subway B1-B3, Breath of Lava, Toy Factory, Puppeteer, Ola Ola, Physical Fitness, Witch Tower, Rescue Gaga and the custom Yoshi/Donkey Kong JQs. Flash Jump is blocked too: stock v83 Map.wz sets fieldLimit 0x02 (movement skills) on every vanilla stage here."
