# Gachapon pools (SlumsMS 1.5.0). The owner's data: what each town's machine gives and how often.
#
# A roll picks a TIER by its weight, then one ITEM of that tier from the town's list plus the shared list,
# by the item's weight (default 1). A tier a machine has nothing in is skipped (its weight goes to the others).
#
# Item entry: "<item id>[ x<quantity>][ w<weight>]", e.g. "2000004 x10" (10 Elixirs) or "2049100 w40".
# The comment after an entry is its WZ name, for people; the server ignores it.
#
# Check the file and print the odds before you ship a change:
#   python3 tools/gachapon/gachapon_pools.py validate      (every id against the WZ; exit 1 on an error)
#   python3 tools/gachapon/gachapon_pools.py odds henesys  (per-tier and per-item odds; --markdown for notes)
# In game: @gacha <town> lists a machine, !gachasim <town> <n> rolls n times without giving anything.
#
# Seeded from the v83 town lists (HeavenMS server/gachapon) and MapleRoot's chair machine, cleaned up:
# no GM scrolls, boss summoning sacks, return scrolls, pet-equip scrolls, expiring items, quest items,
# untradeable post-v83 scrolls, beginner (lv 10 and under) equips, or ids whose name and data disagree.

tiers:
  common:
    weight: 7000
  uncommon:
    weight: 2450
  rare:
    weight: 500
    announce: true
  jackpot:
    weight: 50
    announce: true

