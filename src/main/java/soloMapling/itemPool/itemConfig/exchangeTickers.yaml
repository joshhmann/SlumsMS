# Slums Exchange ticker catalog (ticket 270).
#
# Read at startup by soloMapling.Economy.exchange.ExchangeCatalog; a row registers an asset and offers a
# ticker template. Which of them trade is -Dslums.exchange.catalog=scrolls,use,etc plus
# -Dslums.exchange.tickers (unset = every open category). Caps come from the row; a row that leaves them
# out takes its category's: scrolls 1 / 3 open / 10 a day (owner 2026-11-03), use and ETC 1,000-10,000 /
# 10 open / 20 a day. A row whose anchor is 0 is registered but not quoted: players can still place orders,
# which is how a dark ticker finds its price.
#
# anchor = mesos per item. Sources, in order: the item pool at version <= 55 (incl. darkscrolls.yaml,
# version 39), else the 7-day board average when >= 1,000, else the median of the same slot and success
# band, else the same slot scaled, else that band's default. See docs/tickets/270-exchange-item-catalog.md.

