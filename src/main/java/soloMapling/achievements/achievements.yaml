# Achievements and medals (SlumsMS 1.6.1, ticket 93). Read once at server start (restart to apply an edit; no rebuild).
#
# Strict: any unknown key, duplicate id or medal, bad number, or a medal that is not an item in the server's data
# rejects the whole file (the server logs an error and runs with no achievements until it is fixed).
# Each goal is one-time per character and awards one cosmetic medal (a zero-stat copy of the v83 item: no stats,
# no set bonus). Every medal below exists in the server's Character.wz and in the client's Data (checked with
# tools/clientcheck, 2026-10-28). The comment after each medal id is the item's name.
#
# trigger / what counts (progress is stored per character, bots included):
#   job        target = job tier reached (1..4); Evan counts as one line
#   level      target = level reached
#   level_cap  reaching the class's real maximum level (Character.getMaxLevel)
#   mob_kill   mobs: [ids] the credited killer of one of them
#   clear      scripts: [event script names] a cleared PQ or boss instance (everyone inside); name before the first _
#   fish       target = kept fishing catches
#   guild      joining or founding a guild      wedding  getting married      rebirth  a rebirth
#   quest      target = completed quests        trade    target = completed trades with another character
#   market     target = purchases from player shops and hired merchants (bots' deals included)
#   checkin    target = the Daily Check-In day claimed (players only; the cycle is 28 days)
#   visit      maps: [ids] every listed map visited once
