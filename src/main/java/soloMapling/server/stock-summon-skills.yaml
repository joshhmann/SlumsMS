# Stock v83 summon durations and cooldowns (1.5.1, owner: "stock is fine for summons").
#
# MapleRoot's server Skill.wz gives most summons a 20 s duration and a 60 s cooldown at every level, and stretches
# Beholder, Octopus and the Blaze Wizard Ifrit to 3600 s. The server's wz folder is not shipped by deploys, so
# server.StockSummonSkills puts the stock values back when StatEffect loads a skill level: every skill below gets
# exactly these "time" (seconds) and "cooltime" (seconds, 0 = none) values, index 0 = level 1. Anything else in the
# skill's data (damage, mad, mob count, item cost) still comes from the server wz.
#
# Values: Cosmic's stock v83 wz (wz/Skill.wz, Cosmic commit fec53bc77). Skills whose time and cooltime already match
# stock on MapleRoot (Wind Archer Puppet 13111004, Wrath of the Octopi 5220002) are not listed.
