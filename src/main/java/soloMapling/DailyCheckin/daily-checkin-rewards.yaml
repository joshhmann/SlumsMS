# Daily Check-In reward table (SlumsMS ticket 17).
#
# Read once at server start (restart to apply an edit; no rebuild). Must list days 1..28 in order. Any mistake
# (unknown key, bad number, item id not in the server's data) rejects the whole file: the server then logs an error
# and uses the built-in table in server/checkin/DailyCheckinRewards.java, which this file mirrors.
#
# Per day:  day, nx (NX Credit), stamps (Slums Stamps; staff, QA accounts and bots get none), mesos, icon (item drawn in the window; defaults to the first item),
#           slots ("equip 4" | "use 4" | "setup 4" | "etc 8"; capped at 96, slots that do not fit pay 500 NX each),
#           items: id, qty, days (expires that many days after the claim; leave out for permanent).
# Per cycle (1.6.0, owner 2026-10-27): 4,000 NX (1,000 on days 7, 14, 21, 28; the draft gave 89,000), +20 slots (+4 Equip, +4 Use, +4 Set-up, +8 Etc).
# 1.6.1 (ticket 111): 1 Slums Stamp every day, 6 on days 7, 14, 21 and 28: 48 a cycle.
