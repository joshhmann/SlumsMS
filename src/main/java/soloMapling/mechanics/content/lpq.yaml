        cleanup: true
    objectives:
      - id: rooms
        kind: COLLECT
        role: all
        item: 4001022
        count: 6
        note: 922010401-405, one room per member (portals in01..in05); the map itself is empty
      - id: give-pass
        kind: GIVE_TO_LEADER
        role: collector
        item: 4001022
        count: 1
      - id: hand-passes
        kind: HAND_IN
        role: leader
