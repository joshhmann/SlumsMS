# Ticket 164 Orbis PQ stage data (the tower of Orbis, "save Minerva"): the stages our bots can drive end to end.
# Format: docs/tickets/130-bots-play-mechanics.md, "Stage data format". Loaded by soloMapling.mechanics.StageData.
#
# The row is gated on its OWN switch (-Dslums.mechanics.opq=true as well as -Dslums.mechanics=true), so the Kerning
# PQ lanes are untouched: see Mechanics.OPQ_FLAG and Mechanics.enabledFor(Content). It is asked for by
# docs/tickets/164-pq-polish.md and REPORT.md in this ticket folder lists the stages left out and why.
#
# The server's own scripts are the truth, and every step below is checked against them:
#   scripts/event/OrbisPQ.js (statusStg0..8 = -1 at start) and scripts/npc/2013001.js (Eak) / scripts/reactor/*.js.
id: opq
name: Orbis Party Quest
kind: PQ
eventScript: OrbisPQ
# the NPC a bot leader accepts the quest from (KpqStaging/OpqLobby talk to it, never press the button)
entryNpc: 2013000
recruitMap: 200080101
# Where a member is sent when a run WE end ends, not the script's own exit: OrbisPQ.js:30 sends the party to 920011200
# itself, so a run we end early puts the member back at Wonky's lobby where the party formed.
exitMap: 200080101
# The script's own gate, copied from it and never from upstream: OrbisPQ.js:27 minPlayers = 5 / maxPlayers = 6,
# :28 minLevel = 51 / maxLevel = 255, :37 eventTime = 45 (minutes). cosmic_agents' AgentOpqDefinition says 51-70 and a
# six-member party; its level cap is a foreign constant and was wrong here. The gate that decides whether an instance
# opens is the script's own getEligibleParty (OrbisPQ.js:104-112: a leader plus 5-6 members standing on the recruit map
# inside the level band), which startInstance refuses on - our 3 was letting a party of three look like a full one.
minPlayers: 5
maxPlayers: 6
minLevel: 51
maxLevel: 255
timeLimitMinutes: 45
flag: slums.mechanics.opq
sources:
  - "scripts/event/OrbisPQ.js, scripts/npc/2013001.js, scripts/reactor/2006000.js, scripts/reactor/2006001.js: ours, the truth"
  - "Gates: our script only (OrbisPQ.js:27,28,37). cosmic_agents Kiwiism/cosmic_agents 3c7e09435 AgentOpqDefinition
    gave the map, item and monster ids this row uses, and its MIN_LEVEL 51 / MAX_LEVEL 70 / PARTY_SIZE 6 are NOT copied:
    its gate is its own fork's, and a port takes structure, never gates"
  - "Map ids, item ids, monster ids and the room exit portals: cosmic_agents AgentOpqDefinition (AGPL-3.0); the portal ids there are WZ portal ids, so this row warps stage to stage instead of naming portals"
  - "Stage order: entrance, walkway, storage, lobby, sealed room, lounge, levers, statue and garden (our script's stage numbers 0, 1, 2, 3, 4, 5, 6, 7+8). The statue and the garden are one stage here because only the second half has a property to watch (the scars are counted with getReactorByName(\"scar\" + i).getState(), scripts/npc/2013001.js:11-19, while statusStg8 is what scripts/reactor/2006001.js writes)"
  - "The lobby's day comes from the music reactor's own armed slot (scripts/event/OrbisPQ.js:162-163 setEventState(new Date().getDay()), Reactor.getReactItem(byte) reads it as a slot), so 4001056 + that is the pass; the three platforms of the sealed room are the map's own area nodes (MapFactory.java:273-279), not a table here"
# Difficulty tiers (1.7.0 "PQ difficulties"): NORMAL is the stock PQ and needs no entry - it is the gates above,
# and a tier never moves them. HARD is transcribed verbatim from the proposal table in DIFFICULTY-CHAOS-PLAN.md
# section 9 (lines ~797-908), which is stamped "proposal only, nothing merged, owner may overwrite any cell":
# every number below is that table's OPQ HARD row, none of it invented here. EXPERT and MASTER are in the
# same table and are deliberately NOT copied into this file: a row only carries the tiers it has been asked for,
# and -Dslums.mechanics.tiers opens only the tiers a row actually names.
# Omitted cells: none - the table's OPQ HARD row fills all seven fields.
tiers:
  HARD:
    minLevel: 71
    maxLevel: 95
    mobLevelBonus: 20
    mobHpMultiplier: 4.0
    mobDamageMultiplier: 1.5
    timeLimitMinutes: 55
    botMistakeFactor: 1.25
stages:
  - stage: 1
    map: 920010000
    name: Clouds for Eak
    npc: 2013001
    solver: opq-clouds
    roles:
      - id: leader
        who: LEADER
        min: 1
        max: 1
        note: carries the twenty cloud pieces and puts them on the altar, then talks to Eak
      - id: sweeper
        who: NON_LEADER
        min: party-1
        max: party-1
        note: hits the cloud reactors and hands the pieces to the leader
    items:
      - id: 4001063
        name: Cloud Piece
        cleanup: true
    objectives:
      - id: clouds
        kind: HIT_REACTOR
        role: all
        note: the twenty cloud reactors (id 2002001) drop one cloud piece each when hit
      - id: altar
        kind: PLACE_ITEM
        role: leader
        item: 4001063
        count: 20
        reactor: "2006000"
        note: scripts/reactor/2006000.js spawns Eak only for a drop of exactly 20 pieces inside the altar's box
      - id: open
        kind: TALK_NPC
        role: leader
        npc: 2013001
        note: clearStage(0, eim) sets statusStg0 = 1
    clear:
      eventProperty: statusStg0
      equals: "1"
  - stage: 2
    map: 920010200
    name: Statue pieces in the walkway
    npc: 2013001
    solver: kill-collect-hand-in
    mobs: [9300045, 9300046, 9300047]
    roles:
      - id: leader
        who: LEADER
        min: 1
        max: 1
        note: hands 30 pieces to Eak (his npc is on the spawn platform, not the walkway)
      - id: collector
        who: NON_LEADER
        min: party-1
        max: party-1
        note: fights the walkway monsters and drops the pieces by the leader
    items:
      - id: 4001050
        name: Statue Piece
        cleanup: true
    objectives:
      - id: hunt
        kind: KILL_FOR_ITEM
        role: all
        mob: 9300045
        item: 4001050
        count: 30
        note: 30 pieces pooled on the leader, one per monster kill (scripts/npc/2013001.js haveItem(4001050, 30))
      - id: give-pieces
        kind: GIVE_TO_LEADER
        role: collector
        item: 4001050
        count: 1
        note: drop them next to the leader, the leader loots them
      - id: hand-pieces
        kind: HAND_IN
        role: leader
        npc: 2013001
        item: 4001050
        count: 30
        note: Eak takes 30 and clears stage 1 (statusStg1 = 1)
    clear:
      eventProperty: statusStg1
      equals: "1"
  - stage: 3
    map: 920010300
    name: The storage room
    npc: 2013001
    solver: opq-sweep
    items:
      - id: 4001045
        name: Statue Piece
        cleanup: true
    roles:
      - id: leader
        who: LEADER
        min: 1
        max: 1
        note: talks to Eak once nothing is left on the floor
      - id: sweeper
        who: NON_LEADER
        min: party-1
        max: party-1
        note: kills the room and picks up every drop, mesos included
    objectives:
      - id: sweep
        kind: HIT_REACTOR
        role: all
        note: open the room's reward boxes; scripts/npc/2013001.js clears it only with countMonsters() == 0 and countItems() == 0, and countItems() counts mesos too
      - id: empty-floor
        kind: COLLECT
        role: all
        item: 4001045
        count: 1
        note: the solver loots with Loot(0), which means "anything on the floor", so nothing is left behind for the clear
      - id: open
        kind: TALK_NPC
        role: leader
        npc: 2013001
        note: clearStage(2, eim) sets statusStg2 = 1 and gives the second piece
    clear:
      eventProperty: statusStg2
      equals: "1"
  - stage: 4
    map: 920010400
    name: The music player
    npc: 2013001
    solver: opq-lobby
    roles:
      - id: leader
        who: LEADER
        min: 1
        max: 1
        note: talks to Eak once the day's pass sits on the music player, which is what opens the box and clears the stage
      - id: fetcher
        who: NON_LEADER
        min: party-1
        max: party-1
        note: cycles the seven lp boxes until the day's pass drops and loots it
    items:
      - id: 4001056
        name: Sunday's Ludibrium Pass
        cleanup: true
      - id: 4001057
        name: Monday's Ludibrium Pass
        cleanup: true
      - id: 4001058
        name: Tuesday's Ludibrium Pass
        cleanup: true
      - id: 4001059
        name: Wednesday's Ludibrium Pass
        cleanup: true
      - id: 4001060
        name: Thursday's Ludibrium Pass
        cleanup: true
      - id: 4001061
        name: Friday's Ludibrium Pass
        cleanup: true
      - id: 4001062
        name: Saturday's Ludibrium Pass
        cleanup: true
      - id: 4001046
        name: Statue Piece
        cleanup: true
    objectives:
      - id: fetch
        kind: COLLECT
        role: all
        item: 4001056
        count: 1
        note: the day's pass, i.e. 4001056 + the music reactor's event state; the seven boxes named lp (reactor ids 2002004-2002010, act() { rm.dropItems(); }) hold them and which box holds which day is a reactordrops row, so the party cycles all seven
      - id: place
        kind: PLACE_ITEM
        role: all
        item: 4001056
        count: 1
        reactor: music
        note: scripts/reactor/2008006.js sets statusStg3 = 0, and MapleMap.activateItemReactors only arms the reactor for the exact item, quantity 1 and a drop inside its box - a wrong day's pass does nothing at all
      - id: open
        kind: TALK_NPC
        role: leader
        npc: 2013001
        note: at statusStg3 == 0 the talk force-hits stone3 (the third-piece box, 2013001.js:920010400), clears stage 3 and sets statusStg3 = 2
    clear:
      eventProperty: statusStg3
      equals: "2"
  - stage: 5
    map: 920010500
    name: The three platforms
    npc: 2013001
    solver: opq-sealed
    roles:
      - id: leader
        who: LEADER
        min: 1
        max: 1
        note: opens the stage (Eak splits three at random) and talks for the check once the platforms hold the split
      - id: stander
        who: NON_LEADER
        min: party-1
        max: party-1
        note: stands on the platform the split gives it, and stays off the platforms when the split is already full
    items:
      - id: 4001047
        name: Statue Piece
        cleanup: true
    objectives:
      - id: split
        kind: TALK_NPC
        role: leader
        npc: 2013001
        note: the first talk writes stage4_0..stage4_2 (a random split of three) and sets statusStg4 = 0
      - id: platforms
        kind: OCCUPY_POSITION
        role: all
        note: exactly stage4_i players inside area i, read from the map's own area nodes (MapFactory.java:273-279); the party of three is split 1/1/1 and everyone past three stands beside Eak
      - id: check
        kind: TALK_NPC
        role: leader
        npc: 2013001
        note: clearStage(4, eim) sets statusStg4 = 1 and opens the box with the fourth piece
    clear:
      eventProperty: statusStg4
      equals: "1"
  - stage: 6
    map: 920010601
    name: The lounge room
    npc: 2013001
    solver: opq-subroom
    mobs: [9300041, 9300042, 9300043]
    roles:
      - id: leader
        who: LEADER
        min: 1
        max: 1
        note: farms with the others, then warps back to the lounge (920010600) with 40 pieces
      - id: collector
        who: NON_LEADER
        min: party-1
        max: party-1
        note: fights in the side room and drops the pieces by the leader
    items:
      - id: 4001052
        name: Lounge Statue Piece
        cleanup: true
    objectives:
      - id: hunt
        kind: KILL_FOR_ITEM
        role: all
        mob: 9300041
        item: 4001052
        count: 40
        note: the side rooms (920010601-604) hold the monsters; 40 pooled pieces (haveItem(4001052, 40))
      - id: give-pieces
        kind: GIVE_TO_LEADER
        role: collector
        item: 4001052
        count: 1
      - id: hand-pieces
        kind: HAND_IN
        role: leader
        npc: 2013001
        item: 4001052
        count: 40
        note: Eak takes 40 in the lounge itself and clears stage 5 (statusStg5 = 1)
    clear:
      eventProperty: statusStg5
      equals: "1"
  - stage: 7
    map: 920010700
    name: The five levers
    npc: 2013001
    solver: opq-levers
    roles:
      - id: leader
        who: LEADER
        min: 1
        max: 1
        note: opens the stage (Eak picks the combination) and talks for the check
      - id: puller
        who: NON_LEADER
        min: party-1
        max: party-1
        note: pushes its share of the five levers to match stage6_c
    objectives:
      - id: open
        kind: TALK_NPC
        role: leader
        npc: 2013001
        note: the first talk writes stage6_c (five characters, two of them '1') and sets statusStg6 = 0
      - id: levers
        kind: HIT_REACTOR
        role: all
        note: exactly two of the reactors named "1".."5" pushed on, and all five matching stage6_c
      - id: check
        kind: TALK_NPC
        role: leader
        npc: 2013001
        note: clearStage(6, eim) sets statusStg6 = 1 and opens the box with the sixth piece
    clear:
      eventProperty: statusStg6
      equals: "1"

  - stage: 8
    map: 920010100
    name: The statue and the garden
    npc: 2013001
    solver: opq-statue
    roles:
      - id: leader
        who: LEADER
        min: 1
        max: 1
        note: talks to Eak once the six scars are full, which warps the whole team to the garden
      - id: carrier
        who: NON_LEADER
        min: party-1
        max: party-1
        note: carries its share of the six pieces, drops them on the scars, and helps with Papa Pixie
    items:
      - id: 4001044
        name: Statue Piece
        cleanup: true
      - id: 4001045
        name: Statue Piece
        cleanup: true
      - id: 4001046
        name: Statue Piece
        cleanup: true
      - id: 4001047
        name: Statue Piece
        cleanup: true
      - id: 4001048
        name: Statue Piece
        cleanup: true
      - id: 4001049
        name: Statue Piece
        cleanup: true
      - id: 4001055
        name: Root of Life
        cleanup: true
    objectives:
      - id: pieces
        kind: PLACE_ITEM
        role: all
        item: 4001044
        count: 1
        reactor: scar4
        note: one piece on each of the six scars; scar-to-piece pairing is a permutation read from Reactor.wz/2008000-2008005.img.xml
      - id: statue
        kind: TALK_NPC
        role: leader
        npc: 2013001
        note: isStatueComplete() is true only when all six scars report a state above zero; the talk warps the team to 920010800
      - id: pixie
        kind: DEFEAT
        role: all
        mob: 9300039
        item: 4001055
        count: 1
        note: scripts/reactor/2001016.js clears the garden and spawns Papa Pixie; he is the only source of the Root of Life
      - id: base
        kind: PLACE_ITEM
        role: all
        item: 4001055
        count: 1
        reactor: minerva
        note: scripts/reactor/2006001.js spawns Minerva, sets statusStg8 = 1 and calls clearPQ
    clear:
      eventProperty: statusStg8
      equals: "1"
