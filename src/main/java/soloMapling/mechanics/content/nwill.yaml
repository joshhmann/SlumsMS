# Ticket 164: Hard Will (expedition), one room and one spawn (1.6.4).
#
# Read only when the server runs with -Dslums.mechanics.boss=true AND this row's own flag; the run drives the party's
# bots and owned alts, and humans fight as they always did.
#
# A one-part boss is still a boss room: the script sets no property the clear could read, so the row clears on the
# instance's own flag (NWillBattle.js clearPQ -> setEventCleared(ExpeditionType.NWILLSPIDER)), which is exactly what
# the script calls when the mob dies.
#
# The spawn is the script's, not WZ's: setup() schedules spawnMob1 at 5 s (NWillBattle.js:139-140
# `eim.schedule("spawnMob1", spawnTimes[0])` with `spawnTimes = [5000]`), and spawnMob1 calls
# `map.spawnMonsterOnGroundBelow(em.getMonster(9990301), ...)` (:145-150). The room's WZ life is EMPTY (checked
# in Map.wz), so nothing else can stand there. graceMs is 15 s - three times the script's delay - so the solver waits the
# spawn out instead of abandoning: the default is 30 s, and this row says so out loud.
id: nwill
name: Hard Will (expedition)
kind: BOSS
eventScript: NWillBattle
# the NPC that starts the expedition, standing on the recruit map (both checked in Map.wz/Npc.wz)
entryNpc: 3003560
recruitMap: 450007240
# where a member is sent when the run ends (MechanicsRuns.endInstance): the script's own exitMap
exitMap: 450007240
# the script's own gate (NWillBattle.js:29-30): 1-6 players, level 200-255, and the script's eventTime is the
# authority for the clock (NWillBattle.js:39 `eventTime = 120`).
minPlayers: 1
maxPlayers: 6
minLevel: 200
maxLevel: 255
timeLimitMinutes: 120
flag: slums.mechanics.nwill
sources:
  - "scripts/event/NWillBattle.js (ours, the truth): gates :28-39, one room (minMapId == maxMapId == 450007441), the
    5 s spawn at :139-140 and spawnMob1 at :145-150, the clear at clearPQ() -> setEventCleared(ExpeditionType.NWILLSPIDER),
    and monsterKilled's own is-the-boss test (:243-252) which is where the kill becomes the win"
  - "scripts/npc/3003560.js: the expedition starter (:29 getEventManager(\"NWillBattle\"), :152 startInstance(expedition))"
  - "Map.wz Map4/450007441.img.xml: the room's life block is empty, so the boss exists only after the script's spawn;
    Map4/450007240.img.xml places NPC 3003560"
  - "Mob.wz/9990301.img.xml: the mob id the script spawns (the 999xxxx family this server's scripts use for the
    Normal-tier fights)"
stages:
  - stage: 1
    map: 450007441
    name: Hard Will (expedition)
    solver: boss-phases
    # no summonProperty: nothing clicks an altar, the script's own schedule brings the boss in
    killTarget: 9990301
    mobs:
      - 9990301
    # the script's spawn is 5 s after setup; three times that is the abandon window, not the default 30 s
    graceMs: 15000
    objectives:
      - id: boss
        kind: DEFEAT
        mob: 9990301
        note: "one part: the whole fight is this mob. No arms, no body phases - Mob.wz/9990301 has no revive chain."
    clear:
      instance: true
    # no nextPortal: one map, no stage transition
