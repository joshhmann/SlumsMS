  - stage: 5
    map: 103000804
    name: Bosses and passes
    npc: 9020001
    solver: kill-collect-hand-in
    mobs: [9300000, 9300002, 9300003]
    roles:
      - id: leader
        who: LEADER
        min: 1
        max: 1
        note: fights too, collects the passes and hands 10 to Cloto at the top of the map
      - id: collector
        who: NON_LEADER
        min: 0
        max: party-1
        note: fights the stage's monsters, loots their passes and drops them by the leader
    items:
      - id: 4001008
        name: Pass
        cleanup: true
    objectives:
      - id: hunt
        kind: KILL_FOR_ITEM
        role: all
