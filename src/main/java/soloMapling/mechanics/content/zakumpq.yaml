# Ticket 164 Pre-Zakum PQ. Thirty rooms on a hub, walked once. HAND-MAINTAINED (1.6.5 b340): this file once said
# GENERATED, but no generator was ever in the repo and every change since 3 Nov was made by hand. Edit it here, and
# keep the room order and the notes below true.
# b331 (2026-11-06): a chest yields ONE drop, as it does for a
# real party (the bots' old 5th hit on a state no client can hit gave a second drop and crashed clients). The
# big chest wants 7 ores and the maze has exactly 7 ore rocks (2112004 on 280010091/110/140, 280011002/003;
# 2112011 on 280010041 and on 280011005 itself), so the walk now mines all seven before 2112014: the
# 040/041 and 090/091 loops come first, and 280011005 is entered once for its own rock before the big chest.
# A regenerate must keep that order. Known limit (Coordinator, B7): zero margin - an ore a player takes, or ores
# split across two bots' bags, stalls the run at the big chest (the stall guard ends it; no crash, no loss).
# The walk is the row: the maze is a hub (280010000) with fifteen numbered doors and a wing (280011000) behind two of
# them, and every room's doors are published in its own WZ portal block (pt-1 portals; the hub's are in01..in15). So
# each stage is one room and its clear is the map the party walks into next - the solver leaves through whichever door
# on its map leads there (SolverStep.EnterPortalTo), which is why no route is written in Java. The clear is
# botsOnMap, not partyOnMap (1.6.5 b344): a real player in the party roams the mines his own way and the run never
# steers him, so a whole-party clear held stage 1 for ever and the run kept putting a bot that went ahead back on the hub. The hub therefore
# appears once per return, because walking back through it is what the party actually does.
# Chests: reactordrops gives 2112012/2112005 -> 4001015 (the key), 2112004/2112011 -> 4001016 (the ore) and
# 2112014 -> 4001018 (the document), all at chance 1. A chest yields on its fourth and fifth hit and is inert for ever
# after (Reactor.java:246-315), which is why the solver hits until the reactor answers -1 instead of counting.
# The hand-in is the last stage: scripts/npc/2032002.js:71-77 wants 4001018 and :121-127 clears either way - the thirty
# keys only change the message and the reward, and there is no damage, DPS or party-size check anywhere in that file.
# Client maps: all thirty exist in Map.wz (280010000-280010150 step ten, plus 011/031/041/071/081/091/101 and
# 280011000-280011006); tools/ops/map-integrity is clean over every id below.
id: zakumpq
name: Pre-Zakum PQ
kind: PQ
eventScript: ZakumPQ
entryNpc: 2030008
recruitMap: 211042300
exitMap: 280010000
minPlayers: 1
maxPlayers: 6
minLevel: 50
maxLevel: 255
timeLimitMinutes: 30
flag: slums.mechanics.zakumpq
sources:
  - "scripts/event/ZakumPQ.js gates (:26-39) and clearPQ (:253-256); the instance is PreZakum+<lobby> (:115)"
  - "scripts/npc/2030008.js:73 starts it; 2030013.js:96-112 is the expedition variant"
  - "scripts/npc/2032002.js:67-127 is the hand-in: 4001018 required, the thirty keys optional"
  - "the doors are the mine maps' own pt-1 portal blocks; the chest ids and their drops are reactordrops, chance 1"
stages:
  - stage: 1
    map: 280010000
    name: "the hub: Adobis's cave"
    solver: zakum-mines
    hitReactors: [2112012]
    maps:
      - 280010110
    items:
      - id: 4001015
        count: 30
        note: "the key: optional, it only buys the better message and reward (2032002.js:78-95)"
      - id: 4001016
        count: 7
        note: "the ore the big chest eats"
      - id: 4001018
        count: 1
        note: "the document out of 2112014"
    roles:
      - id: miner
        who: ANY
        min: 1
        max: party
    objectives:
      - id: sweep
        kind: WAIT
        role: all
        note: "the chests are hit until they answer -1, then the party walks out"
