# Ticket 130 boss lane, branch 164-bossrows: Oberon (TD Battle 4, 1.6.4).
#
# Read only when the server runs with -Dslums.mechanics.boss=true (off by default). One map, one fight, and the clear is
# the script's own clearPQ(): TD_Battle4.js writes no event property at all.
#
# What OUR scripts say the room is:
#  - gate: 1-6 players, levels 70-255, one lobby (TD_Battle4.js:26-28,41);
#  - entry: scripts/portal/TD_Boss_enter.js:4-5 names TD_Battle4 for a portal standing in 240070502, and :20 calls
#    em.startInstance(party, map, 1) - a party, not an expedition;
#  - the fight is one monster: 8220012 is the map instance's own life (Map.wz/Map/Map2/240070503.img.xml, mobTime -1 at
#    201,234); nothing in scripts/ or src/ spawns it and Mob.wz/08220012.img.xml has no info/revive;
#  - the clear is clearPQ -> eim.setEventCleared() with no property (TD_Battle4.js:225-228); timeout and playerExit both
#    changeMap to 240070502 (:30), where this row ends a run.
#
# The wz facts are from /root/work/SlumsMS-170-evan/wz, which is not version-pinned to this branch (docs/PROVENANCE.md).
id: oberon
name: Oberon (TD Battle 4)
kind: BOSS
eventScript: TD_Battle4
recruitMap: 240070502
exitMap: 240070502
minPlayers: 1
maxPlayers: 6
minLevel: 70
maxLevel: 255
timeLimitMinutes: 15
sources:
  - "scripts/event/TD_Battle4.js (ours, the truth): minPlayers 1 / maxPlayers 6 and levels 70-255 (:26-28), entryMap
    240070503 and exitMap 240070502 (:29-30), minMapId = maxMapId = 240070503 (:34-35), tdBossId 8220012 (:37),
    eventTime 15 (:39), maxLobbies 1 (:41); clearPQ sets the instance's flag and nothing else (:225-228)"
  - "scripts/portal/TD_Boss_enter.js:4-5,20 - the portal names the event from its own map and calls
    em.startInstance(party, map, 1)"
  - "Map.wz/Map/Map2/240070503.img.xml (dump /root/work/SlumsMS-170-evan/wz): the map's life is 8220012, mobTime -1, at
    (201,234). Mob.wz/08220012.img.xml: no info/revive, so the fight is one form"
  - "BotStory 81a3b1dfb3b6ec1619be4ced43ae0a8b6882b364, agent-bosses/boss-rules.json neo_oberon: targetPriority
    [8220012] - the same id our script states (:37). Its component model, focus/keepOut bands, ledges and stagePortal
    are fork-specific and are not imported"
stages:
  - stage: 1
    map: 240070503
    name: Oberon
    solver: boss-phases
    # the target is the instance's own life, so the room may stand empty while it arrives; 60 s is a policy number
    # (respawn animations plus a map instance's build, with margin), not a WZ one.
    spawnWaitSeconds: 60
    mobs:
      - 8220012
    objectives:
      - id: boss
        kind: DEFEAT
        mob: 8220012
        note: the only monster in the room; its death is the script's clearPQ
    clear:
      instance: true
