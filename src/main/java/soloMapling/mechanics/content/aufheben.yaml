# Ticket 130 boss lane, branch 164-bossrows: Aufheben (TD Battle 3, 1.6.4).
#
# Read only when the server runs with -Dslums.mechanics.boss=true (off by default). One map, one fight, and the clear is
# the script's own clearPQ(): TD_Battle3.js writes no event property at all.
#
# What OUR scripts say the room is:
#  - gate: 1-6 players, levels 70-255, one lobby (TD_Battle3.js:26-28,41);
#  - entry: scripts/portal/TD_Boss_enter.js:4-5 names TD_Battle3 for a portal standing in 240070402, and :20 calls
#    em.startInstance(party, map, 1) - a party, not an expedition;
#  - the fight is one monster: 8220011 is the map instance's own life (Map.wz/Map/Map2/240070403.img.xml, mobTime -1 at
#    -2889,653); nothing in scripts/ or src/ spawns it and Mob.wz/08220011.img.xml has no info/revive;
#  - the clear is clearPQ -> eim.setEventCleared() with no property (TD_Battle3.js:225-228); timeout and playerExit both
#    changeMap to 240070402 (:30), where this row ends a run.
#
# The wz facts are from /root/work/SlumsMS-170-evan/wz, which is not version-pinned to this branch (docs/PROVENANCE.md).
id: aufheben
name: Aufheben (TD Battle 3)
kind: BOSS
eventScript: TD_Battle3
recruitMap: 240070402
exitMap: 240070402
minPlayers: 1
maxPlayers: 6
minLevel: 70
maxLevel: 255
timeLimitMinutes: 15
sources:
  - "scripts/event/TD_Battle3.js (ours, the truth): minPlayers 1 / maxPlayers 6 and levels 70-255 (:26-28), entryMap
    240070403 and exitMap 240070402 (:29-30), minMapId = maxMapId = 240070403 (:34-35), tdBossId 8220011 (:37),
    eventTime 15 (:39), maxLobbies 1 (:41); clearPQ sets the instance's flag and nothing else (:225-228)"
  - "scripts/portal/TD_Boss_enter.js:4-5,20 - the portal names the event from its own map and calls
    em.startInstance(party, map, 1)"
  - "Map.wz/Map/Map2/240070403.img.xml (dump /root/work/SlumsMS-170-evan/wz): the map's life is 8220011, mobTime -1, at
    (-2889,653). Mob.wz/08220011.img.xml: no info/revive, so the fight is one form"
  - "BotStory 81a3b1dfb3b6ec1619be4ced43ae0a8b6882b364, agent-bosses/boss-rules.json neo_aufheben: minLevel 70 and
    targetPriority [8220011] - the same two numbers our script states. Its component model, focus/keepOut bands, ledges
    and stagePortal are fork-specific and are not imported"
stages:
  - stage: 1
    map: 240070403
    name: Aufheben
    solver: boss-phases
    # the target is the instance's own life, so the room may stand empty while it arrives; 60 s is a policy number
    # (respawn animations plus a map instance's build, with margin), not a WZ one.
    spawnWaitSeconds: 60
    mobs:
      - 8220011
    objectives:
      - id: boss
        kind: DEFEAT
        mob: 8220011
        note: the only monster in the room; its death is the script's clearPQ
    clear:
      instance: true
