# World events (SlumsMS ticket 21; spec: SoloMapling .pi-flow/world-events/spec.md).
#
# Scripted only: the EventDirector picks these by weight (1.6.0: one HEADLINE event every evening at ~8 PM PT, the
# template rotating, plus 1-3 SMALL ones at random times inside the peak windows; never more than 2 at once). No model
# ever picks, starts or runs an event. Rates, drops and shops are never touched; an event spawns its own mobs or NPC
# on one map (channel 1, where the bots live) for a fixed time and hands out only the reward table below, to real
# players only (bots never get event rewards).
#
# Reload live with !event reload. A template with a mistake is skipped and listed by !event list.
#
# Fields:
#   id                unique, letters/digits/_/-
#   kind              invasion | boss_sighting | treasure_hunt | hot_spot | wandering_npc | giant_cake
#   slot              headline (the evening event) | small (peak-hour extras) | manual (GM or another system only);
#                     default small, or manual when weight is 0
#   name              shown in bot chatter and megaphones
#   weight            relative pick among eligible templates (0 = only by GM)
#   minutes           how long it runs (1-120); every event ends at this time at the latest
#   cooldown_minutes  rest after it ends before the scheduler may pick it again (GM starts ignore this)
#   levels            [min, max] bot levels that react; leave out to derive it from the mobs/boss/map
#   bot_cap           most bots that head there, 0-200 (also capped by -Dsolomapling.worldEvents.botCap, default 200,
#                     and by the map's bot cap: BOT_MAP_CAP, or WORLD_EVENT_MAP_MAX (200) on an invasion's map while it
#                     runs; arrivals stop 5 under it)
#   maps / spots      where it can happen (one is picked at random). spots carry `mob` (boss_sighting) or
#                     `item` + `count` (wandering_npc: what the traveler asks each player for)
#   waves, boss       invasion: mob waves in order, then the boss; the next wave comes when a wave is cleared. A wave
#                     may bring a `mini_boss` (a mob id, spawned once at its own WZ stats with the wave; the wave is
#                     cleared when it falls too)
#   npc               treasure_hunt: the hidden chest NPC; wandering_npc: the traveler
#   exp_bonus         hot_spot: EXP multiplier on that one map for real players (above 1.0, at most 2.0)
#   boss              invasion: the boss after the last wave; giant_cake: the cake itself
#   boss_hp           the boss's HP for this event (0 = its normal HP; at most 50,000,000)
#   rewards           [{item, qty, chance}] given to the winner (invasion/boss/cake: the real player who did the most
#                     damage to the boss; treasure: the first real player to open the chest; wandering_npc: every
#                     player who turns the quest in, once each). chance defaults to 1.0.
#   participation     [{item, qty, chance}] for every real player who took part in a won boss fight (hit the boss, or
#                     stood on the map when it fell), once each
#   participation_exp_pct  participation EXP for those players, in percent of their current level (0-10)
#   enabled           false keeps it out of the scheduler and !event start
#
# Owner 2026-10-26: events stay on live; rewards vanilla-style at our normal rates: the consumable tables below, the
# event mobs' own EXP and drops at the server rates, no participation EXP and no Hot Spot EXP bonus.
# Reward rules: the reward tables are a first suggestion (consumables only: potions and cakes, item ids 200xxxx-202xxxx; no
# mesos, no equipment, no scrolls - the loader refuses anything else). Change or empty them as you like;
# -Dsolomapling.worldEvents.rewards=false switches every table off. The events' own mobs drop what they always drop.

templates:
  # ── 1.6.0 headline events: every evening at ~8 PM PT in Henesys, Giant Cake and Henesys Invasion taking turns ─────────────────────────────────────────
  # The friends' ask: everyone gathers in town to whack a giant cake, as at the old anniversary events. 9400606 is
  # v83's own "Giant Cake" (the 2007 anniversary cake, the mob Cosmic's !cake spawns); boss_hp makes it last for a
  # crowd. Little Cake Monsters and Birthday Candles come with it, so new characters have something to hit too.
  - id: giant_cake
    kind: giant_cake
    slot: headline
    name: Giant Cake
    weight: 3
    minutes: 30
    cooldown_minutes: 600
    bot_cap: 40
    levels: [1, 200]
    maps: [100000000]                            # Henesys (owner 2026-10-26: the nightly event is always in Henesys)
    boss: 9400606                                # Giant Cake (lv 70)
    boss_hp: 4000000
    waves:
      - {mob: 9400607, count: 12}                # Cake Monster (lv 15)
      - {mob: 9400601, count: 10}                # Birthday Candle (lv 20)
    rewards:                                     # the real player with the most damage on the cake
      - {item: 2020032, qty: 5}                  # Birthday Cake
      - {item: 2020017, qty: 3}                  # Strawberry Cream Cake
      - {item: 2020018, qty: 1, chance: 0.5}     # Chocolate Cream Cake
    participation:
      - {item: 2020032, qty: 2}                  # Birthday Cake

  # "I just wanna see a bunch of bots die": a town invasion. Bots in the band swarm it, really fight, and on this map a
  # heavy hit can kill them (no immunity); they respawn as usual and grumble about it.
  # Owner 2026-10-26 ("Just want bots dying lmao"): a TEST run drew bots up to lv 70 (the derived band 17-70) who
  # cleared each mushroom wave in under a minute and never died. Now only lv 15-40 answer (a lv 70 would not bother),
  # and the last wave and the boss hit hard: Evil Eyes from the Ant Tunnel led by Mushmom (~100 a touch), then Zombie
  # Mushmom (~125). Every mob gives its own EXP and drops at the server rates; no bonus.
  # Owner 2026-10-27 ("there should be madness, even lower levels should get in"): lv 1-40, most called bots come at
  # once (no brain offer), the closest first, and the town bots already in Henesys fight or run (InvasionTownCrowd).
  # Owner 2026-10-27 ("It needs to be harder mobs"): on TEST ~100 lv 1-40 bots cleared the old mushroom waves in ~92 s
  # and none died by itself. Now six waves of lv 50-80 field mobs a lv 30-70 player knows (all in the v83 client), each
  # tougher than the last, then Jr. Balrog (lv 80) with a crowd-sized HP. TEST: the called crowd kills a 40-mob wave in
  # well under a minute and a 2M HP boss in ~20 s, so the fight's length is the big waves and the boss; a lv 1-40 bot
  # in them dies (paced one per 15 s and capped by WorldEvents' swarm rules), and the crowd still wins.
  - id: henesys_invasion
    kind: invasion
    slot: headline
    name: Henesys Invasion
    weight: 2
    minutes: 30
    cooldown_minutes: 600
    bot_cap: 150                                 # owner 2026-10-27 "madness": the map takes 200 while it runs
    levels: [1, 40]                              # owner 2026-10-27: "even lower levels should get in"
    maps: [100000000]                            # Henesys
    waves:                                       # owner 2026-10-27: harder mobs
      - {mob: 5130100, count: 40}                # Drake (lv 50, 3,200 HP)
      - {mob: 6230100, count: 40}                # Wild Kargo (lv 62, 5,500 HP)
      - {mob: 7130100, count: 40}                # Tauromacis (lv 70, 15,000 HP)
      - {mob: 7130200, count: 40, mini_boss: 6300005}  # Werewolf (lv 75, 16,000 HP), led by Zombie Mushmom (lv 65, its own 35,000 HP)
      - {mob: 7130101, count: 40}                # Taurospear (lv 75, 18,000 HP)
      - {mob: 8140000, count: 40}                # Lycanthrope (lv 80, 27,000 HP)
    boss: 8130100                                # Jr. Balrog (lv 80)
    boss_hp: 15000000
    rewards:
      - {item: 2000004, qty: 5}                  # Elixir
      - {item: 2000005, qty: 2, chance: 0.3}     # Power Elixir
    participation:
      - {item: 2000004, qty: 2}                  # Elixir

  # Owner 2026-10-26: GM only (the nightly slot alternates Giant Cake and Henesys Invasion); !event start perion_invasion
  - id: perion_invasion
    kind: invasion
    slot: manual
    name: Perion Invasion
    weight: 0
    minutes: 30
    cooldown_minutes: 600
    bot_cap: 150
    levels: [1, 40]                              # 2026-10-27: a town invasion like Henesys's: low levels join (and die)
    maps: [102000000]                            # Perion
    waves:
      - {mob: 2230102, count: 18}                # Wild Boar (lv 25)
      - {mob: 3210100, count: 16}                # Fire Boar (lv 32)
      - {mob: 4230400, count: 10}                # Iron Boar (lv 45)
    boss: 3220000                                # Stumpy (lv 35)
    boss_hp: 120000
    rewards:
      - {item: 2000004, qty: 5}                  # Elixir
      - {item: 2000005, qty: 2, chance: 0.3}     # Power Elixir
    participation:
      - {item: 2000004, qty: 2}                  # Elixir

  # ── small events: 1-3 a day at random times inside the peak windows ────────────────────────────────────────
  - id: mushroom_invasion
    kind: invasion
    name: Mushroom Invasion
    weight: 3
    minutes: 25
    cooldown_minutes: 240
    bot_cap: 10                                  # 2026-10-27 "madness": a crowd, at the small-event ceiling
    levels: [1, 40]                              # owner 2026-10-27: lower levels get in too (derived it was 17-70)
    maps: [105050000, 105050100, 105070001]      # Ant Tunnel I, Ant Tunnel II, Ant Tunnel Park
    waves:
      - {mob: 2110200, count: 14}                # Horny Mushroom
      - {mob: 2230101, count: 14}                # Zombie Mushroom
    boss: 6130101                                # Mushmom
    rewards:
      - {item: 2000004, qty: 5}                  # Elixir
      - {item: 2000005, qty: 2, chance: 0.3}     # Power Elixir

  - id: boar_stampede
    kind: invasion
    name: Boar Stampede
    weight: 3
    minutes: 25
    cooldown_minutes: 240
    bot_cap: 10                                  # 2026-10-27 "madness": a crowd, at the small-event ceiling
    levels: [20, 40]                             # owner 2026-10-26: the boars' band (a field far from beginners)
    maps: [101040001, 101030001]                 # Land of Wild Boar, The Land of Wild Boar II
    waves:
      - {mob: 2230102, count: 14}                # Wild Boar
      - {mob: 3210100, count: 12}                # Fire Boar
    boss: 3220000                                # Stumpy
    rewards:
      - {item: 2000004, qty: 4}                  # Elixir
      - {item: 2000005, qty: 1, chance: 0.25}    # Power Elixir

  - id: field_boss
    kind: boss_sighting
    name: Field Boss Sighting
    weight: 4
    minutes: 30
    cooldown_minutes: 90
    bot_cap: 6
    spots:
      - {map: 104000400, mob: 2220000}           # Mano at Thicket Around the Beach III
      - {map: 101030102, mob: 3220000}           # Stumpy at Excavation Site II
      - {map: 100040105, mob: 5220002}           # Faust at The Forest of Evil I
      - {map: 107000300, mob: 6220000}           # Dyle at Dangerous Croko I
    rewards:
      - {item: 2000004, qty: 3}                  # Elixir

  - id: hot_spot
    kind: hot_spot
    name: Hot Spot
    weight: 4
    minutes: 30
    cooldown_minutes: 120
    bot_cap: 6
    exp_bonus: 1.5
    enabled: false                               # owner 2026-10-26: our rates only, no EXP bonus maps
    maps: [104040001, 101040001, 105050100, 105040301, 100040101, 106000002]
    # Henesys Hunting Ground II, Land of Wild Boar, Ant Tunnel II, Sleepy Dungeon I, Monkey Forest I,
    # Dangerous Valley II

  - id: treasure_hunt
    kind: treasure_hunt
    name: Treasure Hunt
    weight: 2
    minutes: 20
    cooldown_minutes: 180
    bot_cap: 4
    npc: 1052008                                 # Treasure Chest
    maps: [100020000, 104040002, 101010100, 101030400, 102020000, 103020000, 100040100, 101040000]
    levels: [10, 200]
    rewards:
      - {item: 2000004, qty: 3}                  # Elixir
      - {item: 2000005, qty: 1, chance: 0.5}     # Power Elixir

  - id: wandering_explorer
    kind: wandering_npc
    name: Wandering Explorer
    weight: 2
    minutes: 30
    cooldown_minutes: 180
    npc: 2060101                                 # Taeng the Explorer
    spots:
      - {map: 100000000, item: 4000001, count: 20}   # Henesys: Orange Mushroom Caps
      - {map: 101000000, item: 4000004, count: 20}   # Ellinia: Squishy Liquid
      - {map: 102000000, item: 4000020, count: 15}   # Perion: Wild Boar Teeth
      - {map: 104000000, item: 4000000, count: 20}   # Lith Harbor: Blue Snail Shells
    rewards:
      - {item: 2000004, qty: 2}                  # Elixir

  # Ticket 58 (1.5.0): a bot couple's wedding, staged in front of the Amoria chapel. Weight 0: the generic scheduler
  # never picks it; BotCouples starts it for a couple that is ready (or a GM: !couple wedding). No rewards.
  - id: amoria_wedding
    kind: wedding
    name: Amoria Wedding
    weight: 0
    minutes: 6
    cooldown_minutes: 0
    # 680000110 (the White Wedding Altar, Amoria's chapel) only when asked for (BotWeddings.start with CHAPEL: !qa we-1);
    # BotWeddings always names the map, so a live wedding stays in Amoria town where anyone can watch.
    maps: [680000000, 680000110]                 # Amoria, its chapel
