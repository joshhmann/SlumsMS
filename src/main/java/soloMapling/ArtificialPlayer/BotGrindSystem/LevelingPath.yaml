# Leveling path for training bots (ticket 31): where bots grind, by level band AND job group.
#
# Read by LevelingPath.java from this path relative to the server's working directory (like TrainingRegions.yaml;
# it is not inside the jar - see docs/release/1.3.0.md step 9). Edit and reload live with `!env path reload`.
# Built from docs/real-bots/leveling-path-draft.yaml (research: docs/real-bots/leveling-path-research.md).
#
# How a training bot uses it (LevelingPathChooser): on most decisions (-Dsolomapling.levelPath.follow, default
# 0.75; always when nothing around its home fits its level) it takes its band and job group, and draws one entry:
#   - group entries at full weight, the band's `general` entries mixed in at a lower weight (a group with no
#     entries in a band uses `general` alone);
#   - weight `w` x the bot's own favourites (a stable per-bot bias per continent) x free room on the map
#     (spot capacity minus bots already headed there; a full map is skipped) x the map's ticket-15 yield
#     headroom, with maps around the bot's home preferred over a trip abroad.
# An entry is skipped for that bot when: the map has no mobs or fewer than 2 spawns in this WZ, it is a
# mini-dungeon, it lies in a region TrainingRegions.yaml disables, BotMapGates closes it at the bot's rebirths
# (`rebirths:` below only documents the gate), its median mob level is more than 15 above the bot, it is on the
# bot's crowd cooldown, or no route (walk, cab, boat...) reaches it from the bot's home within its mesos.
# Nothing valid -> the bot falls back to the old behaviour (nearby maps by level, TrainingRegions relocation).
#
# Bands: [lo, hi) by bot level; the last band includes 255. w: relative weight. mode: solo | party | both
# (party spots get half weight for a solo bot). mob_levels / name: documentation (the code reads mob levels from WZ).
#
# Validation against the server WZ (2026-10-20, Map.wz/Mob.wz from the 1.3.0 test install): 509 entries,
# 269 distinct maps; every map exists and has 2+ mob spawns. 5 entries are disabled below with `# INVALID`
# (4 Knight Stronghold maps no bot may enter, 1 mini-dungeon). 109 entries lie outside TrainingRegions.yaml's
# regions (Temple of Time, Twilight Perion, Edelstein, Mirror World, Grandis, Malaysia, Ereve, Rien, Florina):
# the path may send bots there when a route exists; TrainingRegions' `enabled: false` still closes a region.
#
# Reachability (2026-10-20, ticket 03 follow-up): 43 entries are disabled with `# UNREACHABLE` - maps no player can
# reach on this server either (Mirror World/Kritias/Umbra fields: CANNOTVIPROCK and no way in; LKC past Walls 1:
# tower keys; Temple of Time lanes past Memory Lane 1: lane quests; Ninja Castle corridors; Mushroom Castle; the
# Aran tutorial forest). 28 reachable entries replace them in 120-200 so every band has maps at rebirth 0-2
# (Ulu City, the Skele nests, Crimsonwood Keep, LKC Walls 1 at rebirth 1, Gate to the Future and Twilight Perion
# at rebirth 2, the Scrapyard by hyper rock); rebirth-3 zones stay as bonuses. Nothing open below rebirth 2 has
# mobs above ~120 on this server, so rebirth 0-1 bots from 140 up keep to those strongest classic maps.
# Offline check: LevelPathSweepCheck (all entries reachable from Henesys at the band's lowest level).
#
# 1.6.1 (tickets 81/b041): the Future and lower Grandis open at level 120 without rebirths (server.maps.AreaGates,
# BotMapGates), Lion King's Castle needs no rebirth (b040). `level: 120` marks those entries (documentation, like
# `rebirths:`). Bots of 120-140 now train mostly in lower Grandis (15 entries). Owner 2026-10-29: Leafre of the Past
# (272000100-600, the Future's lv 124 maps) opens as the Gate of Time's third choice, so the Future starts at level 120
# there (6 entries at 120-140, 2 at 140-160); its other maps have lv 162+ mobs and come in from about lv 147.
#
# Owner 2026-10-29: deeper Grandis (everything outside lower-grandis-maps.txt) opens at the 1st rebirth and Arcane River
# at the 2nd, at any level (both were 3); their entries say `rebirths: 1` / `rebirths: 2`. The Future and Twilight
# Perion open at level 120 or the 1st rebirth (owner 2026-10-29, was 2); their entries say `level: 120`. Lower Grandis keeps level 120
# or the 1st rebirth (owner 2026-10-29, was 3; the `rebirths: 1` entries at 110-120 are lower Grandis for reborn bots
# under 120).
