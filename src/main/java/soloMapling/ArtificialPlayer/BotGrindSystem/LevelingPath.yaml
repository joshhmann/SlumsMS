job_groups:
  # bot job id ranges -> group; a group with no entry in a band falls back to "general".
  warrior: [100-132]
  mage_fp: [200, 210-212]   # 200 = first-job magician, before the F/P, I/L or cleric split
  mage_il: [220-222]
  mage_cleric: [230-232]
  archer: [300-322]
  thief: [400-422]
  pirate_brawler: [500, 510-512]
  pirate_gunslinger: [520-522]
  aran: [2000, 2100-2112]
  cygnus: [1000]
inherits:
