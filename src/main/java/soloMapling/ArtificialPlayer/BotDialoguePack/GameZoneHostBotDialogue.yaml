      - "I just watched a player deliberate over a single bet for three solid minutes. Beautiful."
      - "Someone just walked in still wearing their hunting gear. Love the dedication."
      - "A player just said 'one more game.' They'll be here for another hour. I guarantee it."
      - "Somewhere out there a player is watching their scroll fail. They should be here instead."
