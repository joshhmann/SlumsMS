  Flavor:
    text:
      - "Come one, come all! The Game Zone is open for business!"
      - "Who wants to test their luck today?"
      - "The house always wins... or does it?"
      - "Place your bets, ladies and gentlemen!"
      - "Roll the dice, flip the cards, try your luck!"
      - "Step right up, don't be shy! Everyone's a winner... eventually!"
