# 1.5.0 bot drama (BotDramaSystem): romance with players (opt-in: @romance on), spicy rivals, guild wars.
# Bot map chat and whispers, so @quiet bots hides the chatter. Content rules (owner, 2026-10-22), checked by a test and by
# ContentGuard at speaking time:
#   - romance is flirty, cheesy and dramatic, PG-13: never sexual or explicit
#   - trash talk stays about the GAME (gear, level, job, deaths, KS habits): never slurs, looks, family or real life
# Tokens: {PLAYER} the player, {BOT} the bot speaking about itself or the partner, {OTHER} a third character,
# {MAP} a map name, {LEVEL} {JOB} {DEATHS} {WEAPON} {GUILD} {RIVAL} {SCORE} as named. A line with an unfilled token is
# skipped. Keep the old-GMS chat feel: short, lowercase, no emojis (the v83 client cannot draw them).
