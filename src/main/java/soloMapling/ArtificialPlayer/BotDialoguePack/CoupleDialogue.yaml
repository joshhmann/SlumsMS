# Ticket 58 (1.5.0): bot couples (BotCouples) and the Amoria wedding ceremony (BotWeddings). Bot map chat, so
# @quiet bots hides it. Bots only ever pair with bots, any genders; FRIENDS are best friends (Friend* nodes). Sweet, never explicit (ticket 47 content rules).
# Tokens: {PARTNER} the other half, {GROOM} {BRIDE} the couple, {OFFICIANT} the bot leading the ceremony.
# Keep the old-GMS chat feel: short, lowercase.
Couple:
  Mention:
    text:
      - "{PARTNER} come here lol"
      - "waiting for {PARTNER} ^^"
      - "{PARTNER} <3"
      - "{PARTNER} wanna go train after this?"
      - "hehe {PARTNER}"
      - "{PARTNER} look at this map"
      - "miss u {PARTNER}"
  Sit:
    text:
      - "sit w me {PARTNER}"
      - "comfy :)"
      - "break time w {PARTNER}"
  Formed:
    text:
      - "{PARTNER} ur cute lol"
      - "wanna hang out more {PARTNER}?"
      - "{PARTNER} :$"
  FriendMention:
    text:
      - "{PARTNER} come train w me"
      - "yo {PARTNER} lol"
      - "{PARTNER} u seeing this?"
      - "{PARTNER} ^^ lets go"
      - "{PARTNER} wait up"
      - "{PARTNER} brb pots"
  FriendFormed:
    text:
      - "{PARTNER} ur cool, lets train together more"
      - "gg {PARTNER} we make a good team"
      - "{PARTNER} add me lol"
Wedding:
  Officiant:
    text:
      - "we are gathered here today in amoria..."
      - "{GROOM} and {BRIDE}, step up to the altar"
  Vows:
    text:
      - "i do"
      - "i do <3"
      - "yes, i do ^^"
  RingsGiven:
    text:
      - "{GROOM} and {BRIDE}, please exchange the rings"
      - "the rings please ^^"
  Pronounce:
    text:
      - "i now pronounce {GROOM} and {BRIDE} married!!"
      - "congratulations {GROOM} and {BRIDE}!! <3"
  # rc6 (QA t-we-1): the crowd's chatter before "married" (GuestWait) and after it (Guest)
  GuestWait:
    text:
      - "omg {GROOM} and {BRIDE} are actually getting married"
      - "i always cry at weddings lol"
      - "who's catching the bouquet"
      - "{BRIDE} looks so good"
      - "{GROOM} looks nervous lol"
      - "shh its starting"
      - "this is so cute"
      - "is there cake after"
      - "i saw them training together at the subway lol"
      - "ok who brought tissues"
      - "front row seats ^^"
      - "they make a cute couple"
      - "my turn next? lol jk"
      - "i dressed up for this lol"
  Guest:
    text:
      - "congrats!!"
      - "omg so cute"
      - "grats {GROOM} {BRIDE} <3"
      - "T_T so happy for u two"
      - "kiss kiss lol"
      - "gz!!"
      - "*throws flowers*"
      - "*claps*"
      - "best wedding ever"
      - "the rings r so pretty"
      - "{GROOM} {BRIDE} forever <3"
      - "after party at the fm lol"
      - "kiss!! kiss!!"
# 1.6.0 S7: a crush before a couple, and a couple's jealousy and breakups (bot with bot only). {PARTNER} the crush, {OTHER} a third character.
Crush:
  Line:
    text:
      - "hi {PARTNER} :)"
      - "{PARTNER} wanna train together sometime"
      - "{PARTNER} ur so good at this game"
      - "{PARTNER} nice outfit lol"
      - "{PARTNER} i saved u a spot"
      - "{PARTNER} :$"
  Jealous:
    text:
      - "why is {PARTNER} talking to {OTHER}"
      - "{OTHER} go away lol"
      - "{OTHER} ur in the way"
  Over:
    text:
      - "nvm"
      - "whatever, didnt want to anyway"
  CoupleJealous:
    text:
      - "{OTHER} back off, {PARTNER} is taken"
      - "{OTHER} stop following {PARTNER} around"
  CoupleFight:
    text:
      - "{PARTNER} u never wait for me"
      - "{PARTNER} why were u with {OTHER} earlier"
      - "{PARTNER} we need to talk"
  CoupleBreakup:
    text:
      - "{PARTNER} its over"
      - "were done {PARTNER}"
      - "bye {PARTNER}. for real this time"
