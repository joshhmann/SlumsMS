# Bot transit: the paid and scheduled hops between maps that have no walkable portal (ticket 03).
#
# Every row mirrors what the server's own scripts do for a player, so bots ride the same boats on the
# same schedules and pay the same fares:
#   scripts/event/{Boats,Trains,Cabin,Genie,AirPlane,Subway,Hak}.js  - schedules and the maps they move
#   scripts/npc/<id>.js                                               - fares, ticket gates, warp targets
#   MapleMap.addPlayer (SkyFerry rides)                               - the Ereve ferries' own timers
#
# Two kinds of edge:
#   via: npc / portal  - walk to the NPC (or the scripted portal), pay `fare`, then go to `to`.
#       seller:        the ticket seller standing on the same map; on-screen bots walk to it first.
#       event:         a scheduled ride; boarding waits until that event's "entry" property is "true",
#                      exactly like the boarding NPC's own check.
#       beginner_fare: the fare for a Beginner (job 0), as the cab scripts charge.
#       to_portal:     the arrival portal (id or name) the script warps to.
#       save_location: saves the bot's current map under that slot first (the World Tour).
#       return_to_saved: goes back to the map saved under that slot instead of `to` (the World Tour's way
#                      home). `to` is only the planner's guess.
#   via: ride - the bot is already aboard and waits on this map.
#       server: true   the server moves it (an event's warpEveryone, or a ferry's own timer); `sec` is the
#                      longest wait, after which the bot is moved anyway so it can never be stranded.
#       server: false  nothing on the server moves a bot here (Hak and the dragon run per-player
#                      instances), so the bot itself goes to `to` after `sec`.
#
# `sec` is also the route planner's cost for the edge (a walked portal costs 20). All times are at
# travel_rate 1 and are scaled by the world's travel rate at run time, like the scripts' own timers.
# Edges whose maps are gated out of the bot version (portal_versions.yaml) are dropped at load.

