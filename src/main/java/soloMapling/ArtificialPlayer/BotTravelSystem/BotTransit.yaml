# ── The Hyper Teleport Rock (HyperTPHandler), as bots may use it ──
# A player can teleport from the world map to any map except the restricted ones (Knight Stronghold), those its
# rebirth gates close (Von Leon's wing 1, the Future 2 or level 120, lower Grandis 3 or level 120, deeper Grandis 1,
# Arcane River 2) and fields with the CANNOTVIPROCK limit; a player
# without the rock (5590001) may do it once every 5 minutes. Bots get a narrow version so they keep riding the
# boats everywhere else:
#   into:   maps a bot may teleport to from anywhere - only areas no script or portal reaches: Black Heaven.
#           Edelstein's road there (level700BH) and the Skyline/deck portals (w310070300, b310070) have no script
#           on this server, so the rock is the only way in: to the Scrapyard's Haven, and to the Black Heaven
#           Entrance for the decks and the maze.
#   out_of: map-id ranges [min, max) a bot may teleport out of, to one of the `home` towns - areas with no
#           other way back to the classic world.
# Mirror World, Kritias and Umbra fields are NOT here: they carry CANNOTVIPROCK and no portal or script reaches
# them, so no player can get there either. enabled: false turns the rock off for bots.
hyper_rock:
  enabled: true
  cooldown_sec: 300
  into: [310070000, 310070310]
  # Edelstein, Scrapyard and Black Heaven; Black Heaven inside; Grandis and Arcane River (the Henesys teleporter
  # has no way back).
  out_of: [{min: 310000000, max: 311000000}, {min: 350000000, max: 351000000}, {min: 400000000, max: 460000001}]
  home: [100000000, 101000000, 102000000, 103000000, 104000000]
